function SystemTab({ themeName, logoUrl, config, onSync, syncState, setConfig, setLogoUrl, webhookUrl }) {
  useTheme();
  const [importErr, setImportErr] = useState('');
  const [importOk, setImportOk] = useState('');
  const [actionMsg, setActionMsg] = useState('');

  const flashAction = (msg) => { setActionMsg(msg); setTimeout(() => setActionMsg(''), 2200); };

  const lastSync = ApiModule.getLastSync();
  const lastSyncStr = lastSync
    ? lastSync.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })
    : 'Never';

  const storageBytes = StorageModule.totalUsage();
  const configStatus = (() => {
    const wh = (config && config.webhookUrl) || '';
    const gs = (config && config.googleSheetUrl) || '';
    if (wh && gs) return { ok: true, label: 'Fully configured' };
    if (wh || gs) return { ok: null, label: 'Partially configured' };
    return { ok: false, label: 'Not configured' };
  })();

  const handleExport = () => {
    try { ExportImportModule.exportSettings(); flashAction('✓ Settings exported'); }
    catch(e) { flashAction('✕ Export failed: ' + e.message); }
  };

  const handleImport = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        setImportErr(''); setImportOk('');
        const result = ExportImportModule.importSettings(ev.target.result, { setConfig, setLogoUrl });
        if (result.ok) { setImportOk('✓ Settings imported successfully. Refresh to see all changes.'); }
        else { setImportErr('Import errors: ' + result.errors.join(' · ')); }
      };
      reader.readAsText(file);
    };
    inp.click();
  };

  const handleClearCache = () => {
    StorageModule.clearCache();
    flashAction('✓ Cache cleared');
  };
  const handleResetTheme = () => {
    setGlobalTheme('Navy Dark');
    flashAction('✓ Theme reset to Navy Dark');
  };
  const handleResetSettings = () => {
    ConfigService.reset();
    setConfig({ ...DEFAULT_CONFIG });
    flashAction('✓ Settings reset to defaults');
  };

  const InfoRow = ({ label, value, ok }) => (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '9px 0', borderBottom: `1px solid ${S.T.border2}` }}>
      <span style={{ fontSize: 13, color: S.T.textSecondary }}>{label}</span>
      <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        {ok === true && <span style={{ color: S.T.success, fontSize: 11, fontWeight: 700 }}>●</span>}
        {ok === false && <span style={{ color: S.T.danger, fontSize: 11, fontWeight: 700 }}>●</span>}
        {ok === null && <span style={{ color: S.T.warning, fontSize: 11, fontWeight: 700 }}>●</span>}
        <span style={{ fontSize: 13, fontWeight: 600, color: S.T.textPrimary }}>{value}</span>
      </span>
    </div>
  );

  return (
    <div>
      {/* System Information */}
      <div style={{ ...S.card, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight, marginBottom: 14 }}>System Information</div>
        <InfoRow label="Application Version" value={APP_VERSION} ok={true} />
        <InfoRow label="Current Theme" value={themeName} ok={true} />
        <InfoRow label="Last Sync" value={lastSyncStr} ok={lastSync ? true : null} />
        <InfoRow label="Sync Status" value={syncState ? syncState.message : '—'} ok={syncState && syncState.status === 'ok' ? true : syncState && syncState.status === 'error' ? false : null} />
        <InfoRow label="Local Storage Usage" value={StorageModule.formatBytes(storageBytes)} ok={storageBytes < 4*1024*1024 ? true : false} />
        <InfoRow label="Configuration Status" value={configStatus.label} ok={configStatus.ok} />
        <InfoRow label="Apps Script URL" value={(config && config.appsScriptUrl) ? 'Configured' : 'Not set'} ok={(config && config.appsScriptUrl) ? true : false} />
        <InfoRow label="Logo Status" value={logoUrl ? 'Custom URL set' : 'Using default embedded logo'} ok={logoUrl ? true : null} />
        <InfoRow label="Theme System" value={`${Object.keys(THEMES).length} themes available`} ok={true} />
        <InfoRow label="Cache Key" value={localStorage.getItem(CACHE_KEY) ? 'Populated' : 'Empty'} ok={null} />
      </div>

      {/* Backfill Last Readings */}
      <div style={{ ...S.card, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight, marginBottom: 6 }}>Backfill Last Readings</div>
        <div style={{ fontSize: 12, color: S.T.textSecondary, marginBottom: 14, lineHeight: 1.6 }}>
          Scans all RMS DATA and SPM DATA history, finds the latest reading per equipment+point, and writes it to
          <b> 📋 Last RMS Reading</b> and <b>📋 Last SPM Reading</b>. Run this once after initial setup.
          The Dashboard uses these sheets for fast equipment status display.
        </div>
        <BackfillButton webhookUrl={(config && config.webhookUrl) || ''} />
      </div>

      {/* Export / Import */}
      <div style={{ ...S.card, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight, marginBottom: 6 }}>Export / Import Settings</div>
        <div style={{ fontSize: 12, color: S.T.textSecondary, marginBottom: 14, lineHeight: 1.6 }}>
          Export saves your current theme, configuration, logo URL, and preferences to a JSON file.
          Import loads a previously exported file and applies all settings.
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button style={{ ...S.btn, display:'flex', alignItems:'center', gap:6 }} onClick={handleExport}>
            ↓ Export Settings
          </button>
          <button style={{ ...S.btnSecondary, display:'flex', alignItems:'center', gap:6 }} onClick={handleImport}>
            ↑ Import Settings
          </button>
        </div>
        {importErr && <div style={{ marginTop: 10, fontSize: 12, color: S.T.danger, fontWeight: 600 }}>{importErr}</div>}
        {importOk && <div style={{ marginTop: 10, fontSize: 12, color: S.T.success, fontWeight: 600 }}>{importOk}</div>}
      </div>

      {/* Actions */}
      <div style={{ ...S.card, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight, marginBottom: 6 }}>Actions</div>
        <div style={{ fontSize: 12, color: S.T.textSecondary, marginBottom: 14 }}>
          Manage application state and reset options.
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 10 }}>
          <button style={S.btnSecondary} onClick={onSync}>Sync Data Now</button>
          <button style={S.btnSecondary} onClick={handleClearCache}>Clear Cache</button>
          <button style={S.btnSecondary} onClick={handleResetTheme}>Reset Theme</button>
          <button style={{ ...S.btnSecondary, color: S.T.danger, borderColor: S.T.danger }} onClick={handleResetSettings}>Reset Settings</button>
        </div>
        {actionMsg && (
          <div style={{ marginTop: 12, fontSize: 12.5, color: actionMsg.startsWith('✓') ? S.T.success : S.T.danger, fontWeight: 700 }}>
            {actionMsg}
          </div>
        )}
      </div>

      {/* Architecture Notes */}
      <div style={{ ...S.cardSub, fontSize: 12, color: S.T.textMuted, lineHeight: 1.7 }}>
        <b style={{ color: S.T.textSecondary }}>Architecture modules loaded:</b>{' '}
        ConfigService · StorageModule · NotificationModule · ReportModule · ApiModule · ExportImportModule
        <br/>
        <b style={{ color: S.T.textSecondary }}>Future-ready:</b>{' '}
        PDF report generation (ReportModule) · Email notifications (NotificationModule) · Auto-sync scheduler · SMTP integration
      </div>
    </div>
  );
}

function SettingsPage({ sheetUrl, setSheetUrl, webhookUrl, setWebhookUrl, themeName, onSync, logoUrl, setLogoUrl, config, setConfig, syncState }) {
  useTheme();
  const [activeTab, setActiveTab] = useState('appearance');
  const [configUnlocked, setConfigUnlocked] = useState(false);
  const [showPasskey, setShowPasskey] = useState(false);
  const [diag, setDiag] = useState(null);
  const [running, setRunning] = useState(false);
  const [copied, setCopied] = useState(false);

  const runDiagnostics = async () => {
    const wh = (config && config.webhookUrl) || webhookUrl;
    setRunning(true);
    const steps = [];
    if (!wh) {
      steps.push({ label: 'Webhook URL configured', ok: false, detail: 'No webhook URL set in Configuration.' });
      setDiag(steps); setRunning(false); return;
    }
    steps.push({ label: 'Webhook URL configured', ok: true, detail: wh });
    setDiag([...steps]);
    try {
      const t0 = Date.now();
      const testResult = await sheetRead(wh, 'test');
      const ms = Date.now() - t0;
      const ok = testResult && testResult.status === 'ok';
      steps.push({ label: 'Connection test (action=test)', ok, detail: ok ? `OK — ${ms}ms — server time ${testResult.time}` : `Unexpected: ${JSON.stringify(testResult)}` });
    } catch (err) {
      steps.push({ label: 'Connection test (action=test)', ok: false, detail: String(err.message || err) });
      setDiag([...steps]); setRunning(false); return;
    }
    setDiag([...steps]);
    try {
      const data = await sheetRead(wh, 'readAll');
      if (data && data.error) { steps.push({ label: 'readAll — JSON validity', ok: false, detail: `Server error: ${data.error}` }); }
      else {
        steps.push({ label: 'readAll — JSON validity', ok: true, detail: 'Valid JSON received.' });
        steps.push({ label: '📥 RMS DATA rows', ok: Array.isArray(data.rms) && data.rms.length > 0, detail: `${(data.rms||[]).length} rows` });
        steps.push({ label: '📥 SPM DATA rows', ok: Array.isArray(data.spm) && data.spm.length > 0, detail: `${(data.spm||[]).length} rows` });
        steps.push({ label: '📋 Compliance Tracker rows', ok: Array.isArray(data.compliance) && data.compliance.length > 0, detail: `${(data.compliance||[]).length} equipment` });
      }
    } catch (err) { steps.push({ label: 'readAll — JSON validity', ok: false, detail: String(err.message || err) }); }
    setDiag([...steps]);
    setRunning(false);
  };

  const handleCopy = () => {
    try { navigator.clipboard.writeText(APPS_SCRIPT_CODE); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {}
  };

  const handleTabClick = (tab) => {
    if (tab === 'configuration' && !configUnlocked) { setShowPasskey(true); return; }
    setActiveTab(tab);
  };

  const tabs = [
    { key: 'appearance', label: 'Appearance' },
    { key: 'configuration', label: configUnlocked ? 'Configuration' : 'Configuration 🔒' },
    { key: 'system', label: 'System' },
  ];

  return (
    <div style={{ padding: 24, maxWidth: 900 }}>
      {showPasskey && (
        <PasskeyModal
          onUnlock={() => { setConfigUnlocked(true); setShowPasskey(false); setActiveTab('configuration'); }}
          onCancel={() => setShowPasskey(false)}
        />
      )}

      {/* Tab switcher */}
      <div style={{ display: 'flex', gap: 0, marginBottom: 22, border: `1px solid ${S.T.border}`, borderRadius: 10, overflow: 'hidden', width: 'fit-content' }}>
        {tabs.map(tab => {
          const isActive = activeTab === tab.key;
          return (
            <div key={tab.key} onClick={() => handleTabClick(tab.key)}
              style={{
                padding: '10px 22px', fontSize: 13.5, fontWeight: 700, cursor: 'pointer',
                background: isActive ? S.T.accent : 'transparent',
                color: isActive ? S.T.accentText : S.T.textSecondary,
                transition: 'all 0.15s',
                borderRight: tab.key !== 'system' ? `1px solid ${S.T.border}` : 'none',
              }}>
              {tab.label}
            </div>
          );
        })}
      </div>

      {activeTab === 'appearance' && (
        <AppearanceTab themeName={themeName} logoUrl={logoUrl} setLogoUrl={setLogoUrl} />
      )}
      {activeTab === 'configuration' && configUnlocked && (
        <ConfigurationTab
          sheetUrl={sheetUrl} setSheetUrl={setSheetUrl}
          webhookUrl={webhookUrl} setWebhookUrl={setWebhookUrl}
          onSync={onSync} config={config} setConfig={setConfig}
          copied={copied} handleCopy={handleCopy}
          diag={diag} runDiagnostics={runDiagnostics} running={running}
        />
      )}
      {activeTab === 'system' && (
        <SystemTab
          themeName={themeName} logoUrl={logoUrl} config={config}
          onSync={onSync} syncState={syncState}
          setConfig={setConfig} setLogoUrl={setLogoUrl}
          webhookUrl={(config && config.webhookUrl) || webhookUrl}
        />
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   EQUIPMENT REGISTER PAGE — master equipment list from ⚙ RMS/SPM Register
   ════════════════════════════════════════════════════════════════════════ */
function EquipRegPage({ rmsRegister, spmRegister, registryList, webhookUrl }) {
  useTheme();
  const [search, setSearch]     = useState('');
  const [lineFilter, setLine]   = useState('');
  const [typeFilter, setType]   = useState('');

  const lines = useMemo(() =>
    Array.from(new Set(registryList.map(e => e.line))).filter(Boolean).sort(),
    [registryList]);

  // Build unified view: one row per equipment with RMS info + SPM info
  const rows = useMemo(() => {
    const rmsMap = {};
    rmsRegister.forEach(r => { rmsMap[r.equipmentId] = r; });
    const spmMap = {};
    spmRegister.forEach(r => { spmMap[r.equipmentId] = r; });

    const all = new Set([...rmsRegister.map(r=>r.equipmentId), ...spmRegister.map(r=>r.equipmentId)]);
    return Array.from(all).map(eid => {
      const rms = rmsMap[eid];
      const spm = spmMap[eid];
      const name = (rms||spm||{}).equipment || '';
      const line = (rms||spm||{}).line || '';
      return { eid, name, line, rms, spm };
    }).sort((a,b) => a.line===b.line ? a.eid.localeCompare(b.eid) : a.line.localeCompare(b.line));
  }, [rmsRegister, spmRegister]);

  const filtered = useMemo(() => {
    let list = rows;
    if (lineFilter) list = list.filter(r => r.line === lineFilter);
    if (typeFilter === 'RMS') list = list.filter(r => r.rms);
    if (typeFilter === 'SPM') list = list.filter(r => r.spm);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(r => r.eid.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
    }
    return list;
  }, [rows, lineFilter, typeFilter, search]);

  const cell = (v) => ({
    padding:'8px 12px', color: v ? S.T.textPrimary : S.T.textMuted,
    borderBottom:`1px solid ${S.T.border2}`, fontSize:12.5
  });
  const hdr = { padding:'8px 12px', color:S.T.textSecondary, fontWeight:700, fontSize:12,
    borderBottom:`1px solid ${S.T.border}`, background:S.T.tableHead, textAlign:'left' };

  return (
    <div style={{ padding:24 }}>
      {/* summary */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:12, marginBottom:18 }}>
        <div style={S.metric}><div style={{ fontSize:11, color:S.T.textSecondary, marginBottom:4 }}>Total Equipment</div><div style={{ fontSize:26, fontWeight:800, color:S.T.textHighlight }}>{rows.length}</div></div>
        <div style={S.metric}><div style={{ fontSize:11, color:S.T.textSecondary, marginBottom:4 }}>RMS Registered</div><div style={{ fontSize:26, fontWeight:800, color:S.T.accent }}>{rmsRegister.length}</div></div>
        <div style={S.metric}><div style={{ fontSize:11, color:S.T.textSecondary, marginBottom:4 }}>SPM Registered</div><div style={{ fontSize:26, fontWeight:800, color:S.T.info }}>{spmRegister.length}</div></div>
        <div style={S.metric}><div style={{ fontSize:11, color:S.T.textSecondary, marginBottom:4 }}>Lines</div><div style={{ fontSize:26, fontWeight:800, color:S.T.textHighlight }}>{lines.length}</div></div>
      </div>

      {/* filters */}
      <div style={{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap', alignItems:'center' }}>
        <select style={{ ...S.input, width:150 }} value={lineFilter} onChange={e => setLine(e.target.value)}>
          <option value="">All Lines</option>
          {lines.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
        <select style={{ ...S.input, width:140 }} value={typeFilter} onChange={e => setType(e.target.value)}>
          <option value="">RMS + SPM</option>
          <option value="RMS">RMS only</option>
          <option value="SPM">SPM only</option>
        </select>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <span style={{ position:'absolute', left:10, top:8, color:S.T.textMuted }}><Icon d={ICONS.search} size={14}/></span>
          <input style={{ ...S.input, paddingLeft:30 }} placeholder="Search equipment ID or name…"
            value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <span style={{ fontSize:12, color:S.T.textMuted }}>{filtered.length} / {rows.length}</span>
      </div>

      {/* table */}
      <div style={S.card}>
        <div style={{ fontSize:12, color:S.T.textSecondary, marginBottom:12, lineHeight:1.6 }}>
          Master equipment list sourced from <b>⚙ RMS Register</b> and <b>⚙ SPM Register</b> sheets.
          Edit limits in the <b>Limits Settings</b> tab — changes sync back to the sheet automatically.
        </div>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12.5 }}>
            <thead>
              <tr>
                <th style={hdr}>Equipment ID</th>
                <th style={hdr}>Equipment Name</th>
                <th style={hdr}>Line</th>
                <th style={hdr}>RMS Points</th>
                <th style={{ ...hdr, textAlign:'center' }}>RMS Limits (G/A/Alarm)</th>
                <th style={hdr}>SPM Points</th>
                <th style={{ ...hdr, textAlign:'center' }}>SPM Limits (N/C/Alarm)</th>
                <th style={hdr}>SPM Type</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((r, i) => (
                <tr key={r.eid} style={{ background: i%2 ? S.T.tableRowAlt : S.T.tableRow }}
                  onMouseEnter={e => e.currentTarget.style.background = S.T.tableHover}
                  onMouseLeave={e => e.currentTarget.style.background = i%2 ? S.T.tableRowAlt : S.T.tableRow}>
                  <td style={{ ...cell(true), fontWeight:800, color:S.T.textHighlight }}>{r.eid}</td>
                  <td style={cell(r.name)} title={r.name}>
                    <div style={{ maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r.name || '—'}</div>
                  </td>
                  <td style={cell(r.line)}>{r.line || '—'}</td>
                  <td style={cell(r.rms)} title={r.rms?.points?.join(', ')}>
                    <div style={{ maxWidth:220, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                      {r.rms ? r.rms.points.join(', ') : <span style={{ color:S.T.textMuted }}>—</span>}
                    </div>
                  </td>
                  <td style={{ ...cell(r.rms), textAlign:'center' }}>
                    {r.rms
                      ? <span>
                          <span style={{ color:S.T.success, fontWeight:700 }}>{r.rms.rmsGood}</span>
                          {' / '}
                          <span style={{ color:S.T.warning, fontWeight:700 }}>{r.rms.rmsAcceptable}</span>
                          {' / '}
                          <span style={{ color:S.T.danger, fontWeight:700 }}>{r.rms.rmsAlarm}</span>
                        </span>
                      : <span style={{ color:S.T.textMuted }}>—</span>
                    }
                  </td>
                  <td style={cell(r.spm)} title={r.spm?.points?.join(', ')}>
                    <div style={{ maxWidth:220, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                      {r.spm ? r.spm.points.join(', ') : <span style={{ color:S.T.textMuted }}>—</span>}
                    </div>
                  </td>
                  <td style={{ ...cell(r.spm), textAlign:'center' }}>
                    {r.spm
                      ? <span>
                          <span style={{ color:S.T.success, fontWeight:700 }}>{r.spm.spmNormal}</span>
                          {' / '}
                          <span style={{ color:S.T.warning, fontWeight:700 }}>{r.spm.spmCaution}</span>
                          {' / '}
                          <span style={{ color:S.T.danger, fontWeight:700 }}>{r.spm.spmAlarm}</span>
                        </span>
                      : <span style={{ color:S.T.textMuted }}>—</span>
                    }
                  </td>
                  <td style={cell(r.spm)}>{r.spm?.spmType || '—'}</td>
                </tr>
              ))}
              {filtered.length === 0 && (
                <tr><td colSpan={8} style={{ padding:30, textAlign:'center', color:S.T.textMuted }}>
                  {rows.length === 0
                    ? 'No data — sync the app to load Equipment Register from the sheet.'
                    : 'No equipment matches the current filters.'}
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function LimitsPage({ registryList, thresholdsMap, setThresholds, rmsRegMap, spmRegMap, webhookUrl }) {
  useTheme();
  const [equipmentId, setEquipmentId] = useState('');
  const [draft, setDraft] = useState(null);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    if (!equipmentId) { setDraft(null); return; }
    const th = getThresholds(thresholdsMap, equipmentId, rmsRegMap, spmRegMap);
    setDraft({ rms: { ...th.rms }, spm: { ...th.spm } });
    setSaved(false);
  }, [equipmentId, thresholdsMap, rmsRegMap, spmRegMap]);

  const eqMeta = registryList.find(e => e.equipmentId === equipmentId);
  const isCustom = !!(rmsRegMap && rmsRegMap[equipmentId]) || !!(spmRegMap && spmRegMap[equipmentId]) || !!(thresholdsMap && thresholdsMap[equipmentId]);

  const setRms = (key, val) => setDraft(d => ({ ...d, rms: { ...d.rms, [key]: val === '' ? '' : parseFloat(val) } }));
  const setSpm = (key, val) => setDraft(d => ({ ...d, spm: { ...d.spm, [key]: val === '' ? '' : parseFloat(val) } }));

  const handleSave = () => {
    const clean = {
      rms: {
        good: isNaN(draft.rms.good) ? DEFAULT_THRESHOLDS.rms.good : draft.rms.good,
        acceptable: isNaN(draft.rms.acceptable) ? DEFAULT_THRESHOLDS.rms.acceptable : draft.rms.acceptable,
        alarm: isNaN(draft.rms.alarm) ? DEFAULT_THRESHOLDS.rms.alarm : draft.rms.alarm,
      },
      spm: {
        normal: isNaN(draft.spm.normal) ? DEFAULT_THRESHOLDS.spm.normal : draft.spm.normal,
        caution: isNaN(draft.spm.caution) ? DEFAULT_THRESHOLDS.spm.caution : draft.spm.caution,
      },
    };
    setThresholds(equipmentId, clean);
    // Sync limits to Equipment Register sheet
    writeUpdateRegisterLimits(webhookUrl || '', {
      type:'RMS', equipmentId,
      rmsGood: clean.rms.good, rmsAcceptable: clean.rms.acceptable, rmsAlarm: clean.rms.alarm,
    });
    writeUpdateRegisterLimits(webhookUrl || '', {
      type:'SPM', equipmentId,
      spmNormal: clean.spm.normal, spmCaution: clean.spm.caution, spmAlarm: clean.spm.caution,
    });
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  const handleReset = () => {
    setThresholds(equipmentId, null);
    setDraft({ rms: { ...DEFAULT_THRESHOLDS.rms }, spm: { ...DEFAULT_THRESHOLDS.spm } });
  };

  return (
    <div style={{ padding: 24, maxWidth: 760 }}>
      <div style={{ ...S.card, marginBottom: 18 }}>
        <div style={{ fontSize: 12.5, color: S.T.textSecondary, marginBottom: 10, lineHeight: 1.6 }}>
          Each equipment's RMS &amp; SPM alarm thresholds control the status (Good / Acceptable / Alarm / Danger and
          Normal / Caution / Danger) shown across the Dashboard, Registry, and Graphs pages. Select an equipment to
          view or adjust its limits — defaults match the ⚙ Alarm Limit Constants reference sheet.
        </div>
        <label style={S.label}>Equipment ID</label>
        <select style={S.input} value={equipmentId} onChange={e => setEquipmentId(e.target.value)}>
          <option value="">Select equipment…</option>
          {registryList.map(eq => <option key={eq.equipmentId} value={eq.equipmentId}>{eq.equipmentId} — {eq.equipment} ({eq.line})</option>)}
        </select>
      </div>

      {!equipmentId && (
        <div style={{ ...S.card, textAlign: 'center', color: S.T.textMuted, padding: 50 }}>
          Select an Equipment ID above to view or edit its alarm limit constants.
        </div>
      )}

      {equipmentId && draft && (
        <div style={S.card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 8, marginBottom: 4 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 800, color: S.T.textHighlight }}>{equipmentId} — {eqMeta?.equipment}</div>
              <div style={{ fontSize: 12, color: S.T.textSecondary }}>{eqMeta?.line}{isCustom ? ' · custom limits applied' : ' · using default limits'}</div>
            </div>
          </div>

          <div style={{ overflowX: 'auto', marginTop: 14 }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
              <thead>
                <tr style={{ background: S.T.infoBarBg }}>
                  <th style={{ textAlign: 'left', padding: '10px 14px', color: S.T.textHighlight, fontWeight: 800 }}>Parameter</th>
                  <th style={{ textAlign: 'center', padding: '10px 14px', color: S.T.textHighlight, fontWeight: 800 }}>Threshold (mm/s or dBsv)</th>
                  <th style={{ textAlign: 'left', padding: '10px 14px', color: S.T.textHighlight, fontWeight: 800 }}>Standard</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colSpan={3} style={{ padding: '10px 14px', fontWeight: 800, color: S.T.textPrimary, borderBottom: `1px solid ${S.T.border2}`, background: S.T.cardSubBg }}>ISO 10816 RMS Thresholds</td></tr>
                <LimitRow label="Good (Green) – Below" value={draft.rms.good} onChange={v => setRms('good', v)} standard="ISO 10816" color={S.T.success} editable />
                <LimitRow label="Acceptable (Yellow) – Below" value={draft.rms.acceptable} onChange={v => setRms('acceptable', v)} standard="ISO 10816" color={S.T.warning} editable />
                <LimitRow label="Alarm (Red) – Below" value={draft.rms.alarm} onChange={v => setRms('alarm', v)} standard="ISO 10816" color={S.T.danger} editable />
                <LimitRow label="Danger (Purple) – Above" value={draft.rms.alarm} standard="ISO 10816" color={S.T.purple} editable={false} />

                <tr><td colSpan={3} style={{ padding: '10px 14px', fontWeight: 800, color: S.T.textPrimary, borderBottom: `1px solid ${S.T.border2}`, background: S.T.cardSubBg }}>SPM HDm Thresholds</td></tr>
                <LimitRow label="Normal (Green) – Below" value={draft.spm.normal} onChange={v => setSpm('normal', v)} standard="ISO 10816" color={S.T.success} editable />
                <LimitRow label="Caution (Amber) – Below" value={draft.spm.caution} onChange={v => setSpm('caution', v)} standard="ISO 10816" color={S.T.warning} editable />
                <LimitRow label="Danger (Red) – Above" value={draft.spm.caution} standard="ISO 10816" color={S.T.danger} editable={false} />
              </tbody>
            </table>
          </div>

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 16, paddingTop: 14, borderTop: `1px solid ${S.T.border}` }}>
            <button style={S.btnSecondary} onClick={handleReset}>Reset to default</button>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              {saved && <span style={{ fontSize: 12, color: S.T.success, fontWeight: 700 }}>✓ Saved</span>}
              <button style={S.btn} onClick={handleSave}>Save Limits</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   NEW READING PAGE — same fields as the Equipment Registry entry form
   ════════════════════════════════════════════════════════════════════════ */
function NewReadingPage({ equipmentOptions, pointOptions, thresholdsMap, rmsRegMap, spmRegMap, mutations }) {
  useTheme();
  const [type, setType] = useState('RMS');
  const [equipmentId, setEquipmentId] = useState('');
  const [point, setPoint] = useState('');
  const [date, setDate] = useState(new Date().toISOString().slice(0,10));
  const [axial, setAxial] = useState('');
  const [gear, setGear] = useState('');
  const [horizontal, setHorizontal] = useState('');
  const [vertical, setVertical] = useState('');
  const [hdm, setHdm] = useState('');
  const [hdc, setHdc] = useState('');
  const [gs, setGs] = useState('');
  const [savedMsg, setSavedMsg] = useState('');

  const equipmentName = (equipmentOptions.find(e => e.equipmentId === equipmentId) || {}).equipment || '';
  const thresholds = getThresholds(thresholdsMap, equipmentId, rmsRegMap, spmRegMap);

  const maxVel = useMemo(() => {
    const vals = [axial, gear, horizontal, vertical].map(v => parseFloat(v)).filter(v => !isNaN(v));
    return vals.length ? Math.max(...vals) : null;
  }, [axial, gear, horizontal, vertical]);

  const valid = equipmentId && point && date && (type === 'RMS'
    ? [axial, gear, horizontal, vertical].some(v => v !== '' && v !== null)
    : (hdm !== '' && hdm !== null));

  const resetReadingFields = () => {
    setAxial(''); setGear(''); setHorizontal(''); setVertical('');
    setHdm(''); setHdc(''); setGs('');
  };

  const handleAdd = () => {
    if (type === 'RMS') {
      mutations.addRMS({ equipmentId, equipmentName, point, date,
        axial: axial === '' ? null : parseFloat(axial),
        gear: gear === '' ? null : parseFloat(gear),
        horizontal: horizontal === '' ? null : parseFloat(horizontal),
        vertical: vertical === '' ? null : parseFloat(vertical),
        maxVel,
      });
    } else {
      mutations.addSPM({ equipmentId, equipmentName, point, type: 'SPM', date,
        hdm: hdm === '' ? null : parseFloat(hdm),
        hdc: hdc === '' ? null : parseFloat(hdc),
        gs: gs === '' ? null : parseFloat(gs),
      });
    }
    setSavedMsg(`✓ ${type} reading added for ${equipmentId} — ${point} (${fmtDate(date)})`);
    resetReadingFields();
    setTimeout(() => setSavedMsg(''), 3500);
  };

  return (
    <div style={{ padding: 24, maxWidth: 560 }}>
      <div style={S.card}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
          {['RMS','SPM'].map(t => (
            <button key={t} onClick={() => setType(t)}
              style={{ ...(type === t ? S.btn : S.btnSecondary), flex: 1 }}>
              {t} Reading
            </button>
          ))}
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: S.T.accent, marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.5 }}>Equipment</div>
        <div style={{ marginBottom: 10 }}>
          <label style={S.label}>Equipment ID</label>
          <select style={S.input} value={equipmentId} onChange={e => setEquipmentId(e.target.value)}>
            <option value="">Select equipment…</option>
            {equipmentOptions.map(eq => (
              <option key={eq.equipmentId} value={eq.equipmentId}>{eq.equipmentId} — {eq.equipment} ({eq.line})</option>
            ))}
          </select>
        </div>
        <div style={{ marginBottom: 10 }}>
          <label style={S.label}>Equipment Name</label>
          <input style={{ ...S.input, opacity: 0.7 }} value={equipmentName} readOnly />
        </div>
        <div style={{ marginBottom: 14 }}>
          <label style={S.label}>Asset ID / Measurement Point</label>
          <select style={S.input} value={point} onChange={e => setPoint(e.target.value)}>
            <option value="">Select point…</option>
            {pointOptions.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: S.T.accent, marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.5 }}>Reading</div>
        <div style={{ marginBottom: 10 }}>
          <label style={S.label}>Date</label>
          <input type="date" style={S.input} value={date} onChange={e => setDate(e.target.value)} />
        </div>

        {type === 'RMS' ? (
          <>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
              <div><label style={S.label}>Axial (mm/s)</label><input type="number" step="0.01" style={S.input} value={axial} onChange={e => setAxial(e.target.value)} /></div>
              <div><label style={S.label}>Gear (mm/s)</label><input type="number" step="0.01" style={S.input} value={gear} onChange={e => setGear(e.target.value)} /></div>
              <div><label style={S.label}>Horizontal (mm/s)</label><input type="number" step="0.01" style={S.input} value={horizontal} onChange={e => setHorizontal(e.target.value)} /></div>
              <div><label style={S.label}>Vertical (mm/s)</label><input type="number" step="0.01" style={S.input} value={vertical} onChange={e => setVertical(e.target.value)} /></div>
            </div>
            <div style={{ ...S.cardSub, marginBottom: 14 }}>
              <div style={{ fontSize: 12, color: S.T.textSecondary }}>Max Velocity (auto-calculated)</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: S.T.textHighlight }}>
                {maxVel === null ? '—' : maxVel} mm/s
                {maxVel !== null && <span style={{ marginLeft: 10 }}>
                  <StatusPill status={rmsStatus(maxVel, thresholds)} colorKey={rmsStatusColor(rmsStatus(maxVel, thresholds))} />
                </span>}
              </div>
            </div>
          </>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 14 }}>
            <div><label style={S.label}>HDm (dBsv)</label><input type="number" step="0.1" style={S.input} value={hdm} onChange={e => setHdm(e.target.value)} /></div>
            <div><label style={S.label}>HDc (dBsv)</label><input type="number" step="0.1" style={S.input} value={hdc} onChange={e => setHdc(e.target.value)} /></div>
            <div><label style={S.label}>Gs</label><input type="number" step="0.1" style={S.input} value={gs} onChange={e => setGs(e.target.value)} /></div>
          </div>
        )}

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6, borderTop: `1px solid ${S.T.border}`, paddingTop: 14 }}>
          <span style={{ fontSize: 12, color: S.T.success, fontWeight: 700 }}>{savedMsg}</span>
          <button style={{ ...S.btn, opacity: valid ? 1 : 0.5 }} disabled={!valid} onClick={handleAdd}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><Icon d={ICONS.plus} size={14}/> Add {type} Reading</span>
          </button>
        </div>
      </div>
    </div>
  );
}


const PAGE_TITLES = {
  dashboard:  'Dashboard',
  newreading: 'New Reading',
  equipreg:   'Equipment Register',
  registry:   'Equipment Readings',
  graphs:     'Graphs Dashboard',
  compliance: 'Compliance Tracker',
  limits:     'Limits Settings',
  settings:   'Settings',
};


function App() {
  const themeName = useTheme();
  const [page, setPage] = useState('dashboard');
  const [graphAsset, setGraphAsset] = useState('');
  const [mobileOpen, setMobileOpen] = useState(false);

  const [sheetUrl, setSheetUrl] = useState('');
  const [webhookUrl, setWebhookUrl] = useState('');
  const [config, setConfig] = useState(() => ConfigService.load());
  const [logoUrl, setLogoUrl] = useState(() => ConfigService.loadLogo());

  const [rms, setRms] = useState([]);
  const [spm, setSpm] = useState([]);
  const [compliance, setCompliance] = useState([]);
  const [lastRms, setLastRms] = useState([]);
  const [lastSpm, setLastSpm] = useState([]);
  const [rmsRegister, setRmsRegister] = useState([]);
  const [spmRegister, setSpmRegister] = useState([]);
  const [syncState, setSyncState] = useState({ status: 'idle', message: 'Not synced yet' });
  const [thresholdsMap, setThresholdsMap] = useState({});

  // Load settings from localStorage on mount (Config + legacy individual keys)
  useEffect(() => {
    try {
      // Load from ConfigService (new canonical source)
      const cfg = ConfigService.load();
      if (cfg.googleSheetUrl) setSheetUrl(cfg.googleSheetUrl);
      if (cfg.webhookUrl) setWebhookUrl(cfg.webhookUrl);
      setConfig(cfg);
      // Legacy fallback keys (migrate if present)
      const su = localStorage.getItem('vib_sheetUrl'); if (su && !cfg.googleSheetUrl) setSheetUrl(su);
      const wu = localStorage.getItem('vib_webhookUrl'); if (wu && !cfg.webhookUrl) setWebhookUrl(wu);
      // Theme
      const th = localStorage.getItem(THEME_KEY) || localStorage.getItem('vib_theme');
      if (th && THEMES[th]) setGlobalTheme(th);
      // Logo
      const lg = ConfigService.loadLogo();
      if (lg) setLogoUrl(lg);
      // Thresholds
      const lim = localStorage.getItem('vib_thresholds'); if (lim) setThresholdsMap(JSON.parse(lim));
    } catch (e) {}
  }, []);
  // Keep legacy keys in sync for backwards compat
  useEffect(() => { try { localStorage.setItem('vib_sheetUrl', sheetUrl); } catch(e){} }, [sheetUrl]);
  useEffect(() => { try { localStorage.setItem('vib_webhookUrl', webhookUrl); } catch(e){} }, [webhookUrl]);

  // Per-equipment threshold overrides — persisted to localStorage
  const setThresholds = useCallback((equipmentId, value) => {
    setThresholdsMap(prev => {
      const next = { ...prev };
      if (value === null) delete next[equipmentId];
      else next[equipmentId] = value;
      try { localStorage.setItem('vib_thresholds', JSON.stringify(next)); } catch(e){}
      return next;
    });
  }, []);

  // Use a ref so doSync always sees the latest webhookUrl + config without stale closure
  const webhookRef = useRef('');
  useEffect(() => { webhookRef.current = webhookUrl; }, [webhookUrl]);
  const configRef = useRef({});
  useEffect(() => { configRef.current = config; }, [config]);

  const doSync = useCallback(async () => {
    const wh = configRef.current?.webhookUrl || webhookRef.current;
    if (!wh) {
      setSyncState({ status: 'error', message: 'No webhook URL — go to Settings → Configuration → enter your Apps Script URL' });
      return;
    }
    setSyncState({ status: 'loading', message: 'Syncing…' });
    try {
      const data = await sheetRead(wh, 'readAll');
      if (data.error) throw new Error(data.error);
      const rmsArr     = (data.rms         || []).map(rowToRMS);
      const spmArr     = (data.spm         || []).map(rowToSPM);
      const cmpArr     = (data.compliance  || []).map(rowToCompliance);
      const rmsRegArr  = (data.rmsRegister || []).map(rowToRMSRegister);
      const spmRegArr  = (data.spmRegister || []).map(rowToSPMRegister);
      const lastRmsArr = (data.lastRms     || []).map(rowToLastRMS);
      const lastSpmArr = (data.lastSpm     || []).map(rowToLastSPM);
      setRms(rmsArr);
      setSpm(spmArr);
      setCompliance(cmpArr);
      setRmsRegister(rmsRegArr);
      setSpmRegister(spmRegArr);
      setLastRms(lastRmsArr);
      setLastSpm(lastSpmArr);
      const now = new Date();
      ApiModule.setLastSync(now);
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      setSyncState({ status: 'ok', message: `✓ Synced — ${rmsArr.length} RMS · ${spmArr.length} SPM · ${rmsRegArr.length} reg · ${lastRmsArr.length+lastSpmArr.length} last — ${time}` });
    } catch (err) {
      setSyncState({ status: 'error', message: `✕ Sync failed: ${String(err.message || err)}` });
    }
  }, []); // no deps — reads from refs always

  // Auto-sync once on mount after settings are loaded
  useEffect(() => {
    // Small delay to let the localStorage useEffect run first and populate refs
    const t = setTimeout(() => {
      if (webhookRef.current || configRef.current?.webhookUrl) doSync();
    }, 200);
    return () => clearTimeout(t);
  }, []); // run once on mount only

  // ── Registry: merge RMS + SPM register as master source ─────────────────
  const rmsRegMap = useMemo(() => {
    const m = {}; rmsRegister.forEach(r => { m[r.equipmentId] = r; }); return m;
  }, [rmsRegister]);
  const spmRegMap = useMemo(() => {
    const m = {}; spmRegister.forEach(r => { m[r.equipmentId] = r; }); return m;
  }, [spmRegister]);

  const registryList = useMemo(() => {
    // Build from RMS Register (primary) + SPM Register (fill in missing) + Compliance (fallback)
    const seen = new Set();
    const list = [];
    const addEq = (eid, name, line) => {
      if (!seen.has(eid)) { seen.add(eid); list.push({ equipmentId:eid, equipment:name, line }); }
    };
    rmsRegister.forEach(r => addEq(r.equipmentId, r.equipment, r.line));
    spmRegister.forEach(r => addEq(r.equipmentId, r.equipment, r.line));
    compliance.forEach(c => addEq(c.equipmentId, c.equipment, c.line));
    return list.sort((a,b) => a.line===b.line ? a.equipmentId.localeCompare(b.equipmentId) : a.line.localeCompare(b.line));
  }, [rmsRegister, spmRegister, compliance]);

  const registryMap = useMemo(() => {
    const m = {}; registryList.forEach(eq => { m[eq.equipmentId] = eq; }); return m;
  }, [registryList]);

  // Point options: from registers first, then fallback to historical data
  const rmsPointOptions = useMemo(() => {
    const set = new Set();
    rmsRegister.forEach(r => r.points.forEach(p => set.add(p)));
    rms.forEach(r => r.point && set.add(r.point));
    return Array.from(set).sort();
  }, [rmsRegister, rms]);
  const spmPointOptions = useMemo(() => {
    const set = new Set();
    spmRegister.forEach(r => r.points.forEach(p => set.add(p)));
    spm.forEach(r => r.point && set.add(r.point));
    return Array.from(set).sort();
  }, [spmRegister, spm]);
  const pointOptions = useMemo(() => {
    const set = new Set([...rmsPointOptions, ...spmPointOptions]);
    return Array.from(set).sort();
  }, [rmsPointOptions, spmPointOptions]);

  const dashCounts = useMemo(() => {
    const alertEquip = compliance.filter(c => complianceTier(c.last) === 'Alert').length;
    return { alertEquip };
  }, [compliance]);

  // ── Mutations ────────────────────────────────────────────────────────────
  const nextSeq = (arr) => {
    let max = 0;
    arr.forEach(r => { const n = parseInt(r.seq, 10); if (!isNaN(n) && n > max) max = n; });
    return max + 1;
  };

  // Helper: get SPM type for an equipment from register
  const getSpmType = useCallback((equipmentId) => {
    return (spmRegMap[equipmentId] || {}).spmType || '';
  }, [spmRegMap]);

  // Helper: upsert Last RMS/SPM + optimistic local update
  const upsertLocalLastRMS = useCallback((rec) => {
    const th = getThresholds(thresholdsMap, rec.equipmentId, rmsRegMap, spmRegMap);
    const readingStatus = rmsStatus(rec.maxVel, th);
    setLastRms(prev => {
      const filtered = prev.filter(r => !(r.equipmentId===rec.equipmentId && r.point===rec.point));
      const newRec = { ...rec, _id:`LRMS|${rec.equipmentId}|${rec.point}`, readingStatus, machineStatus:'' };
      return [...filtered, newRec];
    });
    const activeWebhook = configRef.current?.webhookUrl || webhookRef.current;
    const regMeta = registryMap[rec.equipmentId] || {};
    writeUpsertLastRMS(activeWebhook, {
      equipmentId: rec.equipmentId, equipmentName: rec.equipmentName || regMeta.equipment || '',
      line: regMeta.line || '', point: rec.point, date: rec.date,
      axial: rec.axial ?? '', gear: rec.gear ?? '', horizontal: rec.horizontal ?? '',
      vertical: rec.vertical ?? '', maxVelocity: rec.maxVel ?? '',
      readingStatus,
    });
  }, [thresholdsMap, rmsRegMap, spmRegMap, registryMap]);

  const upsertLocalLastSPM = useCallback((rec) => {
    const th = getThresholds(thresholdsMap, rec.equipmentId, rmsRegMap, spmRegMap);
    const readingStatus = spmStatus(rec.hdm, th);
    const spmType = getSpmType(rec.equipmentId);
    setLastSpm(prev => {
      const filtered = prev.filter(r => !(r.equipmentId===rec.equipmentId && r.point===rec.point));
      const newRec = { ...rec, _id:`LSPM|${rec.equipmentId}|${rec.point}`, spmType, readingStatus, machineStatus:'' };
      return [...filtered, newRec];
    });
    const activeWebhook = configRef.current?.webhookUrl || webhookRef.current;
    const regMeta = registryMap[rec.equipmentId] || {};
    writeUpsertLastSPM(activeWebhook, {
      equipmentId: rec.equipmentId, equipmentName: rec.equipmentName || regMeta.equipment || '',
      line: regMeta.line || '', point: rec.point, spmType,
      date: rec.date, hdm: rec.hdm ?? '', hdc: rec.hdc ?? '', gs: rec.gs ?? '',
      readingStatus,
    });
  }, [thresholdsMap, rmsRegMap, spmRegMap, getSpmType, registryMap]);

  const mutations = useMemo(() => ({
    addRMS: (data) => {
      const seq = nextSeq(rms);
      const rec = { ...data, seq, _id: `RMS|${data.equipmentId}|${data.point}|${data.date}` };
      setRms(prev => [...prev, rec]);
      writeAppend(webhookUrl, SHEET_RMS, rmsToRow(rec), RMS_HEADERS);
      upsertLocalLastRMS(rec);
    },
    updateRMS: (data) => {
      const rec = { ...data, _id: `RMS|${data.equipmentId}|${data.point}|${data.date}` };
      setRms(prev => prev.map(r => r._id === data._id ? rec : r));
      writeUpdate(webhookUrl, SHEET_RMS, data._matchCols, data._matchValues, rmsToRow(rec));
      upsertLocalLastRMS(rec);
    },
    deleteRMS: (row) => {
      setRms(prev => prev.filter(r => r._id !== row._id));
      writeDelete(webhookUrl, SHEET_RMS, row._matchCols, row._matchValues);
      // Check if newer reading exists for this point; if not, remove from Last RMS
      const remaining = rms.filter(r => r._id !== row._id && r.equipmentId===row.equipmentId && r.point===row.point);
      if (remaining.length === 0) {
        setLastRms(prev => prev.filter(r => !(r.equipmentId===row.equipmentId && r.point===row.point)));
        writeDeleteLastRMS(webhookUrl, row.equipmentId, row.point);
      } else {
        const newest = remaining.sort((a,b) => b.date > a.date ? 1 : -1)[0];
        upsertLocalLastRMS(newest);
      }
    },
    addSPM: (data) => {
      const seq = nextSeq(spm);
      const rec = { ...data, seq, type: 'SPM', _id: `SPM|${data.equipmentId}|${data.point}|${data.date}` };
      setSpm(prev => [...prev, rec]);
      writeAppend(webhookUrl, SHEET_SPM, spmToRow(rec), SPM_HEADERS);
      upsertLocalLastSPM(rec);
    },
    updateSPM: (data) => {
      const rec = { ...data, _id: `SPM|${data.equipmentId}|${data.point}|${data.date}` };
      setSpm(prev => prev.map(r => r._id === data._id ? rec : r));
      writeUpdate(webhookUrl, SHEET_SPM, data._matchCols, data._matchValues, spmToRow(rec));
      upsertLocalLastSPM(rec);
    },
    deleteSPM: (row) => {
      setSpm(prev => prev.filter(r => r._id !== row._id));
      writeDelete(webhookUrl, SHEET_SPM, row._matchCols, row._matchValues);
      const remaining = spm.filter(r => r._id !== row._id && r.equipmentId===row.equipmentId && r.point===row.point);
      if (remaining.length === 0) {
        setLastSpm(prev => prev.filter(r => !(r.equipmentId===row.equipmentId && r.point===row.point)));
        writeDeleteLastSPM(webhookUrl, row.equipmentId, row.point);
      } else {
        const newest = remaining.sort((a,b) => b.date > a.date ? 1 : -1)[0];
        upsertLocalLastSPM(newest);
      }
    },
  }), [rms, spm, webhookUrl, upsertLocalLastRMS, upsertLocalLastSPM]);

  let content;
  if (page === 'dashboard') content = <DashboardPage rms={rms} spm={spm} lastRms={lastRms} lastSpm={lastSpm} compliance={compliance} registryList={registryList} registryMap={registryMap} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} thresholdsMap={thresholdsMap} setPage={setPage} setGraphAsset={setGraphAsset} />;
  else if (page === 'newreading') content = <NewReadingPage equipmentOptions={registryList} pointOptions={pointOptions} thresholdsMap={thresholdsMap} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} mutations={mutations} />;
  else if (page === 'equipreg') content = <EquipRegPage rmsRegister={rmsRegister} spmRegister={spmRegister} registryList={registryList} webhookUrl={webhookUrl} />;
  else if (page === 'registry') content = <RegistryPage registryList={registryList} rms={rms} spm={spm} registryMap={registryMap} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} thresholdsMap={thresholdsMap} mutations={mutations} pointOptions={pointOptions} />;
  else if (page === 'graphs') content = <GraphsPage registryList={registryList} rms={rms} spm={spm} graphAsset={graphAsset} setGraphAsset={setGraphAsset} thresholdsMap={thresholdsMap} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} />;
  else if (page === 'limits') content = <LimitsPage registryList={registryList} thresholdsMap={thresholdsMap} setThresholds={setThresholds} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} webhookUrl={webhookUrl} />;
  else if (page === 'compliance') content = <CompliancePage compliance={compliance} />;
  else if (page === 'settings') content = <SettingsPage sheetUrl={sheetUrl} setSheetUrl={setSheetUrl} webhookUrl={webhookUrl} setWebhookUrl={setWebhookUrl} themeName={themeName} onSync={doSync} logoUrl={logoUrl} setLogoUrl={setLogoUrl} config={config} setConfig={setConfig} syncState={syncState} />;

  return (
    <div style={S.page}>
      <Sidebar page={page} setPage={setPage} syncState={syncState} onSync={doSync} counts={dashCounts} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} logoUrl={logoUrl} />
      <div className={`sidebar-overlay${mobileOpen ? ' show' : ''}`} onClick={() => setMobileOpen(false)} />
      <div className="app-main" style={{ marginLeft: 230 }}>
        <Topbar title={PAGE_TITLES[page]} sheetUrl={sheetUrl} onSync={doSync} syncState={syncState} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
        {content}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
