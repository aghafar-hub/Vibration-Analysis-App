function EmailModal({action,onClose,webhookUrl}){
  useTheme();
  const [recipients,setRecipients]=useState([action.contractor?`${action.contractor.toLowerCase()}@arabiancementcompany.com`:'']);
  const [sending,setSending]=useState(false);
  const [msg,setMsg]=useState('');
  const addEmail=()=>setRecipients(r=>[...r,'']);
  const setEmail=(i,v)=>setRecipients(r=>r.map((e,j)=>j===i?v:e));
  const removeEmail=(i)=>setRecipients(r=>r.filter((_,j)=>j!==i));

  const handleSend=async()=>{
    if(!webhookUrl){setMsg('No webhook URL configured');return;}
    const valid=recipients.filter(e=>e.includes('@'));
    if(!valid.length){setMsg('Enter at least one valid email');return;}
    setSending(true);setMsg('Sending…');
    try{
      const res=await writeSendEmail(webhookUrl,{
        recipients:JSON.stringify(valid),'Action No':action.actionNo,'Equipment ID':action.equipmentId,
        'Equipment Name':action.equipmentName,'Line':action.line,'Contractor':action.contractor,
        'Revision Date':action.revisionDate,'Machine Status':action.machineStatus,'Trigger Type':action.triggerType,
        'Trigger Point':action.triggerPoint,'Trigger Value':action.triggerValue,'Agreed Action':action.agreedAction,
        'ACC Action':action.accAction,'Reading Date':action.readingDate,
      });
      if(res&&res.status==='ok'){setMsg(`✓ Sent to ${res.sent} recipient(s)`);}
      else setMsg('Error: '+(res?.error||'unknown'));
    }catch(e){setMsg('Error: '+String(e.message||e));}
    setSending(false);
  };

  return(
    <Modal title={`Email Action ${action.actionNo}`} onClose={onClose} width={480}>
      <div style={{...S.cardSub,marginBottom:14,fontSize:12.5,color:S.T.textSecondary,lineHeight:1.6}}>
        Sending email for <b style={{color:S.T.textHighlight}}>{action.equipmentName}</b> · {action.machineStatus} · Contractor: <b style={{color:S.T.textHighlight}}>{action.contractor||'—'}</b>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:S.T.textSecondary,marginBottom:8}}>Recipients</div>
        {recipients.map((email,i)=>(
          <div key={i} style={{display:'flex',gap:6,marginBottom:6}}>
            <input style={{...S.input,flex:1}} type="email" placeholder="email@company.com" value={email} onChange={e=>setEmail(i,e.target.value)}/>
            {recipients.length>1&&<button style={{...S.btnDanger,padding:'8px 10px'}} onClick={()=>removeEmail(i)}>×</button>}
          </div>
        ))}
        <button style={{...S.btnSecondary,fontSize:12,marginTop:4}} onClick={addEmail}>+ Add Email</button>
      </div>
      {msg&&<div style={{fontSize:12,fontWeight:700,color:msg.startsWith('✓')?S.T.success:S.T.danger,marginBottom:10}}>{msg}</div>}
      <div style={{display:'flex',gap:10,justifyContent:'flex-end',paddingTop:12,borderTop:`1px solid ${S.T.border}`}}>
        <button style={S.btnSecondary} onClick={onClose}>Close</button>
        <button style={{...S.btn,display:'flex',alignItems:'center',gap:6}} disabled={sending} onClick={handleSend}>
          <Icon d={ICONS.email} size={13}/> {sending?'Sending…':'Send Email'}
        </button>
      </div>
    </Modal>
  );
}

function GenerateActionsModal({onClose,onGenerate,lastRms,lastSpm,registryMap}){
  useTheme();
  const now=new Date();
  const [selMonth,setSelMonth]=useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`);
  const [preview,setPreview]=useState(null);

  const computePreview=()=>{
    // Find all equipment with Alarm or Danger in Last Reading sheets for selected month
    const equipMap={};
    [...lastRms,...lastSpm].forEach(r=>{
      if(!r.date||monthKey(r.date)!==selMonth) return;
      const ms=r.machineStatus||r.readingStatus;
      if(ms!=='Alarm'&&ms!=='Danger') return;
      const eid=r.equipmentId;
      if(!equipMap[eid]||STATUS_SEVERITY[ms]>(STATUS_SEVERITY[equipMap[eid].status]||0)){
        const meta=registryMap[eid]||{};
        const trig=r.maxVel!==undefined?{type:'RMS',point:r.point,value:r.maxVel}:{type:'SPM',point:r.point,value:r.hdm};
        equipMap[eid]={equipmentId:eid,equipmentName:meta.equipment||r.equipment||'',line:meta.line||r.line||'',status:ms,trig,date:r.date,contractor:meta.line?'':''};
      }
    });
    setPreview(Object.values(equipMap));
  };

  return(
    <Modal title="Generate Monthly Actions" onClose={onClose} width={560}>
      <div style={{marginBottom:14}}>
        <label style={S.label}>Select Month</label>
        <input type="month" style={{...S.input,maxWidth:200}} value={selMonth} onChange={e=>setSelMonth(e.target.value)}/>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:14}}>
        <button style={S.btn} onClick={computePreview}>Preview</button>
      </div>
      {preview&&(
        <>
          <div style={{fontSize:12.5,color:S.T.textSecondary,marginBottom:10}}>
            {preview.length===0?'No Alarm or Danger equipment found for this month.':`${preview.length} action(s) will be created:`}
          </div>
          {preview.length>0&&(
            <div style={{maxHeight:240,overflowY:'auto',marginBottom:14,border:`1px solid ${S.T.border2}`,borderRadius:8}}>
              {preview.map((p,i)=>(
                <div key={p.equipmentId} style={{display:'flex',gap:10,alignItems:'center',padding:'8px 12px',borderBottom:i<preview.length-1?`1px solid ${S.T.border2}`:'none',background:i%2?S.T.tableRowAlt:S.T.tableRow}}>
                  <div style={{flex:1}}>
                    <span style={{fontWeight:700,color:S.T.textHighlight}}>{p.equipmentId}</span>
                    <span style={{color:S.T.textMuted,fontSize:11,marginLeft:6}}>{p.equipmentName}</span>
                  </div>
                  <StatusPill status={p.status} colorKey={machineStatusColor(p.status)}/>
                  <span style={{fontSize:11,color:S.T.textMuted}}>{p.trig.type}·{p.trig.point}</span>
                  <span style={{fontSize:11,color:S.T.textSecondary}}>{p.line}</span>
                </div>
              ))}
            </div>
          )}
          {preview.length>0&&(
            <div style={{display:'flex',gap:10,justifyContent:'flex-end',paddingTop:12,borderTop:`1px solid ${S.T.border}`}}>
              <button style={S.btnSecondary} onClick={onClose}>Cancel</button>
              <button style={S.btn} onClick={()=>onGenerate(preview,selMonth)}>Generate {preview.length} Action(s)</button>
            </div>
          )}
        </>
      )}
    </Modal>
  );
}

function ActionTrackerPage({actions,setActions,registryList,registryMap,lastRms,lastSpm,webhookUrl,config}){
  useTheme();
  const [lineFilter,setLineFilter]=useState('');
  const [statusFilter,setStatusFilter]=useState('');
  const [contractorFilter,setContractorFilter]=useState('');
  const [eqTypeFilter,setEqTypeFilter]=useState('');
  const [actionStatusFilter,setActionStatusFilter]=useState('');
  const [revMonthFilter,setRevMonthFilter]=useState('');
  const [search,setSearch]=useState('');
  const [editModal,setEditModal]=useState(null);
  const [deleteConfirm,setDeleteConfirm]=useState(null);
  const [emailModal,setEmailModal]=useState(null);
  const [generateModal,setGenerateModal]=useState(false);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState('');

  const contractors=useMemo(()=>(config?.contractors||'RHI,ASEC').split(',').map(c=>c.trim()).filter(Boolean),[config]);
  const lines=useMemo(()=>Array.from(new Set(registryList.map(e=>e.line))).filter(Boolean).sort(),[registryList]);
  const eqTypes=useMemo(()=>Array.from(new Set(registryList.map(e=>e.eqType))).filter(Boolean).sort(),[registryList]);
  const revMonths=useMemo(()=>Array.from(new Set(actions.map(a=>monthKey(a.revisionDate)).filter(Boolean))).sort().reverse(),[actions]);

  const filtered=useMemo(()=>{
    let list=actions;
    if(lineFilter) list=list.filter(a=>a.line===lineFilter);
    if(statusFilter) list=list.filter(a=>a.machineStatus===statusFilter);
    if(contractorFilter) list=list.filter(a=>a.contractor===contractorFilter);
    if(eqTypeFilter) list=list.filter(a=>(registryMap[a.equipmentId]?.eqType||'')===eqTypeFilter);
    if(actionStatusFilter) list=list.filter(a=>a.actionStatus===actionStatusFilter);
    if(revMonthFilter) list=list.filter(a=>monthKey(a.revisionDate)===revMonthFilter);
    if(search.trim()){const q=search.trim().toLowerCase();list=list.filter(a=>a.equipmentId.toLowerCase().includes(q)||a.equipmentName.toLowerCase().includes(q)||a.actionNo.toLowerCase().includes(q));}
    return list;
  },[actions,lineFilter,statusFilter,contractorFilter,eqTypeFilter,actionStatusFilter,revMonthFilter,search]);

  const nextActionNo=useCallback(()=>{
    let max=0;
    actions.forEach(a=>{const m=a.actionNo.match(/^V-(\d+)$/i);if(m){const n=parseInt(m[1]);if(n>max)max=n;}});
    return`V-${String(max+1).padStart(3,'0')}`;
  },[actions]);

  const handleSave=async(draft)=>{
    setSaving(true);
    const isNew=!draft.actionNo||draft.actionNo==='';
    const params={...draft};
    if(isNew) params.actionNo=nextActionNo();
    const rec=rowToAction(params);
    try{
      if(isNew){
        await writeActionAppend(webhookUrl,{...params,'Action No':params.actionNo,'Equipment ID':params.equipmentId,'Equipment Name':params.equipmentName,
          'Line':params.line,'Reading Date':params.readingDate,'Trigger Type':params.triggerType,'Trigger Point':params.triggerPoint,
          'Trigger Value':params.triggerValue,'Machine Status':params.machineStatus,'Revision Date':params.revisionDate,
          'Action Status':params.actionStatus,'Completion Date':params.completionDate,'Contractor':params.contractor,
          'Contractor Action':params.contractorAction,'ACC Action':params.accAction,'Agreed Action':params.agreedAction});
        setActions(prev=>[...prev,rec]);
      }else{
        await writeActionUpdate(webhookUrl,{...params,'Action No':params.actionNo});
        setActions(prev=>prev.map(a=>a.actionNo===rec.actionNo?rec:a));
      }
      setMsg('✓ Saved');setTimeout(()=>setMsg(''),2000);
    }catch(e){setMsg('Error: '+String(e.message||e));}
    setSaving(false);setEditModal(null);
  };

  const handleDelete=async(action)=>{
    try{
      await writeActionDelete(webhookUrl,{'Action No':action.actionNo});
      setActions(prev=>prev.filter(a=>a.actionNo!==action.actionNo));
      setMsg('✓ Deleted');setTimeout(()=>setMsg(''),2000);
    }catch(e){setMsg('Error: '+String(e.message||e));}
    setDeleteConfirm(null);
  };

  const handleGenerate=async(preview,month)=>{
    setGenerateModal(false);setSaving(true);setMsg('Generating actions…');
    let count=0;
    for(const p of preview){
      const actionNo=nextActionNo();
      // Get contractor from line via registryMap
      const meta=registryMap[p.equipmentId]||{};
      const line=meta.line||p.line||'';
      // Contractor mapping: read from contractors list — first check if line contains Line1/Line2 -> RHI, CM1/CM2 -> ASEC
      let contractor='';
      if(line&&contractors.length>=2){
        if(line.toLowerCase().includes('line1')||line.toLowerCase().includes('line2')||line==='Line1'||line==='Line2') contractor=contractors[0]||'RHI';
        else if(line.toLowerCase().includes('cm1')||line.toLowerCase().includes('cm2')||line==='CM1'||line==='CM2') contractor=contractors[1]||'ASEC';
        else contractor=contractors[0]||'';
      }
      const rec={actionNo,equipmentId:p.equipmentId,equipmentName:p.equipmentName,line,readingDate:p.date,
        triggerType:p.trig.type,triggerPoint:p.trig.point,triggerValue:String(p.trig.value||''),machineStatus:p.status,
        revisionDate:'',actionStatus:'Open',completionDate:'',contractor,contractorAction:'',accAction:'',agreedAction:''};
      try{
        await writeActionAppend(webhookUrl,{'Action No':actionNo,'Equipment ID':rec.equipmentId,'Equipment Name':rec.equipmentName,
          'Line':rec.line,'Reading Date':rec.readingDate,'Trigger Type':rec.triggerType,'Trigger Point':rec.triggerPoint,
          'Trigger Value':rec.triggerValue,'Machine Status':rec.machineStatus,'Revision Date':'','Action Status':'Open',
          'Completion Date':'','Contractor':contractor,'Contractor Action':'','ACC Action':'','Agreed Action':''});
        setActions(prev=>[...prev,rowToAction(rec)]);
        count++;
      }catch(e){}
    }
    setSaving(false);setMsg(`✓ ${count} action(s) generated`);setTimeout(()=>setMsg(''),3000);
  };

  const handleExcel=()=>{
    // Client-side Excel export via CSV with BOM (opens in Excel)
    const headers=['Action No','Equipment ID','Equipment Name','Line','Reading Date','Trigger Type','Trigger Point','Trigger Value','Machine Status','Revision Date','Action Status','Completion Date','Contractor','Contractor Action','ACC Action','Agreed Action'];
    const rows=[headers,...filtered.map(a=>[a.actionNo,a.equipmentId,a.equipmentName,a.line,fmtDate(a.readingDate),a.triggerType,a.triggerPoint,a.triggerValue,a.machineStatus,fmtDate(a.revisionDate),a.actionStatus,fmtDate(a.completionDate),a.contractor,a.contractorAction,a.accAction,a.agreedAction])];
    const footer=['','','','','','','','','','','','','','Authorized by:','aghafar@arabiancementcompany.com',''];
    rows.push([]);rows.push(footer);
    const csv=rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const BOM='\uFEFF';
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`Action_Tracker_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();URL.revokeObjectURL(url);
  };

  const openCounts=actions.filter(a=>a.actionStatus==='Open').length;

  return(
    <div style={{padding:20}}>
      {/* Toolbar */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <button style={{...S.btn,display:'flex',alignItems:'center',gap:6}} onClick={()=>setEditModal({})}>
          <Icon d={ICONS.plus} size={14}/> New Action
        </button>
        <button style={{...S.btnSecondary,display:'flex',alignItems:'center',gap:6}} onClick={()=>setGenerateModal(true)}>
          ⚡ Generate Monthly Actions
        </button>
        <button style={{...S.btnSecondary,display:'flex',alignItems:'center',gap:6}} onClick={handleExcel}>
          <Icon d={ICONS.download} size={14}/> Export Excel
        </button>
        {saving&&<span style={{fontSize:12,color:S.T.info}}>Saving…</span>}
        {msg&&<span style={{fontSize:12,color:msg.startsWith('✓')?S.T.success:S.T.danger,fontWeight:700}}>{msg}</span>}
        <span style={{marginLeft:'auto',fontSize:12,color:S.T.textMuted}}>{filtered.length}/{actions.length} · <span style={{color:S.T.danger,fontWeight:700}}>{openCounts} Open</span></span>
      </div>

      {/* Filters */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <select style={{...S.input,width:130}} value={lineFilter} onChange={e=>setLineFilter(e.target.value)}>
          <option value="">All Lines</option>{lines.map(l=><option key={l} value={l}>{l}</option>)}
        </select>
        <select style={{...S.input,width:130}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="">All Status</option>{['Good','Acceptable','Alarm','Danger'].map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select style={{...S.input,width:140}} value={contractorFilter} onChange={e=>setContractorFilter(e.target.value)}>
          <option value="">All Contractors</option>{contractors.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <select style={{...S.input,width:130}} value={eqTypeFilter} onChange={e=>setEqTypeFilter(e.target.value)}>
          <option value="">All Eq Types</option>{eqTypes.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
        <select style={{...S.input,width:140}} value={actionStatusFilter} onChange={e=>setActionStatusFilter(e.target.value)}>
          <option value="">All Action Status</option>{ACTION_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select style={{...S.input,width:130}} value={revMonthFilter} onChange={e=>setRevMonthFilter(e.target.value)}>
          <option value="">All Months</option>{revMonths.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
        <div style={{position:'relative',flex:1,minWidth:180}}>
          <span style={{position:'absolute',left:9,top:8,color:S.T.textMuted}}><Icon d={ICONS.search} size={14}/></span>

        </div>

        )}
      </div>

      {/* Action chips */}
      {filtered.length===0?<div style={{...S.card,textAlign:'center',color:S.T.textMuted,padding:50}}>{actions.length===0?'No actions yet — create one or generate monthly actions.':'No actions match current filters.'}</div>:(
        <div>{filtered.map(a=><ActionChip key={a.actionNo} action={a} onEdit={a=>setEditModal(a)} onDelete={a=>setDeleteConfirm(a)} onEmail={a=>setEmailModal(a)}/>)}</div>
      )}

      {editModal!==null&&<ActionFormModal initial={editModal} registryList={registryList} contractors={contractors}
        onClose={()=>setEditModal(null)} onSave={handleSave}/>}

    </div>
  );
}

function BackfillButton({webhookUrl}){
  useTheme();
  const [state,setState]=useState('idle');const [msg,setMsg]=useState('');
  const run=async()=>{
    if(!webhookUrl){setMsg('No webhook URL');setState('error');return;}
    setState('loading');setMsg('Running backfill — this may take 20-40 seconds…');
    try{
      const r=await triggerBackfill(webhookUrl);
      if(r&&r.status==='ok'){setMsg(`✓ Done — ${r.rmsRows} RMS · ${r.spmRows} SPM rows written.`);setState('done');}
      else{setMsg('Error: '+(r?.error||'unknown'));setState('error');}
    }catch(e){setMsg('Error: '+String(e.message||e));setState('error');}
  };
  return(
    <div>
      <button style={{...S.btn,opacity:state==='loading'?0.6:1}} disabled={state==='loading'} onClick={run}>
        {state==='loading'?'⏳ Running…':'▶ Run Backfill Now'}
      </button>
      {msg&&<div style={{marginTop:8,fontSize:12.5,color:state==='done'?S.T.success:state==='error'?S.T.danger:S.T.textSecondary,fontWeight:600}}>{msg}</div>}
    </div>
  );
}

function PasskeyModal({onUnlock,onCancel}){
  useTheme();

  const inputRef=useRef(null);

  const attempt=()=>{if(_checkPasskey(pass))onUnlock();else{setError('Invalid pass key.');setPass('');setTimeout(()=>setError(''),2500);}};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200}} onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>

   ════════════════════════════════════════════════════════════════════════ */
const PAGE_TITLES={
  dashboard:'Dashboard',newreading:'New Reading',equipreg:'Equipment Register',
  registry:'Equipment Readings',graphs:'Graphs Dashboard',compliance:'Compliance Tracker',
  actions:'Action Tracker',limits:'Limits Settings',settings:'Settings',
};

function App(){
  const themeName=useTheme();
  const [page,setPage]=useState('dashboard');
  const [graphAsset,setGraphAsset]=useState('');
  const [mobileOpen,setMobileOpen]=useState(false);

  const [sheetUrl,setSheetUrl]=useState('');
  const [webhookUrl,setWebhookUrl]=useState(DEFAULT_WEBHOOK);
  const [config,setConfig]=useState(()=>ConfigService.load());
  const [logoUrl,setLogoUrl]=useState(()=>ConfigService.loadLogo());

  const [rms,setRms]=useState([]);
  const [spm,setSpm]=useState([]);
  const [compliance,setCompliance]=useState([]);
  const [lastRms,setLastRms]=useState([]);
  const [lastSpm,setLastSpm]=useState([]);
  const [rmsRegister,setRmsRegister]=useState([]);
  const [spmRegister,setSpmRegister]=useState([]);
  const [actions,setActions]=useState([]);
  const [thresholdsMap,setThresholdsMap]=useState({});
  const [syncState,setSyncState]=useState({status:'idle',message:'Not synced yet'});

  // Load from localStorage on mount
  useEffect(()=>{
    try{
      const cfg=ConfigService.load();
      setConfig(cfg);
      if(cfg.webhookUrl)setWebhookUrl(cfg.webhookUrl);
      if(cfg.googleSheetUrl)setSheetUrl(cfg.googleSheetUrl);
      const th=localStorage.getItem('vib_thresholds_v3');if(th)setThresholdsMap(JSON.parse(th));
      const theme=localStorage.getItem(THEME_KEY);if(theme&&THEMES[theme])setGlobalTheme(theme);
      const lg=ConfigService.loadLogo();setLogoUrl(lg||DEFAULT_LOGO);
    }catch(e){}
    // Fix body background
    document.body.style.background=_theme.appBg;
    document.body.style.color=_theme.textPrimary;
  },[]);

  const webhookRef=useRef(DEFAULT_WEBHOOK);
  useEffect(()=>{webhookRef.current=webhookUrl;},[webhookUrl]);
  const configRef=useRef({});
  useEffect(()=>{configRef.current=config;},[config]);

  const setThresholds=useCallback((equipmentId,value)=>{
    setThresholdsMap(prev=>{
      const next={...prev};
      if(value===null)delete next[equipmentId];else next[equipmentId]=value;
      try{localStorage.setItem('vib_thresholds_v3',JSON.stringify(next));}catch(e){}
      return next;
    });
  },[]);

  const doSync=useCallback(async()=>{
    const wh=configRef.current?.webhookUrl||webhookRef.current;
    if(!wh){setSyncState({status:'error',message:'No webhook URL — go to Settings → Configuration'});return;}
    setSyncState({status:'loading',message:'Syncing…'});
    try{
      const data=await sheetRead(wh,'readAll');
      if(data.error)throw new Error(data.error);
      setRms((data.rms||[]).map(rowToRMS));
      setSpm((data.spm||[]).map(rowToSPM));
      setCompliance((data.compliance||[]).map(rowToCompliance));
      setRmsRegister((data.rmsRegister||[]).map(rowToRMSRegister));
      setSpmRegister((data.spmRegister||[]).map(rowToSPMRegister));
      setLastRms((data.lastRms||[]).map(rowToLastRMS));
      setLastSpm((data.lastSpm||[]).map(rowToLastSPM));
      setActions((data.actions||[]).map(rowToAction));
      // Sync config from sheet
      if(data.config&&typeof data.config==='object'){
        const sheetCfg={...configRef.current};
        if(data.config.webhookUrl)sheetCfg.webhookUrl=data.config.webhookUrl;
        if(data.config.googleSheetUrl){sheetCfg.googleSheetUrl=data.config.googleSheetUrl;setSheetUrl(data.config.googleSheetUrl);}
        if(data.config.contractors)sheetCfg.contractors=data.config.contractors;
        setConfig(sheetCfg);ConfigService.save(sheetCfg);
      }
      const now=new Date();
      const time=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      setSyncState({status:'ok',message:`✓ Synced — ${(data.rms||[]).length} RMS · ${(data.spm||[]).length} SPM — ${time}`});
      document.body.style.background=_theme.appBg;
    }catch(e){
      setSyncState({status:'error',message:String(e.message||e).includes('timed out')?'Sync timed out — check your webhook URL in Settings':String(e.message||e).slice(0,80)});
    }
  },[]);

  // Derived maps
  const rmsRegMap=useMemo(()=>{const m={};rmsRegister.forEach(r=>{m[r.equipmentId]=r;});return m;},[rmsRegister]);
  const spmRegMap=useMemo(()=>{const m={};spmRegister.forEach(r=>{m[r.equipmentId]=r;});return m;},[spmRegister]);
  const registryMap=useMemo(()=>{
    const m={};
    rmsRegister.forEach(r=>{m[r.equipmentId]={...m[r.equipmentId],...r};});
    spmRegister.forEach(r=>{m[r.equipmentId]={...m[r.equipmentId],...r};});
    return m;
  },[rmsRegister,spmRegister]);
  const registryList=useMemo(()=>Object.values(registryMap).sort((a,b)=>a.equipmentId.localeCompare(b.equipmentId)),[registryMap]);

  const actionCounts=useMemo(()=>({
    open:actions.filter(a=>a.actionStatus==='Open').length,
    alertEquip:compliance.filter(c=>complianceTier(c.last)==='Alert').length,
  }),[actions,compliance]);

  // Mutations
  const nextSeq=(arr)=>{let max=0;arr.forEach(r=>{const n=parseInt(r.seq,10);if(!isNaN(n)&&n>max)max=n;});return max+1;};
  const getSpmType=(eid)=>(spmRegMap[eid]||{}).spmType||'';

  const upsertLocalLastRMS=useCallback((rec)=>{
    const th=getThresholds(thresholdsMap,rec.equipmentId,rmsRegMap,spmRegMap);
    const readingStatus=rmsStatus(rec.maxVel,th);
    setLastRms(prev=>[...prev.filter(r=>!(r.equipmentId===rec.equipmentId&&r.point===rec.point)),
      {...rec,_id:`LRMS|${rec.equipmentId}|${rec.point}`,readingStatus,machineStatus:''}]);
    const wh=configRef.current?.webhookUrl||webhookRef.current;
    const meta=registryMap[rec.equipmentId]||{};
    writeUpsertLastRMS(wh,{equipmentId:rec.equipmentId,equipmentName:rec.equipmentName||meta.equipment||'',
      line:meta.line||'',point:rec.point,date:rec.date,axial:rec.axial??'',gear:rec.gear??'',
      horizontal:rec.horizontal??'',vertical:rec.vertical??'',maxVelocity:rec.maxVel??'',readingStatus});
  },[thresholdsMap,rmsRegMap,spmRegMap,registryMap]);

  const upsertLocalLastSPM=useCallback((rec)=>{
    const th=getThresholds(thresholdsMap,rec.equipmentId,rmsRegMap,spmRegMap);
    const readingStatus=spmStatus(rec.hdm,th);
    const spmType=getSpmType(rec.equipmentId);
    setLastSpm(prev=>[...prev.filter(r=>!(r.equipmentId===rec.equipmentId&&r.point===rec.point)),
      {...rec,_id:`LSPM|${rec.equipmentId}|${rec.point}`,spmType,readingStatus,machineStatus:''}]);
    const wh=configRef.current?.webhookUrl||webhookRef.current;
    const meta=registryMap[rec.equipmentId]||{};
    writeUpsertLastSPM(wh,{equipmentId:rec.equipmentId,equipmentName:rec.equipmentName||meta.equipment||'',
      line:meta.line||'',point:rec.point,spmType,date:rec.date,hdm:rec.hdm??'',hdc:rec.hdc??'',gs:rec.gs??'',readingStatus});
  },[thresholdsMap,rmsRegMap,spmRegMap,getSpmType,registryMap]);

  const mutations=useMemo(()=>({
    addRMS:(data)=>{
      const seq=nextSeq(rms);const rec={...data,seq,_id:`RMS|${data.equipmentId}|${data.point}|${data.date}`};
      setRms(prev=>[...prev,rec]);
      const wh=configRef.current?.webhookUrl||webhookRef.current;
      writeAppend(wh,SHEET_RMS,rmsToRow(rec),RMS_HEADERS);upsertLocalLastRMS(rec);
    },
    updateRMS:(data)=>{
      const rec={...data,_id:`RMS|${data.equipmentId}|${data.point}|${data.date}`};
      setRms(prev=>prev.map(r=>r._id===data._id?rec:r));
      const wh=configRef.current?.webhookUrl||webhookRef.current;
      writeUpdate(wh,SHEET_RMS,data._matchCols,data._matchValues,rmsToRow(rec));upsertLocalLastRMS(rec);
    },
    deleteRMS:(row)=>{
      setRms(prev=>prev.filter(r=>r._id!==row._id));
      const wh=configRef.current?.webhookUrl||webhookRef.current;
      writeDelete(wh,SHEET_RMS,row._matchCols,row._matchValues);
      const rem=rms.filter(r=>r._id!==row._id&&r.equipmentId===row.equipmentId&&r.point===row.point);
      if(rem.length===0){setLastRms(prev=>prev.filter(r=>!(r.equipmentId===row.equipmentId&&r.point===row.point)));sheetWrite(wh,{action:'deleteLastRMS',equipmentId:row.equipmentId,point:row.point});}
      else upsertLocalLastRMS(rem.sort((a,b)=>b.date>a.date?1:-1)[0]);
    },
    addSPM:(data)=>{
      const seq=nextSeq(spm);const rec={...data,seq,type:'SPM',_id:`SPM|${data.equipmentId}|${data.point}|${data.date}`};
      setSpm(prev=>[...prev,rec]);
      const wh=configRef.current?.webhookUrl||webhookRef.current;
      writeAppend(wh,SHEET_SPM,spmToRow(rec),SPM_HEADERS);upsertLocalLastSPM(rec);
    },
    updateSPM:(data)=>{
      const rec={...data,_id:`SPM|${data.equipmentId}|${data.point}|${data.date}`};
      setSpm(prev=>prev.map(r=>r._id===data._id?rec:r));
      const wh=configRef.current?.webhookUrl||webhookRef.current;
      writeUpdate(wh,SHEET_SPM,data._matchCols,data._matchValues,spmToRow(rec));upsertLocalLastSPM(rec);
    },
    deleteSPM:(row)=>{
      setSpm(prev=>prev.filter(r=>r._id!==row._id));
      const wh=configRef.current?.webhookUrl||webhookRef.current;
      writeDelete(wh,SHEET_SPM,row._matchCols,row._matchValues);
      const rem=spm.filter(r=>r._id!==row._id&&r.equipmentId===row.equipmentId&&r.point===row.point);
      if(rem.length===0){setLastSpm(prev=>prev.filter(r=>!(r.equipmentId===row.equipmentId&&r.point===row.point)));sheetWrite(wh,{action:'deleteLastSPM',equipmentId:row.equipmentId,point:row.point});}
      else upsertLocalLastSPM(rem.sort((a,b)=>b.date>a.date?1:-1)[0]);
    },
  }),[rms,spm,upsertLocalLastRMS,upsertLocalLastSPM]);

  let content;
  if(page==='dashboard') content=<DashboardPage lastRms={lastRms} lastSpm={lastSpm} registryMap={registryMap} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} thresholdsMap={thresholdsMap} setPage={setPage} setGraphAsset={setGraphAsset}/>;
  else if(page==='newreading') content=<NewReadingPage registryList={registryList} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} thresholdsMap={thresholdsMap} mutations={mutations} webhookUrl={webhookUrl} compliance={compliance} setCompliance={setCompliance}/>;
  else if(page==='equipreg') content=<EquipRegPage rmsRegister={rmsRegister} spmRegister={spmRegister} registryList={registryList} webhookUrl={webhookUrl} setRmsRegister={setRmsRegister} setSpmRegister={setSpmRegister}/>;
  else if(page==='registry') content=<RegistryPage registryList={registryList} rms={rms} spm={spm} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} thresholdsMap={thresholdsMap} mutations={mutations}/>;
  else if(page==='graphs') content=<GraphsPage registryList={registryList} rms={rms} spm={spm} graphAsset={graphAsset} setGraphAsset={setGraphAsset} thresholdsMap={thresholdsMap} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap}/>;
  else if(page==='compliance') content=<CompliancePage compliance={compliance} lastRms={lastRms} lastSpm={lastSpm} registryMap={registryMap}/>;
  else if(page==='actions') content=<ActionTrackerPage actions={actions} setActions={setActions} registryList={registryList} registryMap={registryMap} lastRms={lastRms} lastSpm={lastSpm} webhookUrl={webhookUrl} config={config}/>;
  else if(page==='limits') content=<LimitsPage registryList={registryList} thresholdsMap={thresholdsMap} setThresholds={setThresholds} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} webhookUrl={webhookUrl}/>;
  else if(page==='settings') content=<SettingsPage webhookUrl={webhookUrl} setWebhookUrl={setWebhookUrl} sheetUrl={sheetUrl} setSheetUrl={setSheetUrl} themeName={themeName} onSync={doSync} logoUrl={logoUrl} setLogoUrl={setLogoUrl} config={config} setConfig={setConfig} syncState={syncState} webhookRef={webhookRef}/>;

  return(
    <div style={S.page}>
      <Sidebar page={page} setPage={setPage} syncState={syncState} onSync={doSync} actionCounts={actionCounts} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} logoUrl={logoUrl}/>
      <div className={`sidebar-overlay${mobileOpen?' show':''}`} onClick={()=>setMobileOpen(false)}/>
      <div className="app-main" style={{marginLeft:232}}>
        <Topbar title={PAGE_TITLES[page]} sheetUrl={sheetUrl} onSync={doSync} syncState={syncState} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
        {content}
      </div>
    </div>
  );
}

// Apply initial theme & background
try{const t=localStorage.getItem(THEME_KEY);if(t&&THEMES[t])setGlobalTheme(t);}catch(e){}
document.body.style.background=_theme.appBg;
document.body.style.color=_theme.textPrimary;

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
