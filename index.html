<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style id="global-style">
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1E3A5F; border-radius: 6px; }
  select option { background: #0D1E35; color: #E8F4FD; }
  input::placeholder, textarea::placeholder { color: #6B8CAE; }
  a { color: inherit; }
  input, select, textarea, button { font-family: inherit; }

  /* ── Responsive: sidebar / topbar ───────────────────────────── */
  .app-sidebar { width: 230px; }
  .hamburger-btn { display: none; }
  .sidebar-overlay { display: none; }
  @media (max-width: 900px) {
    .app-sidebar {
      position: fixed; left: 0; top: 0; height: 100vh; width: 250px;
      transform: translateX(-100%); transition: transform 0.22s ease; z-index: 300;
      box-shadow: 4px 0 24px rgba(0,0,0,0.35);
    }
    .app-sidebar.open { transform: translateX(0); }
    .app-main { margin-left: 0 !important; }
    .hamburger-btn { display: flex !important; }
    .sidebar-overlay.show {
      display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 250;
    }
  }
  @media (max-width: 640px) {
    .app-main > div { padding: 12px !important; }
  }

  /* ── Centralised CSS variable theme system ─────────────────────────────── */
  /* Variables are set dynamically by JS ThemeModule (see setGlobalTheme) */
  :root {
    --primary: #00B4D8;
    --secondary: #8BAFC8;
    --background: #0A1628;
    --surface: #0D1E35;
    --card: #0D1E35;
    --border: #1E3A5F;
    --text: #E8F4FD;
    --text-secondary: #8BAFC8;
    --success: #2DC653;
    --warning: #F4A261;
    --danger: #E63946;
    --info: #00B4D8;
    --purple: #A78BFA;
    --accent: #00B4D8;
    --accent-text: #0A1628;
    --input-bg: #0A1628;
    --scrollbar: #1E3A5F;
  }

  /* Use CSS vars in scrollbar (complements the JS theming) */
  ::-webkit-scrollbar-thumb { background: var(--scrollbar) !important; }

  /* Focus ring using primary color */
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
</style>

// Normalize "Asset ID" / measurement point labels (RMS & SPM "Asset ID" column)
function normalizePoint(p) {
  if (p === null || p === undefined) return '';
  let s = String(p).replace(/\s+/g, ' ').trim();
  s = s.replace(/\bouboard\b/gi, 'Outboard');
  s = s.replace(/\boutbord\b/gi, 'Outboard');
  s = s.replace(/\binboard\b/gi, 'Inboard');
  s = s.replace(/\boutboard\b/gi, 'Outboard');
  // collapse "Fan  DE" -> "Fan DE", normalize double-space variants already done above
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

// Normalize ANY date input (ISO string, Google Sheets serial number, formatted string)
// to a consistent display format e.g. "26 Dec 2025"
function fmtDate(val) {
  if (val === null || val === undefined || val === '') return '';
  let d = null;
  if (val instanceof Date) {
    d = val;
  } else if (typeof val === 'number') {
    // Google Sheets serial date (days since 1899-12-30)
    d = new Date(Math.round((val - 25569) * 86400 * 1000));
  } else if (typeof val === 'string') {
    const s = val.trim();
    if (/^\d+(\.\d+)?$/.test(s)) {
      d = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
    } else {
      d = new Date(s);
    }
  }
  if (!d || isNaN(d.getTime())) return String(val);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getUTCDate()).padStart(2,'0')} ${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

// ISO date (yyyy-MM-dd) for sorting / form inputs
function isoDate(val) {
  if (val === null || val === undefined || val === '') return '';
  let d = null;
  if (val instanceof Date) {
    d = val;
  } else if (typeof val === 'number') {
    d = new Date(Math.round((val - 25569) * 86400 * 1000));
  } else if (typeof val === 'string') {
    const s = val.trim();
    if (/^\d+(\.\d+)?$/.test(s)) {
      d = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
    } else {
      d = new Date(s);
    }
  }
  if (!d || isNaN(d.getTime())) return '';
  return d.toISOString().slice(0, 10);
}

// Dedupe by _id, local wins on conflict
function mergeById(sheetArr, localArr) {
  const map = new Map();
  (sheetArr || []).forEach(r => map.set(r._id, r));
  (localArr || []).forEach(r => map.set(r._id, r));
  return Array.from(map.values());
}

const UNLOCK_KEY     = 'config_unlocked';
const CACHE_KEY      = 'app_cache';
const PREFS_KEY      = 'app_preferences';
const APP_VERSION    = '1.4.0';
const _PASS_ENCODED  = btoa('17593'); // obfuscated — do not expose raw string
function _checkPasskey(raw) { try { return btoa(raw) === _PASS_ENCODED; } catch(e) { return false; } }

const ConfigService = {
  load() {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      return raw ? { ...DEFAULT_CONFIG, ...JSON.parse(raw) } : { ...DEFAULT_CONFIG };
    } catch (e) { return { ...DEFAULT_CONFIG }; }
  },
  save(cfg) {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); return true; } catch (e) { return false; }
  },
  reset() {
    try { localStorage.removeItem(CONFIG_KEY); return true; } catch (e) { return false; }
  },
  validate(cfg) {
    const errors = [];
    const urlPattern = /^https?:\/\//;
    if (cfg.appsScriptUrl && !urlPattern.test(cfg.appsScriptUrl)) errors.push('Apps Script URL must start with https://');
    if (cfg.googleSheetUrl && !urlPattern.test(cfg.googleSheetUrl)) errors.push('Google Sheet URL must start with https://');
    if (cfg.webhookUrl && !urlPattern.test(cfg.webhookUrl)) errors.push('Webhook URL must start with https://');
    if (cfg.autoSyncMinutes < 1 || cfg.autoSyncMinutes > 60) errors.push('Auto sync interval must be 1–60 minutes');
    if (cfg.cacheMinutes < 1 || cfg.cacheMinutes > 120) errors.push('Cache duration must be 1–120 minutes');
    return errors;
  },
  loadLogo() {
    try { return localStorage.getItem(LOGO_KEY) || ''; } catch (e) { return ''; }
  },
  saveLogo(url) {
    try { localStorage.setItem(LOGO_KEY, url); return true; } catch (e) { return false; }
  },
};

// ── STORAGE MODULE ──────────────────────────────────────────────────────────
const StorageModule = {
  totalUsage() {
    try {
      let total = 0;
      for (const k of Object.keys(localStorage)) {
        const v = localStorage.getItem(k) || '';
        total += (k.length + v.length) * 2; // bytes (UTF-16)
      }
      return total;
    } catch(e) { return 0; }
  },
  formatBytes(b) {
    if (b < 1024) return `${b} B`;
    if (b < 1024*1024) return `${(b/1024).toFixed(1)} KB`;
    return `${(b/1024/1024).toFixed(2)} MB`;
  },
  clearCache() {
    try { localStorage.removeItem(CACHE_KEY); return true; } catch(e) { return false; }
  },
  getPrefs() {
    try { const r = localStorage.getItem(PREFS_KEY); return r ? JSON.parse(r) : {}; } catch(e) { return {}; }
  },
  savePrefs(prefs) {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); return true; } catch(e) { return false; }
  },
};

  setLastSync(dt) { this._lastSync = dt; try { localStorage.setItem('vib_lastSync', dt.toISOString()); } catch(e){} },
  getLastSync() {

};

// ── EXPORT / IMPORT MODULE ───────────────────────────────────────────────────
const ExportImportModule = {
  exportSettings() {
    const payload = {
      version: APP_VERSION,
      exportedAt: new Date().toISOString(),
      theme: localStorage.getItem(THEME_KEY) || 'Navy Dark',
      config: ConfigService.load(),
      logoUrl: ConfigService.loadLogo(),
      preferences: StorageModule.getPrefs(),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vib-settings-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    return true;
  },
  validateImport(data) {
    const errors = [];
    if (!data || typeof data !== 'object') { errors.push('Invalid JSON structure.'); return errors; }
    if (!data.version) errors.push('Missing version field.');
    if (data.config && typeof data.config !== 'object') errors.push('Invalid config field.');
    if (data.theme && !THEMES[data.theme]) errors.push(`Unknown theme: ${data.theme}`);
    return errors;
  },
  importSettings(jsonStr, { setConfig, setLogoUrl }) {
    try {
      const data = JSON.parse(jsonStr);
      const errs = this.validateImport(data);
      if (errs.length) return { ok: false, errors: errs };
      if (data.config) { ConfigService.save(data.config); setConfig({ ...DEFAULT_CONFIG, ...data.config }); }
      if (data.theme && THEMES[data.theme]) { setGlobalTheme(data.theme); }
      if (typeof data.logoUrl === 'string') { ConfigService.saveLogo(data.logoUrl); setLogoUrl(data.logoUrl); }
      if (data.preferences) StorageModule.savePrefs(data.preferences);
      return { ok: true };
    } catch(e) { return { ok: false, errors: [String(e.message || e)] }; }
  },
};


/* ════════════════════════════════════════════════════════════════════════
   STATUS THRESHOLDS — per-equipment adjustable (⚙ Alarm Limit Constants)
   RMS  : Good (green) < Acceptable (yellow) < Alarm (red) ... Danger (purple) above Alarm
   SPM  : Normal (green) < Caution (amber) ... Danger (red) above Caution
   ════════════════════════════════════════════════════════════════════════ */
const DEFAULT_THRESHOLDS = {
  rms: { good: 2.8, acceptable: 7.1, alarm: 18 },   // <good=Good, <acceptable=Acceptable, <alarm=Alarm, >=alarm=Danger
  spm: { normal: 20, caution: 35 },                  // <normal=Normal, <caution=Caution, >=caution=Danger
};

// Returns thresholds for a given equipment.
// Priority: RMS/SPM Register (sheet) → thresholdsMap (localStorage cache) → DEFAULT_THRESHOLDS
function getThresholds(thresholdsMap, equipmentId, rmsRegMap, spmRegMap) {
  const rmsReg = rmsRegMap && rmsRegMap[equipmentId];
  const spmReg = spmRegMap && spmRegMap[equipmentId];
  const local  = (thresholdsMap && thresholdsMap[equipmentId]) || {};
  return {
    rms: rmsReg
      ? { good: rmsReg.rmsGood, acceptable: rmsReg.rmsAcceptable, alarm: rmsReg.rmsAlarm }
      : { ...DEFAULT_THRESHOLDS.rms, ...(local.rms || {}) },
    spm: spmReg
      ? { normal: spmReg.spmNormal, caution: spmReg.spmCaution, alarm: spmReg.spmAlarm }
      : { ...DEFAULT_THRESHOLDS.spm, ...(local.spm || {}) },
  };
}

// RMS status -> 'Good' | 'Acceptable' | 'Alarm' | 'Danger'
function rmsStatus(maxVel, th) {
  const v = parseFloat(maxVel);
  if (isNaN(v)) return null;
  const t = (th && th.rms) || DEFAULT_THRESHOLDS.rms;
  if (v < t.good) return 'Good';
  if (v < t.acceptable) return 'Acceptable';
  if (v < t.alarm) return 'Alarm';
  return 'Danger';
}
// SPM status -> 'Normal' | 'Caution' | 'Danger'
function spmStatus(hdm, th) {
  const v = parseFloat(hdm);
  if (isNaN(v)) return null;
  const t = (th && th.spm) || DEFAULT_THRESHOLDS.spm;
  if (v < t.normal) return 'Normal';
  if (v < t.caution) return 'Caution';
  return 'Danger';
}

// Color lookup per status label/type — matches the Alarm Limit Constants legend
function rmsStatusColor(status) {
  return { Good: 'success', Acceptable: 'warning', Alarm: 'danger', Danger: 'purple' }[status] || 'info';
}
function spmStatusColor(status) {
  return { Normal: 'success', Caution: 'warning', Danger: 'danger' }[status] || 'info';
}

// Unified 4-bucket tier for dashboard summary cards (RMS Danger = purple, everything else shared)
function unifiedTier(status, kind) {
  if (kind === 'RMS') return status; // Good | Acceptable | Alarm | Danger
  // SPM: Normal->Good, Caution->Acceptable, Danger->Alarm (no purple for SPM)
  return { Normal: 'Good', Caution: 'Acceptable', Danger: 'Alarm' }[status] || status;
}

// Compliance month status -> 3-tier
function complianceTier(status) {
  if (!status) return 'Alert';
  const s = String(status).trim().toLowerCase();
  if (s === 'yes') return 'Normal';
  if (s === 'no' || s === 'missing') return 'Alert';
  if (s.indexOf('comment') !== -1 || s.indexOf('caution') !== -1 || s.indexOf('observation') !== -1) return 'Caution';
  return 'Alert';
}
function complianceColor(tier) {
  return { Normal: 'success', Caution: 'warning', Alert: 'danger' }[tier] || 'info';
}

let _theme = THEMES["Navy Dark"];
let _themeName = "Navy Dark";
const _themeListeners = new Set();
function setGlobalTheme(name) {
  if (!THEMES[name]) return;
  _theme = THEMES[name];
  _themeName = name;
  try { localStorage.setItem(THEME_KEY, name); localStorage.setItem('vib_theme', name); } catch (e) {}
  // Sync CSS variables so :root-based selectors (focus rings, scrollbars) also respond
  try {
    const r = document.documentElement;
    const t = _theme;
    r.style.setProperty('--primary',       t.accent);
    r.style.setProperty('--secondary',     t.textSecondary);
    r.style.setProperty('--background',    t.appBg);
    r.style.setProperty('--surface',       t.sidebarBg);
    r.style.setProperty('--card',          t.cardBg);
    r.style.setProperty('--border',        t.border);
    r.style.setProperty('--text',          t.textPrimary);
    r.style.setProperty('--text-secondary',t.textSecondary);
    r.style.setProperty('--success',       t.success);
    r.style.setProperty('--warning',       t.warning);
    r.style.setProperty('--danger',        t.danger);
    r.style.setProperty('--info',          t.info);
    r.style.setProperty('--purple',        t.purple || t.accent);
    r.style.setProperty('--accent',        t.accent);
    r.style.setProperty('--accent-text',   t.accentText);
    r.style.setProperty('--input-bg',      t.inputBg);
    r.style.setProperty('--scrollbar',     t.scrollThumb);
  } catch(e) {}
  _themeListeners.forEach(fn => fn());
}
function useTheme() {
  const [, setTick] = useState(0);
  useEffect(() => {
    const fn = () => setTick(t => t + 1);
    _themeListeners.add(fn);
    return () => _themeListeners.delete(fn);
  }, []);
  return _themeName;
}

// S = Proxy giving on-access computed style helpers from _theme
const S = new Proxy({}, {
  get(_, key) {
    if (key === 'T') return _theme;
    switch (key) {
      case 'page': return { background: _theme.appBg, minHeight: '100%', color: _theme.textPrimary };

  const point = normalizePoint(r['Asset ID']);

  const axial = num(r['AXial (mm/s)']);

  const horiz = num(r['Horizontal (mm/s)']);
  const vert = num(r['Vertical (mm/s)']);
  let maxVel = num(r['Max Velocity (mm/s)']);
  if (maxVel === null) {

  return {

/* ════════════════════════════════════════════════════════════════════════
   SHEET READ / WRITE HELPERS  (JSONP fallback for cross-origin)
   ════════════════════════════════════════════════════════════════════════ */
let _jsonpCounter = 0;
function jsonpRequest(url, params) {
  return new Promise((resolve, reject) => {
    const cbName = `__vibjsonp_${Date.now()}_${_jsonpCounter++}`;
    const qs = new URLSearchParams({ ...params, callback: cbName }).toString();
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = (data) => {
      if (done) return;
      done = true;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('JSONP request failed (network/script error)'));
    };
    script.src = `${url}?${qs}`;
    document.body.appendChild(script);
    setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('JSONP request timed out'));
    }, 20000);
  });
}

async function sheetRead(webhookUrl, action = 'readAll', extra = {}) {
  if (!webhookUrl) throw new Error('No webhook URL configured');
  // Try direct fetch first (works if same-origin / CORS allowed)
  try {
    const qs = new URLSearchParams({ action, ...extra }).toString();
    const resp = await fetch(`${webhookUrl}?${qs}`, { method: 'GET' });
    if (resp.ok) {
      const data = await resp.json();
      return data;
    }
    throw new Error(`HTTP ${resp.status}`);
  } catch (err) {
    // Fallback to JSONP (bypasses CORS)
    return await jsonpRequest(webhookUrl, { action, ...extra });
  }
}

// Fire-and-forget write (no-cors)
function sheetWrite(webhookUrl, params) {
  if (!webhookUrl) return;
  const qs = new URLSearchParams(params).toString();
  fetch(`${webhookUrl}?${qs}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
}

// Upsert Last RMS Reading
function writeUpsertLastRMS(webhookUrl, params) {
  const qs = new URLSearchParams({ action: 'upsertLastRMS', ...params }).toString();
  fetch(`${webhookUrl}?${qs}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
}
// Upsert Last SPM Reading
function writeUpsertLastSPM(webhookUrl, params) {
  const qs = new URLSearchParams({ action: 'upsertLastSPM', ...params }).toString();
  fetch(`${webhookUrl}?${qs}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
}
// Delete Last RMS Reading
function writeDeleteLastRMS(webhookUrl, equipmentId, point) {
  sheetWrite(webhookUrl, { action: 'deleteLastRMS', equipmentId, point });
}
// Delete Last SPM Reading
function writeDeleteLastSPM(webhookUrl, equipmentId, point) {
  sheetWrite(webhookUrl, { action: 'deleteLastSPM', equipmentId, point });
}
// Update Register Limits
function writeUpdateRegisterLimits(webhookUrl, params) {
  const qs = new URLSearchParams({ action: 'updateRegisterLimits', ...params }).toString();
  fetch(`${webhookUrl}?${qs}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
}
// Backfill Last Readings (returns a promise so caller can await)
async function triggerBackfill(webhookUrl) {
  return await sheetRead(webhookUrl, 'backfillLastReadings');
}

function writeAppend(webhookUrl, sheetName, rowArr, headers) {
  sheetWrite(webhookUrl, {
    action: 'append',
    sheet: sheetName,
    row: JSON.stringify(rowArr),
    headers: JSON.stringify(headers),
  });
}
function writeUpdate(webhookUrl, sheetName, matchCols, matchValues, rowArr) {
  sheetWrite(webhookUrl, {
    action: 'updateRow',
    sheet: sheetName,

  });
}
function writeDelete(webhookUrl, sheetName, matchCols, matchValues) {
  sheetWrite(webhookUrl, {
    action: 'deleteRow',
    sheet: sheetName,
    matchCols: JSON.stringify(matchCols),
    matchValues: JSON.stringify(matchValues),

}

   ════════════════════════════════════════════════════════════════════════ */
const STATUS_SEVERITY = { Good:1, Normal:1, Acceptable:2, Caution:2, Alarm:3, Danger:4 };
function worstOfTwo(a, b) {
  return (STATUS_SEVERITY[a]||0) >= (STATUS_SEVERITY[b]||0) ? a : b;
}

function computeEquipmentStatus(lastRms, lastSpm, registryMap, rmsRegMap, spmRegMap, thresholdsMap) {
  const byEquip = new Map();
  const ensure = (eid) => {
    if (!byEquip.has(eid)) {
      const meta = registryMap[eid] || {};
      byEquip.set(eid, { equipmentId:eid, equipment:meta.equipment||'', line:meta.line||'',
        status:null, colorKey:'info', drivenBy:[], rmsPoints:[], spmPoints:[] });
    }
    return byEquip.get(eid);
  };
  lastRms.forEach(r => {
    const eid = r.equipmentId; if (!eid) return;
    const eq = ensure(eid);
    const th = getThresholds(thresholdsMap, eid, rmsRegMap, spmRegMap);
    const st = rmsStatus(r.maxVel, th);
    const ck = rmsStatusColor(st);
    eq.rmsPoints.push({ type:'RMS', point:r.point, date:r.date, value:r.maxVel,
      axial:r.axial, gear:r.gear, horizontal:r.horizontal, vertical:r.vertical,
      status:st, colorKey:ck, unit:'mm/s' });
    if (!eq.status || (STATUS_SEVERITY[st]||0) > (STATUS_SEVERITY[eq.status]||0)) { eq.status=st; eq.colorKey=ck; }
  });
  lastSpm.forEach(r => {
    const eid = r.equipmentId; if (!eid) return;
    const eq = ensure(eid);
    const th = getThresholds(thresholdsMap, eid, rmsRegMap, spmRegMap);
    const st = spmStatus(r.hdm, th);
    const ck = spmStatusColor(st);
    eq.spmPoints.push({ type:'SPM', point:r.point, date:r.date, value:r.hdm,
      hdm:r.hdm, hdc:r.hdc, gs:r.gs, spmType:r.spmType,
      status:st, colorKey:ck, unit:'dBsv' });
    if (!eq.status || (STATUS_SEVERITY[st]||0) > (STATUS_SEVERITY[eq.status]||0)) { eq.status=st; eq.colorKey=ck; }
  });
  byEquip.forEach(eq => {
    if (!eq.status) return;
    const worst = eq.status;
    [...eq.rmsPoints, ...eq.spmPoints].forEach(pt => {
      if (pt.status === worst) eq.drivenBy.push({ type:pt.type, point:pt.point, colorKey:pt.colorKey });
    });
    eq.rmsPoints.sort((a,b) => b.date > a.date ? 1 : -1);
    eq.spmPoints.sort((a,b) => b.date > a.date ? 1 : -1);
  });
  return byEquip;
}

// Returns array of {equipmentId, equipmentName, point, type, date, value, status, colorKey, unit}
function computeLatestReadings(rms, spm, registryMap, thresholdsMap, rmsRegMap, spmRegMap) {
  const latest = new Map();
  rms.forEach(r => {
    if (r.maxVel === null || !r.date) return;
    const key = `RMS|${r.equipmentId}|${r.point}`;
    const ex = latest.get(key);
    if (!ex || r.date > ex.date) {
      const th = getThresholds(thresholdsMap, r.equipmentId, rmsRegMap, spmRegMap);
      const status = rmsStatus(r.maxVel, th);
      latest.set(key, {
        equipmentId: r.equipmentId,
        equipmentName: r.equipmentName || (registryMap[r.equipmentId] || {}).equipment || '',
        line: (registryMap[r.equipmentId] || {}).line || '',
        point: r.point, type: 'RMS', date: r.date, value: r.maxVel,
        status, colorKey: rmsStatusColor(status), tier: unifiedTier(status, 'RMS'), unit: 'mm/s',
      });
    }
  });
  spm.forEach(r => {
    if (r.hdm === null || !r.date) return;
    const key = `SPM|${r.equipmentId}|${r.point}`;
    const ex = latest.get(key);
    if (!ex || r.date > ex.date) {
      const th = getThresholds(thresholdsMap, r.equipmentId, rmsRegMap, spmRegMap);
      const status = spmStatus(r.hdm, th);
      latest.set(key, {
        equipmentId: r.equipmentId,
        equipmentName: r.equipmentName || (registryMap[r.equipmentId] || {}).equipment || '',
        line: (registryMap[r.equipmentId] || {}).line || '',
        point: r.point, type: 'SPM', date: r.date, value: r.hdm,
        status, colorKey: spmStatusColor(status), tier: unifiedTier(status, 'SPM'), unit: 'dBsv',
      });
    }
  });
  return Array.from(latest.values());
}

/* ── SVG Donut Chart ─────────────────────────────────────────────────── */
function DonutChart({ slices, total, onClick, activeSlice }) {
  useTheme();
  const R = 70, cx = 90, cy = 90, stroke = 28;
  const circumference = 2 * Math.PI * R;
  let offset = 0;
  const paths = slices.map((s, i) => {
    const pct = total > 0 ? s.count / total : 0;
    const dash = pct * circumference;
    const gap = circumference - dash;
    const path = { ...s, dash, gap, offset };
    offset += dash;
    return path;
  });
  return (
    <svg width={180} height={180} viewBox="0 0 180 180">
      {paths.map((p, i) => (
        <circle key={i} cx={cx} cy={cy} r={R}
          fill="none" stroke={p.color}
          strokeWidth={stroke}
          strokeDasharray={`${p.dash} ${p.gap}`}
          strokeDashoffset={-p.offset + circumference * 0.25}
          style={{ cursor:'pointer', opacity: activeSlice===null||activeSlice===p.key ? 1 : 0.35, transition:'opacity 0.15s' }}
          onClick={() => onClick(p.key)} />
      ))}
      <text x={cx} y={cy - 8} textAnchor="middle" fontSize="22" fontWeight="800" fill={S.T.textHighlight}>{total}</text>
      <text x={cx} y={cy + 12} textAnchor="middle" fontSize="11" fill={S.T.textSecondary}>Equipment</text>
    </svg>
  );
}

    computeEquipmentStatus(lastRms, lastSpm, registryMap, rmsRegMap, spmRegMap, thresholdsMap),

  const equipList = useMemo(() => Array.from(equipStatusMap.values()), [equipStatusMap]);

  // Status card counts (unique equipment IDs)
  const counts = useMemo(() => {
    const c = { Good:0, Acceptable:0, Alarm:0, Danger:0 };
    equipList.forEach(eq => { if (eq.status && c[eq.status]!==undefined) c[eq.status]++; });
    return c;
  }, [equipList]);

  const total = counts.Good + counts.Acceptable + counts.Alarm + counts.Danger;

  const complianceAlertCount = useMemo(() =>
    compliance.filter(c => complianceTier(c.last) === 'Alert').length, [compliance]);

  // Filter chips
  const filteredEquip = useMemo(() => {
    let list = equipList;
    if (statusFilter) list = list.filter(e => e.status === statusFilter);

    if (typeFilter === 'RMS') list = list.filter(e => e.drivenBy.some(d => d.type === 'RMS'));
    if (typeFilter === 'SPM') list = list.filter(e => e.drivenBy.some(d => d.type === 'SPM'));
    if (search.trim()) {

      list = list.filter(e => e.equipmentId.toLowerCase().includes(q) || e.equipment.toLowerCase().includes(q));

          <div style={{ fontSize:10, color:S.T.textMuted }}>alerts</div>
        </div>

        <div style={{ ...S.card, marginBottom:18, display:'flex', alignItems:'center', gap:24, flexWrap:'wrap' }}>
          <DonutChart
            slices={statusDefs.map(d => ({ key:d.key, count:counts[d.key], color:d.color }))}

        <div style={{ ...S.card, textAlign:'center', color:S.T.textMuted, padding:50 }}>

            </div>
          )}
        </div>
      )}
    </div>
  );
}

  }, [registryList, search, lineFilter, equipFilter]);

  const latest = useMemo(() => computeLatestReadings(rms, spm, registryMap, thresholdsMap, rmsRegMap, spmRegMap), [rms, spm, registryMap, thresholdsMap, rmsRegMap, spmRegMap]);
  const statusByEquip = useMemo(() => {
    const m = {};
    const order = { Danger: 4, Alarm: 3, Acceptable: 2, Good: 1 };
    latest.forEach(l => {
      if (!m[l.equipmentId] || (order[l.tier]||0) > (order[m[l.equipmentId].tier]||0)) m[l.equipmentId] = { status: l.status, colorKey: l.colorKey, tier: l.tier };
    });
    return m;
  }, [latest]);

  return (
    <div style={{ padding: 24 }}>
      <div style={{ marginBottom: 16, display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
        <select style={{ ...S.input, width: 160 }} value={lineFilter} onChange={e => { setLineFilter(e.target.value); setEquipFilter(''); }}>
          <option value="">All Lines</option>
          {lines.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
        <select style={{ ...S.input, width: 200 }} value={equipFilter} onChange={e => setEquipFilter(e.target.value)}>

        </select>
        <div style={{ position: 'relative', maxWidth: 280 }}>
          <span style={{ position: 'absolute', left: 10, top: 8, color: S.T.textMuted }}><Icon d={ICONS.search} size={14} /></span>
          <input style={{ ...S.input, paddingLeft: 30 }} placeholder="Search equipment / line / ID…" value={search} onChange={e => setSearch(e.target.value)} />
        </div>
      </div>

      {Object.keys(grouped).sort().map(line => (
        <div key={line} style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: S.T.accent, marginBottom: 10, letterSpacing: 0.5 }}>{line.toUpperCase()} ({grouped[line].length})</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 12 }}>
            {grouped[line].map(eq => {
              const isOpen = expanded === eq.equipmentId;
              const eqRms = rms.filter(r => r.equipmentId === eq.equipmentId).sort((a,b) => b.date > a.date ? 1 : -1);
              const eqSpm = spm.filter(r => r.equipmentId === eq.equipmentId).sort((a,b) => b.date > a.date ? 1 : -1);
              const points = Array.from(new Set([...eqRms.map(r=>r.point), ...eqSpm.map(r=>r.point)]));
              return (
                <div key={eq.equipmentId} style={{ ...S.card, gridColumn: isOpen ? '1 / -1' : 'auto' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer' }}
                    onClick={() => setExpanded(isOpen ? null : eq.equipmentId)}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight }}>{eq.equipmentId}</div>
                      <div style={{ fontSize: 12, color: S.T.textSecondary, marginTop: 2 }} title={eq.equipment}>{eq.equipment}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {statusByEquip[eq.equipmentId] && <StatusPill status={statusByEquip[eq.equipmentId].status} colorKey={statusByEquip[eq.equipmentId].colorKey} />}
                      <span style={{ color: S.T.textMuted, transform: isOpen ? 'rotate(180deg)' : 'none', transition: '0.15s' }}><Icon d={ICONS.chevDown} size={16} /></span>
                    </div>
                  </div>
                  <div style={{ fontSize: 11, color: S.T.textMuted, marginTop: 6 }}>{points.length} measurement point{points.length===1?'':'s'} · {eqRms.length} RMS · {eqSpm.length} SPM readings</div>

                  {isOpen && (
                    <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${S.T.border}` }}>
                      <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                        <button style={{ ...S.btn, display:'flex', alignItems:'center', gap:6 }}
                          onClick={() => setModal({ type: 'RMS', initial: { equipmentId: eq.equipmentId, equipmentName: eq.equipment } })}>
                          <Icon d={ICONS.plus} size={14}/> Add RMS Reading
                        </button>
                        <button style={{ ...S.btnSecondary, display:'flex', alignItems:'center', gap:6 }}
                          onClick={() => setModal({ type: 'SPM', initial: { equipmentId: eq.equipmentId, equipmentName: eq.equipment } })}>
                          <Icon d={ICONS.plus} size={14}/> Add SPM Reading
                        </button>
                      </div>
                      <MiniTable title="RMS Readings" rows={eqRms} emptyText="No RMS readings for this equipment."
                        columns={[
                          { key: 'point', label: 'Point' },
                          { key: 'date', label: 'Date', render: r => fmtDate(r.date) },
                          { key: 'axial', label: 'Axial' },
                          { key: 'horizontal', label: 'Horiz' },
                          { key: 'vertical', label: 'Vert' },
                          { key: 'gear', label: 'Gear' },
                          { key: 'maxVel', label: 'Max', render: r => { const th = getThresholds(thresholdsMap, r.equipmentId, rmsRegMap, spmRegMap); const st = rmsStatus(r.maxVel, th); return <span>{r.maxVel} <StatusPill status={st} colorKey={rmsStatusColor(st)} /></span>; } },
                        ]}
                        onEdit={r => setModal({ type: 'RMS', initial: r })}
                        onDelete={r => setConfirmDelete({ type: 'RMS', row: r })}
                      />
                      <MiniTable title="SPM Readings" rows={eqSpm} emptyText="No SPM readings for this equipment."
                        columns={[
                          { key: 'point', label: 'Point' },
                          { key: 'date', label: 'Date', render: r => fmtDate(r.date) },
                          { key: 'hdm', label: 'HDm', render: r => { const th = getThresholds(thresholdsMap, r.equipmentId, rmsRegMap, spmRegMap); const st = spmStatus(r.hdm, th); return <span>{r.hdm} <StatusPill status={st} colorKey={spmStatusColor(st)} /></span>; } },
                          { key: 'hdc', label: 'HDc' },
                          { key: 'gs', label: 'Gs' },
                        ]}
                        onEdit={r => setModal({ type: 'SPM', initial: r })}
                        onDelete={r => setConfirmDelete({ type: 'SPM', row: r })}
                      />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {modal && (
        <ReadingFormModal
          type={modal.type}
          initial={modal.initial}
          equipmentOptions={equipmentOptions}
          pointOptions={pointOptions}
          thresholds={getThresholds(thresholdsMap, modal.initial?.equipmentId, rmsRegMap, spmRegMap)}
          onCancel={() => setModal(null)}
          onSave={(data) => {
            if (modal.type === 'RMS') {
              data._id ? mutations.updateRMS(data) : mutations.addRMS(data);
            } else {
              data._id ? mutations.updateSPM(data) : mutations.addSPM(data);
            }
            setModal(null);
          }}
        />
      )}
      {confirmDelete && (
        <ConfirmDeleteModal
          label={`${confirmDelete.row.equipmentId} · ${confirmDelete.row.point} · ${fmtDate(confirmDelete.row.date)}`}
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => {
            confirmDelete.type === 'RMS' ? mutations.deleteRMS(confirmDelete.row) : mutations.deleteSPM(confirmDelete.row);
            setConfirmDelete(null);
          }}
        />
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   LIGHTWEIGHT SVG TREND CHART
   ════════════════════════════════════════════════════════════════════════ */
function TrendChart({ title, series, thresholds = [], unit = '', height = 380 }) {
  useTheme();
  const W = 1100, H = height, padL = 60, padR = 24, padT = 30, padB = 46;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const allDates = Array.from(new Set(series.flatMap(s => s.data.map(d => d.x)))).sort();
  const allVals = series.flatMap(s => s.data.map(d => d.y)).filter(v => v !== null && v !== undefined);
  const thrVals = thresholds.map(t => t.value);
  let lo = Math.min(0, ...allVals, ...thrVals);
  let hi = Math.max(1, ...allVals, ...thrVals);
  hi = hi * 1.12;
  if (hi === lo) hi = lo + 1;

  const xScale = (d) => allDates.length <= 1 ? padL + plotW / 2 : padL + (allDates.indexOf(d) / (allDates.length - 1)) * plotW;
  const yScale = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  // x-axis labels: show ~6 evenly spaced
  const labelStep = Math.max(1, Math.ceil(allDates.length / 10));
  const xLabels = allDates.filter((_, i) => i % labelStep === 0 || i === allDates.length - 1);

  if (allDates.length === 0) {
    return (
      <div style={S.cardSub}>
        <div style={{ fontSize: 12.5, fontWeight: 700, color: S.T.textPrimary, marginBottom: 6 }}>{title}</div>
        <div style={{ padding: 30, textAlign: 'center', color: S.T.textMuted, fontSize: 12.5 }}>No data for this point.</div>
      </div>
    );
  }

  return (
    <div style={S.cardSub}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4, flexWrap: 'wrap', gap: 8 }}>
        <div style={{ fontSize: 15, fontWeight: 800, color: S.T.textPrimary }}>{title}</div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          {series.map(s => (
            <span key={s.name} style={{ fontSize: 12.5, fontWeight: 600, color: S.T.textSecondary, display: 'flex', alignItems: 'center', gap: 5 }}>
              <span style={{ width: 12, height: 12, borderRadius: 2, background: s.color, display: 'inline-block' }} /> {s.name}
            </span>
          ))}
          {thresholds.map(t => (
            <span key={t.label} style={{ fontSize: 12, color: S.T.textMuted, display: 'flex', alignItems: 'center', gap: 5 }}>
              <span style={{ width: 14, height: 2, background: t.color, display: 'inline-block' }} /> {t.label}
            </span>
          ))}
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ display: 'block' }}>
        {/* y gridlines + labels */}
        {[0, 0.25, 0.5, 0.75, 1].map(f => {
          const v = lo + f * (hi - lo);
          const y = yScale(v);
          return (
            <g key={f}>
              <line x1={padL} x2={W - padR} y1={y} y2={y} stroke={S.T.border2} strokeWidth="1" />
              <text x={padL - 10} y={y + 4} fontSize="13" fill={S.T.textMuted} textAnchor="end">{v.toFixed(1)}</text>
            </g>
          );
        })}
        {/* threshold lines */}
        {thresholds.map(t => (
          <line key={t.label} x1={padL} x2={W - padR} y1={yScale(t.value)} y2={yScale(t.value)} stroke={t.color} strokeWidth="2" strokeDasharray="6,5" />
        ))}
        {/* x labels */}
        {xLabels.map(d => (
          <text key={d} x={xScale(d)} y={H - 12} fontSize="13" fill={S.T.textMuted} textAnchor="middle">{fmtDate(d)}</text>
        ))}
        {/* series lines + points */}
        {series.map(s => {
          const pts = s.data.filter(d => d.y !== null && d.y !== undefined);
          const path = pts.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xScale(d.x)} ${yScale(d.y)}`).join(' ');
          return (
            <g key={s.name}>
              <path d={path} fill="none" stroke={s.color} strokeWidth="2.5" />
              {pts.map((d, i) => (
                <circle key={i} cx={xScale(d.x)} cy={yScale(d.y)} r="3.5" fill={s.color}>
                  <title>{`${fmtDate(d.x)}: ${d.y} ${unit}`}</title>
                </circle>
              ))}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

   GRAPHS DASHBOARD PAGE

function GraphsPage({ registryList, rms, spm, graphAsset, setGraphAsset, thresholdsMap, rmsRegMap, spmRegMap }) {
  useTheme();
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');

  const equipmentId = graphAsset;

  const eqMeta = registryList.find(e => e.equipmentId === equipmentId);

  let eqRms = rms.filter(r => r.equipmentId === equipmentId);
  let eqSpm = spm.filter(r => r.equipmentId === equipmentId);
  if (dateFrom) { eqRms = eqRms.filter(r => r.date >= dateFrom); eqSpm = eqSpm.filter(r => r.date >= dateFrom); }
  if (dateTo) { eqRms = eqRms.filter(r => r.date <= dateTo); eqSpm = eqSpm.filter(r => r.date <= dateTo); }

  const rmsPoints = Array.from(new Set(eqRms.map(r => r.point))).sort();
  const spmPoints = Array.from(new Set(eqSpm.map(r => r.point))).sort();

  const th = getThresholds(thresholdsMap, equipmentId, rmsRegMap, spmRegMap);
  const rmsThresholds = [
    { value: th.rms.good, color: S.T.success, label: `Good ${th.rms.good}` },
    { value: th.rms.acceptable, color: S.T.warning, label: `Acceptable ${th.rms.acceptable}` },
    { value: th.rms.alarm, color: S.T.danger, label: `Alarm/Danger ${th.rms.alarm}` },
  ];
  const spmThresholds = [
    { value: th.spm.normal, color: S.T.success, label: `Normal ${th.spm.normal}` },
    { value: th.spm.caution, color: S.T.danger, label: `Caution/Danger ${th.spm.caution}` },
  ];

  return (
    <div style={{ padding: 24 }}>
      <div style={{ ...S.card, marginBottom: 18, display: 'flex', gap: 16, alignItems: 'flex-end', flexWrap: 'wrap' }}>
        <div style={{ minWidth: 280, flex: 1 }}>
          <label style={S.label}>Equipment ID</label>
          <select style={S.input} value={equipmentId || ''} onChange={e => setGraphAsset(e.target.value)}>
            <option value="">Select equipment…</option>
            {registryList.map(eq => <option key={eq.equipmentId} value={eq.equipmentId}>{eq.equipmentId} — {eq.equipment} ({eq.line})</option>)}
          </select>
        </div>
        <div>
          <label style={S.label}>From</label>
          <input type="date" style={S.input} value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
        </div>
        <div>
          <label style={S.label}>To</label>
          <input type="date" style={S.input} value={dateTo} onChange={e => setDateTo(e.target.value)} />
        </div>
        {(dateFrom || dateTo) && <button style={S.btnSecondary} onClick={() => { setDateFrom(''); setDateTo(''); }}>Clear dates</button>}
      </div>

      {!equipmentId && (
        <div style={{ ...S.card, textAlign: 'center', color: S.T.textMuted, padding: 50 }}>
          Select an Equipment ID above to view its vibration trend graphs.
        </div>
      )}

      {equipmentId && (
        <>
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: S.T.textHighlight }}>{equipmentId}{eqMeta ? ` — ${eqMeta.equipment}` : ''}</div>
            <div style={{ fontSize: 12, color: S.T.textSecondary }}>{eqMeta?.line} · {rmsPoints.length} RMS point(s), {spmPoints.length} SPM point(s)</div>
          </div>

          {rmsPoints.length > 0 && (
            <div style={{ marginBottom: 22 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: S.T.accent, marginBottom: 10 }}>RMS — Max Velocity (mm/s)</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(480px, 1fr))', gap: 18 }}>
                {rmsPoints.map(point => {
                  const data = eqRms.filter(r => r.point === point).sort((a,b) => a.date < b.date ? -1 : 1);
                  return (
                    <TrendChart key={point} title={point} unit="mm/s"
                      series={[{ name: 'Max Velocity', color: S.T.accent, data: data.map(d => ({ x: d.date, y: d.maxVel })) }]}
                      thresholds={rmsThresholds}
                    />
                  );
                })}
              </div>
            </div>
          )}

          {spmPoints.length > 0 && (
            <div style={{ marginBottom: 22 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: S.T.accent, marginBottom: 10 }}>SPM — HDm / HDc (dBsv)</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(480px, 1fr))', gap: 18 }}>
                {spmPoints.map(point => {
                  const data = eqSpm.filter(r => r.point === point).sort((a,b) => a.date < b.date ? -1 : 1);
                  return (
                    <TrendChart key={point} title={point} unit="dBsv"
                      series={[
                        { name: 'HDm', color: S.T.accent, data: data.map(d => ({ x: d.date, y: d.hdm })) },
                        { name: 'HDc', color: S.T.info === S.T.accent ? S.T.success : S.T.info, data: data.map(d => ({ x: d.date, y: d.hdc })) },
                      ]}
                      thresholds={spmThresholds}
                    />
                  );
                })}
              </div>
            </div>
          )}

          {rmsPoints.length === 0 && spmPoints.length === 0 && (
            <div style={{ ...S.card, textAlign: 'center', color: S.T.textMuted, padding: 50 }}>No readings found for this equipment in the selected date range.</div>
          )}
        </>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   COMPLIANCE TRACKER PAGE (read-only)
   ════════════════════════════════════════════════════════════════════════ */
function compliancePct(months, n) {
  const recent = months.slice(-n);
  if (recent.length === 0) return null;
  const ok = recent.filter(m => complianceTier(m.status) === 'Normal').length;
  return Math.round((ok / recent.length) * 100);
}

function CompliancePage({ compliance }) {
  useTheme();
  const [lineFilter, setLineFilter] = useState('');
  const [statusFilter, setStatusFilter] = useState(null);
  const [search, setSearch] = useState('');
  const [expanded, setExpanded] = useState(null);

  const [equipFilter, setEquipFilter] = useState('');
  const lines = useMemo(() => Array.from(new Set(compliance.map(c => c.line))).filter(Boolean).sort(), [compliance]);
  const equipOptions = useMemo(() => lineFilter ? compliance.filter(c => c.line === lineFilter) : compliance, [compliance, lineFilter]);

  const counts = useMemo(() => {
    const c = { Normal: 0, Caution: 0, Alert: 0 };
    compliance.forEach(r => { const t = complianceTier(r.last); if (c[t] !== undefined) c[t]++; });
    return c;
  }, [compliance]);

  let rows = compliance;
  if (lineFilter) rows = rows.filter(r => r.line === lineFilter);
  if (equipFilter) rows = rows.filter(r => r.equipmentId === equipFilter);
  if (statusFilter) rows = rows.filter(r => complianceTier(r.last) === statusFilter);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    rows = rows.filter(r => r.equipmentId.toLowerCase().includes(q) || r.equipment.toLowerCase().includes(q));
  }

  const cardDefs = [
    { key: 'Normal', label: 'Submitted (Latest)', color: S.T.success },
    { key: 'Caution', label: 'Partial / Under Observation', color: S.T.warning },
    { key: 'Alert', label: 'Missing / Not Submitted', color: S.T.danger },
  ];

  return (
    <div style={{ padding: 24 }}>
      <div style={{ ...S.card, marginBottom: 18, fontSize: 12.5, color: S.T.textSecondary, lineHeight: 1.6 }}>
        <b style={{ color: S.T.textHighlight }}>Legend:</b>{' '}
        <StatusPill status="Normal" colorKey="success" /> = Submitted (YES) &nbsp;
        <StatusPill status="Caution" colorKey="warning" /> = Partial / Comment / Under Observation &nbsp;
        <StatusPill status="Alert" colorKey="danger" /> = Missing / Not Submitted (NO)
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 14, marginBottom: 18 }}>
        {cardDefs.map(c => (
          <div key={c.key} onClick={() => setStatusFilter(statusFilter === c.key ? null : c.key)}
            style={{ ...S.card, cursor: 'pointer', borderColor: statusFilter === c.key ? c.color : S.T.border,
              boxShadow: statusFilter === c.key ? `0 0 0 2px ${c.color}33` : 'none', textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: c.color, marginBottom: 6, letterSpacing: 1 }}>{c.label.toUpperCase()}</div>
            <div style={{ fontSize: 32, fontWeight: 800, color: S.T.textHighlight }}>{counts[c.key]}</div>
            <div style={{ fontSize: 11, color: S.T.textMuted, marginTop: 4 }}>of {compliance.length} equipment</div>
          </div>
        ))}
      </div>

      <div style={S.card}>
        <div style={{ display: 'flex', gap: 10, marginBottom: 12, flexWrap: 'wrap', alignItems: 'center' }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: S.T.textHighlight, flex: 1 }}>
            Monthly Submission Status {statusFilter ? `— ${statusFilter}` : ''}
          </div>
          <select style={{ ...S.input, width: 160 }} value={lineFilter} onChange={e => { setLineFilter(e.target.value); setEquipFilter(''); }}>
            <option value="">All Lines</option>
            {lines.map(l => <option key={l} value={l}>{l}</option>)}
          </select>
          <select style={{ ...S.input, width: 200 }} value={equipFilter} onChange={e => setEquipFilter(e.target.value)}>
            <option value="">All Equipment</option>
            {equipOptions.map(c => <option key={c.equipmentId} value={c.equipmentId}>{c.equipmentId} — {c.equipment}</option>)}
          </select>
          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: 10, top: 8, color: S.T.textMuted }}><Icon d={ICONS.search} size={14} /></span>
            <input style={{ ...S.input, paddingLeft: 30, width: 200 }} placeholder="Search equipment / ID…" value={search} onChange={e => setSearch(e.target.value)} />
          </div>
        </div>

        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12.5 }}>
            <thead>
              <tr style={{ background: S.T.tableHead }}>
                {['Line','Equipment','Asset ID','Last Status','Compliance (12mo)',''].map(h => (
                  <th key={h} style={{ textAlign: 'left', padding: '8px 10px', color: S.T.textSecondary, fontWeight: 700, borderBottom: `1px solid ${S.T.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => {
                const pct = compliancePct(r.months, 12);
                const isOpen = expanded === r.equipmentId;
                const last24 = r.months.slice(-24);
                return (
                  <React.Fragment key={r.equipmentId}>
                    <tr style={{ background: i % 2 ? S.T.tableRowAlt : S.T.tableRow, cursor: 'pointer' }}
                      onClick={() => setExpanded(isOpen ? null : r.equipmentId)}>

                      <td style={{ padding: '7px 10px', color: S.T.textHighlight, fontWeight: 700, borderBottom: `1px solid ${S.T.border2}` }}>{r.equipmentId}</td>
                      <td style={{ padding: '7px 10px', borderBottom: `1px solid ${S.T.border2}` }}><StatusPill status={r.last || 'Missing'} colorKey={complianceColor(complianceTier(r.last))} /></td>
                      <td style={{ padding: '7px 10px', color: S.T.textPrimary, borderBottom: `1px solid ${S.T.border2}` }}>{pct === null ? '—' : `${pct}%`}</td>
                      <td style={{ padding: '7px 10px', borderBottom: `1px solid ${S.T.border2}`, color: S.T.textMuted }}>
                        <span style={{ transform: isOpen ? 'rotate(180deg)' : 'none', display: 'inline-block', transition: '0.15s' }}><Icon d={ICONS.chevDown} size={14} /></span>
                      </td>
                    </tr>
                    {isOpen && (
                      <tr style={{ background: i % 2 ? S.T.tableRowAlt : S.T.tableRow }}>
                        <td colSpan={6} style={{ padding: '10px 14px 16px', borderBottom: `1px solid ${S.T.border2}` }}>
                          <div style={{ fontSize: 11, color: S.T.textMuted, marginBottom: 6 }}>Last {last24.length} months (oldest → newest)</div>
                          <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap' }}>
                            {last24.map(m => {
                              const tier = complianceTier(m.status);
                              const color = S.T[complianceColor(tier)];
                              return (
                                <div key={m.month} title={`${m.month}: ${m.status}`}
                                  style={{ width: 26, height: 26, borderRadius: 4, background: color + '33', border: `1px solid ${color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, color, fontWeight: 700 }}>
                                  {m.month.slice(5)}
                                </div>
                              );
                            })}
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {rows.length === 0 && <tr><td colSpan={6} style={{ padding: 20, textAlign: 'center', color: S.T.textMuted }}>No equipment found.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── Sheet names ─────────────────────────────────────────────────────────────
var SHEET_RMS        = '📥 RMS DATA';
var SHEET_SPM        = '📥 SPM DATA';
var SHEET_COMPLIANCE = '📋 Compliance Tracker';
var SHEET_RMS_REG    = '⚙ RMS Register';
var SHEET_SPM_REG    = '⚙ SPM Register';
var SHEET_LAST_RMS   = '📋 Last RMS Reading';
var SHEET_LAST_SPM   = '📋 Last SPM Reading';

// ─── Header/data row config (1-based) ────────────────────────────────────────
var SHEET_CONFIG = {};
SHEET_CONFIG[SHEET_RMS]        = { headerRow: 3, dataStartRow: 4 };
SHEET_CONFIG[SHEET_SPM]        = { headerRow: 3, dataStartRow: 4 };
SHEET_CONFIG[SHEET_COMPLIANCE] = { headerRow: 3, dataStartRow: 4 };
SHEET_CONFIG[SHEET_RMS_REG]    = { headerRow: 1, dataStartRow: 2 };
SHEET_CONFIG[SHEET_SPM_REG]    = { headerRow: 1, dataStartRow: 2 };
SHEET_CONFIG[SHEET_LAST_RMS]   = { headerRow: 1, dataStartRow: 2 };
SHEET_CONFIG[SHEET_LAST_SPM]   = { headerRow: 1, dataStartRow: 2 };

function dataStartRowFor(sn) { var c=SHEET_CONFIG[sn]; return c?c.dataStartRow:1; }
function headerRowFor(sn)    { var c=SHEET_CONFIG[sn]; return c?c.headerRow:1; }

// ─── Severity ordering ────────────────────────────────────────────────────────
var STATUS_ORDER = { 'Good':1,'Normal':1,'Acceptable':2,'Caution':2,'Alarm':3,'Danger':4 };
function worstStatus(a, b) {
  return (STATUS_ORDER[a]||0) >= (STATUS_ORDER[b]||0) ? a : b;
}

// ─── Entry points ─────────────────────────────────────────────────────────────
function doGet(e) {
  try {
    var action = e.parameter.action || 'readAll';
    var result;
    if      (action==='readAll')              result = readAll();
    else if (action==='test')                 result = {status:'ok',time:new Date().toISOString()};
    else if (action==='append')               result = handleAppend(e.parameter);
    else if (action==='updateRow')            result = handleUpdateRow(e.parameter);
    else if (action==='deleteRow')            result = handleDeleteRow(e.parameter);
    else if (action==='upsertLastRMS')        result = handleUpsertLastRMS(e.parameter);
    else if (action==='upsertLastSPM')        result = handleUpsertLastSPM(e.parameter);
    else if (action==='deleteLastRMS')        result = handleDeleteLastRMS(e.parameter);
    else if (action==='deleteLastSPM')        result = handleDeleteLastSPM(e.parameter);
    else if (action==='updateRegisterLimits') result = handleUpdateRegisterLimits(e.parameter);
    else if (action==='backfillLastReadings') result = handleBackfillLastReadings();
    else result = {error:'Unknown action: '+action};
    return jsonOut(e, result);
  } catch(err) { return jsonOut(e,{error:String(err)}); }
}

function doPost(e) {
  try {
    var body = {};
    if (e.postData && e.postData.contents) {
      try { body = JSON.parse(e.postData.contents); } catch(x) { body = e.parameter; }
    } else { body = e.parameter; }
    var action = body.action || 'readAll';
    var result;
    if      (action==='readAll')              result = readAll();
    else if (action==='test')                 result = {status:'ok',time:new Date().toISOString()};
    else if (action==='append')               result = handleAppend(body);
    else if (action==='updateRow')            result = handleUpdateRow(body);
    else if (action==='deleteRow')            result = handleDeleteRow(body);
    else if (action==='upsertLastRMS')        result = handleUpsertLastRMS(body);
    else if (action==='upsertLastSPM')        result = handleUpsertLastSPM(body);
    else if (action==='deleteLastRMS')        result = handleDeleteLastRMS(body);
    else if (action==='deleteLastSPM')        result = handleDeleteLastSPM(body);
    else if (action==='updateRegisterLimits') result = handleUpdateRegisterLimits(body);
    else if (action==='backfillLastReadings') result = handleBackfillLastReadings();
    else result = {error:'Unknown action: '+action};
    return jsonOut(e, result);
  } catch(err) { return jsonOut(e,{error:String(err)}); }
}

function jsonOut(e, obj) {
  var json = JSON.stringify(obj);
  var cb = e && e.parameter && e.parameter.callback;
  if (cb) return ContentService.createTextOutput(cb+'('+json+')').setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(json).setMimeType(ContentService.MimeType.JSON);
}

// ─── readAll ──────────────────────────────────────────────────────────────────
function readAll() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  return {
    rms:         readSheet(ss, SHEET_RMS),
    spm:         readSheet(ss, SHEET_SPM),
    compliance:  readCompliance(ss),
    rmsRegister: readSheet(ss, SHEET_RMS_REG),
    spmRegister: readSheet(ss, SHEET_SPM_REG),
    lastRms:     readSheet(ss, SHEET_LAST_RMS),
    lastSpm:     readSheet(ss, SHEET_LAST_SPM),
  };
}

// ─── Generic sheet reader ─────────────────────────────────────────────────────
function readSheet(ss, sheetName) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var cfg = SHEET_CONFIG[sheetName];
  var headerRow = cfg.headerRow;
  var dataStart = cfg.dataStartRow;
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  if (lastRow < dataStart || lastCol < 1) return [];

  var headers = sheet.getRange(headerRow, 1, 1, lastCol).getValues()[0];
  var numRows = lastRow - dataStart + 1;
  var data = sheet.getRange(dataStart, 1, numRows, lastCol).getValues();
  var tz = Session.getScriptTimeZone() || 'UTC';

  var out = [];
  for (var i = 0; i < data.length; i++) {
    var row = data[i];
    var hasData = false;
    for (var c = 0; c < row.length; c++) { if (row[c]!==''&&row[c]!==null){ hasData=true; break; } }
    if (!hasData) continue;
    var obj = {};
    for (var h = 0; h < headers.length; h++) {
      var key = headers[h]; if (!key) continue;
      var val = row[h];
      if (val instanceof Date) val = Utilities.formatDate(val, tz, "yyyy-MM-dd'T'HH:mm:ss");
      obj[key] = val;
    }
    obj._rowNum = dataStart + i;
    out.push(obj);
  }
  return out;
}

// ─── Compliance reader (special wide format) ──────────────────────────────────
function readCompliance(ss) {
  var sheet = ss.getSheetByName(SHEET_COMPLIANCE);
  if (!sheet) return [];
  var cfg = SHEET_CONFIG[SHEET_COMPLIANCE];
  var headerRow = cfg.headerRow; var dataStart = cfg.dataStartRow;
  var lastRow = sheet.getLastRow(); var lastCol = sheet.getLastColumn();
  if (lastRow < dataStart) return [];
  var headers = sheet.getRange(headerRow,1,1,lastCol).getValues()[0];
  var data = sheet.getRange(dataStart,1,lastRow-dataStart+1,lastCol).getValues();
  var tz = Session.getScriptTimeZone() || 'UTC';
  var out = [];
  for (var i=0;i<data.length;i++) {
    var row=data[i]; if (!row[2]) continue;
    var obj={line:row[0],equipment:row[1],equipmentId:row[2],last:row[3],months:[]};
    for (var h=4;h<headers.length;h++) {
      var label=headers[h]; if (!label) continue;
      var val=row[h]; if (val===''||val===null||val===undefined) continue;
      var ms = (label instanceof Date) ? Utilities.formatDate(label,tz,'yyyy-MM') : String(label);
      obj.months.push({month:ms,status:String(val)});
    }
    obj._rowNum = dataStart+i;
    out.push(obj);
  }
  return out;
}

// ─── append ───────────────────────────────────────────────────────────────────
function handleAppend(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetName = params.sheet;
  var row = JSON.parse(params.row);
  var headers = params.headers ? JSON.parse(params.headers) : null;
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) { sheet = ss.insertSheet(sheetName); if (headers) sheet.getRange(1,1,1,headers.length).setValues([headers]); }
  sheet.appendRow(row);
  return {status:'ok',action:'append',sheet:sheetName,rowNum:sheet.getLastRow()};
}

// ─── updateRow ────────────────────────────────────────────────────────────────
function handleUpdateRow(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetName = params.sheet;
  var matchCols   = JSON.parse(params.matchCols);
  var matchValues = JSON.parse(params.matchValues);
  var row = JSON.parse(params.row);
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return {status:'error',error:'Sheet not found: '+sheetName};
  var idx = findRowIndex(sheet, matchCols, matchValues, dataStartRowFor(sheetName));
  if (idx===-1) return {status:'error',error:'Row not found'};
  sheet.getRange(idx,1,1,row.length).setValues([row]);
  return {status:'ok',action:'updateRow',sheet:sheetName,rowNum:idx};
}

// ─── deleteRow ────────────────────────────────────────────────────────────────
function handleDeleteRow(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetName = params.sheet;
  var matchCols   = JSON.parse(params.matchCols);
  var matchValues = JSON.parse(params.matchValues);
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return {status:'error',error:'Sheet not found: '+sheetName};
  var idx = findRowIndex(sheet, matchCols, matchValues, dataStartRowFor(sheetName));
  if (idx===-1) return {status:'error',error:'Row not found'};
  sheet.deleteRow(idx);
  return {status:'ok',action:'deleteRow',sheet:sheetName,rowNum:idx};
}

// params: equipmentId, equipmentName, line, point, date, axial, gear,

function handleUpsertLastRMS(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(SHEET_LAST_RMS);
  if (!sheet) return {status:'error',error:'Sheet not found: '+SHEET_LAST_RMS};

  var eid   = String(params.equipmentId||'').trim();
  var point = String(params.point||'').trim();
  var row = [
    eid,
    params.equipmentName||'',
    params.line||'',
    point,
    params.date||'',
    params.axial||'',
    params.gear||'',
    params.horizontal||'',
    params.vertical||'',
    params.maxVelocity||'',
    params.readingStatus||'',
    '' // Machine Status — filled below
  ];

  // Find existing row: match Equipment ID (col 0) + Point (col 3)
  var dataStart = dataStartRowFor(SHEET_LAST_RMS);
  var idx = findRowIndex(sheet, [0,3], [eid, point], dataStart);
  if (idx !== -1) {
    sheet.getRange(idx,1,1,row.length).setValues([row]);
  } else {
    sheet.appendRow(row);
    idx = sheet.getLastRow();
  }

  // Recalculate machine status for this equipment across both Last Reading sheets
  var machineStatus = recalcMachineStatus(ss, eid);

  // Write machine status to ALL rows for this equipment in Last RMS
  updateMachineStatusCol(sheet, eid, 0, 11, machineStatus, dataStart);
  // Write machine status to ALL rows for this equipment in Last SPM
  var spmSheet = ss.getSheetByName(SHEET_LAST_SPM);
  if (spmSheet) updateMachineStatusCol(spmSheet, eid, 0, 10, machineStatus, dataStartRowFor(SHEET_LAST_SPM));

  return {status:'ok',action:'upsertLastRMS',equipmentId:eid,machineStatus:machineStatus};
}

// ─── updateRegisterLimits ─────────────────────────────────────────────────────
// params: type ('RMS'|'SPM'), equipmentId, + limit fields
function handleUpdateRegisterLimits(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var eid = String(params.equipmentId||'').trim();
  var type = String(params.type||'RMS');

  if (type === 'RMS') {
    var sheet = ss.getSheetByName(SHEET_RMS_REG);
    if (!sheet) return {status:'error',error:'Sheet not found: '+SHEET_RMS_REG};
    var idx = findRowIndex(sheet,[0],[eid],dataStartRowFor(SHEET_RMS_REG));
    if (idx===-1) return {status:'error',error:'Equipment not found in RMS Register: '+eid};
    // Cols E,F,G = indices 4,5,6 (1-based: 5,6,7)
    sheet.getRange(idx,5).setValue(parseFloat(params.rmsGood)||'');
    sheet.getRange(idx,6).setValue(parseFloat(params.rmsAcceptable)||'');
    sheet.getRange(idx,7).setValue(parseFloat(params.rmsAlarm)||'');
    return {status:'ok',action:'updateRegisterLimits',type:'RMS',equipmentId:eid};
  } else {
    var sheet2 = ss.getSheetByName(SHEET_SPM_REG);
    if (!sheet2) return {status:'error',error:'Sheet not found: '+SHEET_SPM_REG};
    var idx2 = findRowIndex(sheet2,[0],[eid],dataStartRowFor(SHEET_SPM_REG));
    if (idx2===-1) return {status:'error',error:'Equipment not found in SPM Register: '+eid};
    // Cols F,G,H = indices 5,6,7 (1-based: 6,7,8)
    sheet2.getRange(idx2,6).setValue(parseFloat(params.spmNormal)||'');
    sheet2.getRange(idx2,7).setValue(parseFloat(params.spmCaution)||'');
    sheet2.getRange(idx2,8).setValue(parseFloat(params.spmAlarm)||'');
    return {status:'ok',action:'updateRegisterLimits',type:'SPM',equipmentId:eid};
  }
}

// ─── backfillLastReadings ─────────────────────────────────────────────────────
// Scans all RMS DATA + SPM DATA, finds latest per equipment+point, writes to Last Reading sheets
function handleBackfillLastReadings() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var tz = Session.getScriptTimeZone() || 'UTC';

  // Read RMS DATA
  var rmsSheet  = ss.getSheetByName(SHEET_RMS);
  var lastRmsSheet = ss.getSheetByName(SHEET_LAST_RMS);
  var lastSpmSheet = ss.getSheetByName(SHEET_LAST_SPM);
  if (!rmsSheet || !lastRmsSheet || !lastSpmSheet) return {status:'error',error:'Required sheets missing'};

  // ── Process RMS DATA ─────────────────────────────────────────────────────
  var rmsRows = readSheet(ss, SHEET_RMS);
  // latest per equipmentId+point: key -> row object
  var latestRms = {};
  for (var i=0;i<rmsRows.length;i++) {
    var r = rmsRows[i];
    var eid   = String(r['Equipment ID']||'').trim();
    var point = String(r['Asset ID']||'').trim();
    var dateVal = r['Date']||'';
    if (!eid||!point||!dateVal) continue;
    var key = eid+'||'+point;
    var existing = latestRms[key];
    var dCur = String(dateVal);
    var dEx  = existing ? String(existing['Date']||'') : '';
    if (!existing || dCur > dEx) latestRms[key] = r;
  }

  // ── Process SPM DATA ─────────────────────────────────────────────────────
  var spmRows = readSheet(ss, SHEET_SPM);
  var latestSpm = {};
  for (var j=0;j<spmRows.length;j++) {
    var s = spmRows[j];
    var seid   = String(s['Equipment ID']||'').trim();
    var spoint = String(s['Asset ID']||'').trim();
    var sdateVal = s['Date']||'';
    if (!seid||!spoint||!sdateVal) continue;
    var skey = seid+'||'+spoint;
    var sex = latestSpm[skey];
    var dsCur = String(sdateVal);
    var dsEx  = sex ? String(sex['Date']||'') : '';
    if (!sex || dsCur > dsEx) latestSpm[skey] = s;
  }

  // ── Read RMS Register for limits ─────────────────────────────────────────
  var rmsRegRows = readSheet(ss, SHEET_RMS_REG);
  var rmsLimits  = {};
  for (var ri=0;ri<rmsRegRows.length;ri++) {
    var rr = rmsRegRows[ri];
    var reid = String(rr['Equipment ID']||'').trim();
    rmsLimits[reid] = {
      good: parseFloat(rr['RMS Good'])||2.8,
      acceptable: parseFloat(rr['RMS Acceptable'])||7.1,
      alarm: parseFloat(rr['RMS Alarm'])||18
    };
  }

  var spmRegRows = readSheet(ss, SHEET_SPM_REG);
  var spmLimits  = {};
  for (var si=0;si<spmRegRows.length;si++) {
    var sr = spmRegRows[si];
    var srid = String(sr['Equipment ID']||'').trim();
    spmLimits[srid] = {
      normal: parseFloat(sr['SPM Normal'])||20,
      caution: parseFloat(sr['SPM Caution'])||35,
      alarm: parseFloat(sr['SPM Alarm'])||50,
      spmType: String(sr['SPM Type']||'')
    };
  }

  // ── Compute reading statuses ──────────────────────────────────────────────
  function calcRmsStatus(maxVel, lim) {
    var v = parseFloat(maxVel); if (isNaN(v)) return '';
    if (v < lim.good) return 'Good';
    if (v < lim.acceptable) return 'Acceptable';
    if (v < lim.alarm) return 'Alarm';
    return 'Danger';
  }
  function calcSpmStatus(hdm, lim) {
    var v = parseFloat(hdm); if (isNaN(v)) return '';
    if (v < lim.normal) return 'Normal';
    if (v < lim.caution) return 'Caution';
    return 'Danger';
  }

  // ── Write Last RMS Reading ────────────────────────────────────────────────
  // Clear old data (keep header)
  var lrLastRow = lastRmsSheet.getLastRow();
  if (lrLastRow >= 2) lastRmsSheet.getRange(2,1,lrLastRow-1,lastRmsSheet.getLastColumn()).clearContent();

  var rmsOutRows = [];
  var equipRmsStatus = {}; // eid -> worst RMS reading status
  for (var rk in latestRms) {
    var rr2 = latestRms[rk];
    var reid2 = String(rr2['Equipment ID']||'').trim();
    var lim = rmsLimits[reid2] || {good:2.8,acceptable:7.1,alarm:18};
    var maxVel = parseFloat(rr2['Max Velocity (mm/s)'])||0;
    var vals = [parseFloat(rr2['AXial (mm/s)']||0),parseFloat(rr2['Gear\\n(mm/s)']||0),parseFloat(rr2['Horizontal (mm/s)']||0),parseFloat(rr2['Vertical (mm/s)']||0)].filter(function(v){return !isNaN(v);});
    if (!maxVel && vals.length) maxVel = Math.max.apply(null,vals);
    var rs = calcRmsStatus(maxVel, lim);
    var dateStr = rr2['Date']||'';
    if (dateStr instanceof Date) dateStr = Utilities.formatDate(dateStr, tz, 'yyyy-MM-dd');
    rmsOutRows.push([reid2, rr2['Equipment Name']||'', '', String(rr2['Asset ID']||''), dateStr,
      rr2['AXial (mm/s)']||'', rr2['Gear\\n(mm/s)']||'', rr2['Horizontal (mm/s)']||'', rr2['Vertical (mm/s)']||'', maxVel||'', rs, '']);
    equipRmsStatus[reid2] = equipRmsStatus[reid2] ? worstStatus(equipRmsStatus[reid2], rs) : rs;
  }
  if (rmsOutRows.length) lastRmsSheet.getRange(2,1,rmsOutRows.length,12).setValues(rmsOutRows);

  // ── Write Last SPM Reading ────────────────────────────────────────────────
  var lsLastRow = lastSpmSheet.getLastRow();
  if (lsLastRow >= 2) lastSpmSheet.getRange(2,1,lsLastRow-1,lastSpmSheet.getLastColumn()).clearContent();

  var spmOutRows = [];
  var equipSpmStatus = {};
  for (var sk in latestSpm) {
    var sr2 = latestSpm[sk];
    var seid2 = String(sr2['Equipment ID']||'').trim();
    var slim = spmLimits[seid2] || {normal:20,caution:35,alarm:50,spmType:''};
    var hdm = parseFloat(sr2['HDm (dBsv)']||0);
    var ss2 = calcSpmStatus(hdm, slim);
    var sdateStr = sr2['Date']||'';
    if (sdateStr instanceof Date) sdateStr = Utilities.formatDate(sdateStr, tz, 'yyyy-MM-dd');
    spmOutRows.push([seid2, sr2['Equipment Name']||'', '', String(sr2['Asset ID']||''), slim.spmType||'',
      sdateStr, sr2['HDm (dBsv)']||'', sr2['HDc (dBsv)']||'', sr2['Gs']||'', ss2, '']);
    equipSpmStatus[seid2] = equipSpmStatus[seid2] ? worstStatus(equipSpmStatus[seid2], ss2) : ss2;
  }
  if (spmOutRows.length) lastSpmSheet.getRange(2,1,spmOutRows.length,11).setValues(spmOutRows);

  // ── Compute combined machine status per equipment + write back ────────────
  var allEids = {};
  for (var e1 in equipRmsStatus) allEids[e1]=1;
  for (var e2 in equipSpmStatus) allEids[e2]=1;

  for (var eid2 in allEids) {
    var rs2 = equipRmsStatus[eid2]||'';
    var ss3 = equipSpmStatus[eid2]||'';
    var ms = rs2 && ss3 ? worstStatus(rs2,ss3) : (rs2||ss3);
    updateMachineStatusCol(lastRmsSheet, eid2, 0, 11, ms, dataStartRowFor(SHEET_LAST_RMS));
    updateMachineStatusCol(lastSpmSheet, eid2, 0, 10, ms, dataStartRowFor(SHEET_LAST_SPM));
  }

  return {status:'ok',action:'backfillLastReadings',rmsRows:rmsOutRows.length,spmRows:spmOutRows.length};
}

// ─── recalcMachineStatus ──────────────────────────────────────────────────────
// Scans both Last Reading sheets for an equipmentId, finds worst status across all rows
function recalcMachineStatus(ss, eid) {
  var worst = '';
  var rmsSheet = ss.getSheetByName(SHEET_LAST_RMS);
  if (rmsSheet) {
    var data = getAllRowsForEquip(rmsSheet, eid, 0, dataStartRowFor(SHEET_LAST_RMS));
    for (var i=0;i<data.length;i++) { var s=String(data[i][10]||''); if(s) worst=worst?worstStatus(worst,s):s; }
  }
  var spmSheet = ss.getSheetByName(SHEET_LAST_SPM);
  if (spmSheet) {
    var data2 = getAllRowsForEquip(spmSheet, eid, 0, dataStartRowFor(SHEET_LAST_SPM));
    for (var j=0;j<data2.length;j++) { var s2=String(data2[j][9]||''); if(s2) worst=worst?worstStatus(worst,s2):s2; }
  }
  return worst;
}

// ─── getAllRowsForEquip ───────────────────────────────────────────────────────
function getAllRowsForEquip(sheet, eid, equipCol, dataStart) {
  var lastRow = sheet.getLastRow(); var lastCol = sheet.getLastColumn();
  if (lastRow < dataStart || lastCol < 1) return [];
  var data = sheet.getRange(dataStart,1,lastRow-dataStart+1,lastCol).getValues();
  var out = [];
  for (var i=0;i<data.length;i++) { if (String(data[i][equipCol]||'').trim()===eid) out.push(data[i]); }
  return out;
}

// ─── updateMachineStatusCol ───────────────────────────────────────────────────
// Updates machine status column for all rows matching eid in given sheet
function updateMachineStatusCol(sheet, eid, equipCol, statusColIdx, machineStatus, dataStart) {
  var lastRow = sheet.getLastRow(); var lastCol = sheet.getLastColumn();
  if (lastRow < dataStart || lastCol < 1) return;
  var data = sheet.getRange(dataStart,1,lastRow-dataStart+1,lastCol).getValues();
  for (var i=0;i<data.length;i++) {
    if (String(data[i][equipCol]||'').trim()===eid) {
      sheet.getRange(dataStart+i, statusColIdx+1).setValue(machineStatus);
    }
  }
}

// ─── findRowIndex ─────────────────────────────────────────────────────────────
function findRowIndex(sheet, matchCols, matchValues, dataStartRow) {
  var lastRow = sheet.getLastRow(); var lastCol = sheet.getLastColumn();
  if (lastRow < dataStartRow || lastCol < 1) return -1;
  var data = sheet.getRange(dataStartRow,1,lastRow-dataStartRow+1,lastCol).getValues();
  for (var i=0;i<data.length;i++) {
    var row=data[i]; var match=true;
    for (var c=0;c<matchCols.length;c++) {
      var actual=row[matchCols[c]];
      if (actual instanceof Date) actual=Utilities.formatDate(actual,Session.getScriptTimeZone()||'UTC',"yyyy-MM-dd'T'HH:mm:ss");
      if (String(actual)!==String(matchValues[c])) { match=false; break; }
    }
    if (match) return dataStartRow+i;
  }
  return -1;
}
`;

function PasskeyModal({ onUnlock, onCancel }) {
  useTheme();
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');
  const inputRef = useRef(null);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  const attempt = () => {
    if (_checkPasskey(pass)) { onUnlock(); }
    else { setError('Invalid pass key. Please try again.'); setPass(''); setTimeout(() => setError(''), 2500); }
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200 }}

        {error && <div style={{ fontSize: 12, color: S.T.danger, marginBottom: 8, textAlign: 'center', fontWeight: 600 }}>{error}</div>}

/* ── Backfill Button Component ──────────────────────────────────────── */
function BackfillButton({ webhookUrl }) {
  useTheme();
  const [state, setState] = useState('idle'); // idle | loading | done | error
  const [msg, setMsg] = useState('');

  const run = async () => {
    if (!webhookUrl) { setMsg('No webhook URL configured — go to Settings → Configuration'); setState('error'); return; }
    setState('loading'); setMsg('Scanning all RMS & SPM history… this may take 20–40 seconds.');
    try {
      const result = await triggerBackfill(webhookUrl);
      if (result && result.status === 'ok') {
        setMsg(`✓ Done — ${result.rmsRows} RMS rows · ${result.spmRows} SPM rows written to Last Reading sheets.`);
        setState('done');
      } else {
        setMsg('✕ Backfill failed: ' + (result && result.error ? result.error : 'Unknown error'));
        setState('error');
      }
    } catch(e) {
      setMsg('✕ Error: ' + String(e.message || e));
      setState('error');
    }
  };

  return (
    <div>
      <button style={{ ...S.btn, display:'flex', alignItems:'center', gap:8, opacity: state==='loading' ? 0.6 : 1 }}
        disabled={state==='loading'} onClick={run}>
        {state==='loading' ? '⏳ Running backfill…' : '▶ Run Backfill Now'}
      </button>
      {msg && (
        <div style={{ marginTop:10, fontSize:12.5, color: state==='done' ? S.T.success : state==='error' ? S.T.danger : S.T.textSecondary, fontWeight:600, lineHeight:1.5 }}>
          {msg}
        </div>
      )}
    </div>
  );
}
