// Normalize "Asset ID" / measurement point labels (RMS & SPM "Asset ID" column)
function normalizePoint(p) {
  if (p === null || p === undefined) return '';
  let s = String(p).replace(/\s+/g, ' ').trim();
  s = s.replace(/\bouboard\b/gi, 'Outboard');
  s = s.replace(/\boutbord\b/gi, 'Outboard');
  s = s.replace(/\binboard\b/gi, 'Inboard');
  s = s.replace(/\boutboard\b/gi, 'Outboard');
  // collapse "Fan  DE" -> "Fan DE", normalize double-space variants already done above
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

// Normalize ANY date input (ISO string, Google Sheets serial number, formatted string)
// to a consistent display format e.g. "26 Dec 2025"
function fmtDate(val) {
  if (val === null || val === undefined || val === '') return '';
  let d = null;
  if (val instanceof Date) {
    d = val;
  } else if (typeof val === 'number') {
    // Google Sheets serial date (days since 1899-12-30)
    d = new Date(Math.round((val - 25569) * 86400 * 1000));
  } else if (typeof val === 'string') {
    const s = val.trim();
    if (/^\d+(\.\d+)?$/.test(s)) {
      d = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
    } else {
      d = new Date(s);
    }
  }
  if (!d || isNaN(d.getTime())) return String(val);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getUTCDate()).padStart(2,'0')} ${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

// ISO date (yyyy-MM-dd) for sorting / form inputs
function isoDate(val) {
  if (val === null || val === undefined || val === '') return '';
  let d = null;
  if (val instanceof Date) {
    d = val;
  } else if (typeof val === 'number') {
    d = new Date(Math.round((val - 25569) * 86400 * 1000));
  } else if (typeof val === 'string') {
    const s = val.trim();
    if (/^\d+(\.\d+)?$/.test(s)) {
      d = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
    } else {
      d = new Date(s);
    }
  }
  if (!d || isNaN(d.getTime())) return '';
  return d.toISOString().slice(0, 10);
}

// Dedupe by _id, local wins on conflict
function mergeById(sheetArr, localArr) {
  const map = new Map();
  (sheetArr || []).forEach(r => map.set(r._id, r));
  (localArr || []).forEach(r => map.set(r._id, r));
  return Array.from(map.values());
}

   STATUS THRESHOLDS (3-tier: Normal / Caution / Alert)
   ════════════════════════════════════════════════════════════════════════ */
const THRESHOLDS = {
  rms: { caution: 2.8, alert: 7.1 },   // ISO 10816: <2.8 Good, 2.8-7.1 Acceptable, >7.1 Alarm/Danger
  spmHdm: { caution: 20, alert: 35 },  // HDm dBsv
};

function rmsStatus(maxVel) {
  const v = parseFloat(maxVel);
  if (isNaN(v)) return null;
  if (v < THRESHOLDS.rms.caution) return 'Normal';
  if (v < THRESHOLDS.rms.alert) return 'Caution';
  return 'Alert';
}
function spmStatus(hdm) {
  const v = parseFloat(hdm);
  if (isNaN(v)) return null;
  if (v < THRESHOLDS.spmHdm.caution) return 'Normal';
  if (v < THRESHOLDS.spmHdm.alert) return 'Caution';
  return 'Alert';
}
// Compliance month status -> 3-tier
function complianceTier(status) {
  if (!status) return 'Alert';
  const s = String(status).trim().toLowerCase();
  if (s === 'yes') return 'Normal';
  if (s === 'no' || s === 'missing') return 'Alert';
  if (s.indexOf('comment') !== -1 || s.indexOf('caution') !== -1 || s.indexOf('observation') !== -1) return 'Caution';
  return 'Alert';
}

function num(v) {
  if (v === '' || v === null || v === undefined) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

// RMS row -> normalized object
function rowToRMS(r) {
  const point = normalizePoint(r['Asset ID']);
  const equipmentId = String(r['Equipment ID'] || '').trim();
  const dateIso = isoDate(r['Date']);
  const axial = num(r['AXial (mm/s)']);
  const gear = num(r['Gear\n(mm/s)']);
  const horiz = num(r['Horizontal (mm/s)']);
  const vert = num(r['Vertical (mm/s)']);
  let maxVel = num(r['Max Velocity (mm/s)']);
  if (maxVel === null) {
    const vals = [axial, gear, horiz, vert].filter(v => v !== null);
    maxVel = vals.length ? Math.max(...vals) : null;
  }
  return {
    _id: `RMS|${equipmentId}|${point}|${dateIso}`,
    _matchCols: [2,3,4],
    _matchValues: [equipmentId, r['Asset ID'], r['Date']],
    _rowNum: r._rowNum,
    seq: r['#'],
    equipmentName: r['Equipment Name'] || '',
    equipmentId,
    point,
    date: dateIso,
    axial, gear, horizontal: horiz, vertical: vert, maxVel,
  };
}
function rmsToRow(s) {
  return [s.seq ?? '', s.equipmentName ?? '', s.equipmentId ?? '', s.point ?? '', s.date ?? '',
    s.axial ?? '', s.gear ?? '', s.horizontal ?? '', s.vertical ?? '', s.maxVel ?? ''];
}

/* ════════════════════════════════════════════════════════════════════════
   SHEET READ / WRITE HELPERS  (JSONP fallback for cross-origin)
   ════════════════════════════════════════════════════════════════════════ */
let _jsonpCounter = 0;
function jsonpRequest(url, params) {
  return new Promise((resolve, reject) => {
    const cbName = `__vibjsonp_${Date.now()}_${_jsonpCounter++}`;
    const qs = new URLSearchParams({ ...params, callback: cbName }).toString();
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = (data) => {
      if (done) return;
      done = true;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('JSONP request failed (network/script error)'));
    };
    script.src = `${url}?${qs}`;
    document.body.appendChild(script);
    setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('JSONP request timed out'));
    }, 20000);
  });
}

async function sheetRead(webhookUrl, action = 'readAll', extra = {}) {
  if (!webhookUrl) throw new Error('No webhook URL configured');
  // Try direct fetch first (works if same-origin / CORS allowed)
  try {
    const qs = new URLSearchParams({ action, ...extra }).toString();
    const resp = await fetch(`${webhookUrl}?${qs}`, { method: 'GET' });
    if (resp.ok) {
      const data = await resp.json();
      return data;
    }
    throw new Error(`HTTP ${resp.status}`);
  } catch (err) {
    // Fallback to JSONP (bypasses CORS)
    return await jsonpRequest(webhookUrl, { action, ...extra });
  }
}

// Fire-and-forget write (no-cors)
function sheetWrite(webhookUrl, params) {
  if (!webhookUrl) return;
  const qs = new URLSearchParams(params).toString();
  fetch(`${webhookUrl}?${qs}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
}

function writeAppend(webhookUrl, sheetName, rowArr, headers) {
  sheetWrite(webhookUrl, {
    action: 'append',
    sheet: sheetName,
    row: JSON.stringify(rowArr),
    headers: JSON.stringify(headers),
  });
}
function writeUpdate(webhookUrl, sheetName, matchCols, matchValues, rowArr) {
  sheetWrite(webhookUrl, {
    action: 'updateRow',
    sheet: sheetName,
    matchCols: JSON.stringify(matchCols),
    matchValues: JSON.stringify(matchValues),
    row: JSON.stringify(rowArr),
  });
}
function writeDelete(webhookUrl, sheetName, matchCols, matchValues) {
  sheetWrite(webhookUrl, {
    action: 'deleteRow',
    sheet: sheetName,
    matchCols: JSON.stringify(matchCols),
    matchValues: JSON.stringify(matchValues),
  });
}

/* ════════════════════════════════════════════════════════════════════════
   SHARED: latest-reading computation
   ════════════════════════════════════════════════════════════════════════ */
// Returns array of {equipmentId, equipmentName, point, type, date, value, status, source}
function computeLatestReadings(rms, spm, registryMap) {
  const latest = new Map();
  rms.forEach(r => {
    if (r.maxVel === null || !r.date) return;
    const key = `RMS|${r.equipmentId}|${r.point}`;
    const ex = latest.get(key);
    if (!ex || r.date > ex.date) {
      latest.set(key, {
        equipmentId: r.equipmentId,
        equipmentName: r.equipmentName || (registryMap[r.equipmentId] || {}).equipment || '',
        line: (registryMap[r.equipmentId] || {}).line || '',
        point: r.point, type: 'RMS', date: r.date, value: r.maxVel,
        status: rmsStatus(r.maxVel), unit: 'mm/s',
      });
    }
  });
  spm.forEach(r => {
    if (r.hdm === null || !r.date) return;
    const key = `SPM|${r.equipmentId}|${r.point}`;
    const ex = latest.get(key);
    if (!ex || r.date > ex.date) {
      latest.set(key, {
        equipmentId: r.equipmentId,
        equipmentName: r.equipmentName || (registryMap[r.equipmentId] || {}).equipment || '',
        line: (registryMap[r.equipmentId] || {}).line || '',
        point: r.point, type: 'SPM', date: r.date, value: r.hdm,
        status: spmStatus(r.hdm), unit: 'dBsv',
      });
    }
  });
  return Array.from(latest.values());
}

  const latest = useMemo(() => computeLatestReadings(rms, spm, registryMap), [rms, spm, registryMap]);

    const c = { Normal: 0, Caution: 0, Alert: 0 };
    latest.forEach(l => { if (l.status && c[l.status] !== undefined) c[l.status]++; });
    return c;
  }, [latest]);

  const complianceAlertCount = useMemo(() =>
    compliance.filter(c => complianceTier(c.last) === 'Alert').length, [compliance]);

  let rows = latest;
  if (statusFilter) rows = rows.filter(r => r.status === statusFilter);
  if (search.trim()) {
    const q = search.trim().toLowerCase();

      r.equipmentId.toLowerCase().includes(q) ||
      (r.equipmentName || '').toLowerCase().includes(q) ||
      (r.point || '').toLowerCase().includes(q) ||
      (r.line || '').toLowerCase().includes(q)

        </div>

          <div style={{ fontSize: 26, fontWeight: 800, color: S.T.textHighlight }}>{spm.length.toLocaleString()}</div>
        </div>
        <div style={S.metric} onClick={() => setPage('compliance')} title="Go to Compliance Tracker">
          <div style={{ fontSize: 12, color: S.T.textSecondary, marginBottom: 6 }}>Compliance Alerts</div>
          <div style={{ fontSize: 26, fontWeight: 800, color: complianceAlertCount ? S.T.danger : S.T.success, cursor: 'pointer' }}>{complianceAlertCount}</div>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 18 }}>
        {cardDefs.map(c => (
          <div key={c.key} onClick={() => setStatusFilter(statusFilter === c.key ? null : c.key)}
            style={{ ...S.card, cursor: 'pointer', borderColor: statusFilter === c.key ? c.color : S.T.border,
              boxShadow: statusFilter === c.key ? `0 0 0 2px ${c.color}33` : 'none', textAlign: 'center' }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: c.color, marginBottom: 6, letterSpacing: 1 }}>{c.label.toUpperCase()}</div>
            <div style={{ fontSize: 32, fontWeight: 800, color: S.T.textHighlight }}>{counts[c.key]}</div>
            <div style={{ fontSize: 11, color: S.T.textMuted, marginTop: 4 }}>measurement points (latest reading)</div>

              )}

        </div>

    </div>
  );

/* ════════════════════════════════════════════════════════════════════════
   MODAL: Reading form (Add/Edit RMS or SPM)
   ════════════════════════════════════════════════════════════════════════ */
function ReadingFormModal({ type, initial, equipmentOptions, pointOptions, onSave, onCancel }) {
  useTheme();
  const isEdit = !!(initial && initial._id);
  const [equipmentId, setEquipmentId] = useState(initial?.equipmentId || '');
  const [point, setPoint] = useState(initial?.point || '');
  const [date, setDate] = useState(initial?.date || new Date().toISOString().slice(0,10));
  const [axial, setAxial] = useState(initial?.axial ?? '');
  const [gear, setGear] = useState(initial?.gear ?? '');
  const [horizontal, setHorizontal] = useState(initial?.horizontal ?? '');
  const [vertical, setVertical] = useState(initial?.vertical ?? '');
  const [hdm, setHdm] = useState(initial?.hdm ?? '');
  const [hdc, setHdc] = useState(initial?.hdc ?? '');
  const [gs, setGs] = useState(initial?.gs ?? '');

  const equipmentName = (equipmentOptions.find(e => e.equipmentId === equipmentId) || {}).equipment || initial?.equipmentName || '';

  const maxVel = useMemo(() => {
    const vals = [axial, gear, horizontal, vertical].map(v => parseFloat(v)).filter(v => !isNaN(v));
    return vals.length ? Math.max(...vals) : null;
  }, [axial, gear, horizontal, vertical]);

  const valid = equipmentId && point && date && (type === 'RMS'
    ? [axial, gear, horizontal, vertical].some(v => v !== '' && v !== null)
    : (hdm !== '' && hdm !== null));

  const handleSave = () => {
    if (type === 'RMS') {
      onSave({
        _id: initial?._id, _matchCols: initial?._matchCols, _matchValues: initial?._matchValues, _rowNum: initial?._rowNum,
        seq: initial?.seq, equipmentId, equipmentName, point, date,
        axial: axial === '' ? null : parseFloat(axial),
        gear: gear === '' ? null : parseFloat(gear),
        horizontal: horizontal === '' ? null : parseFloat(horizontal),
        vertical: vertical === '' ? null : parseFloat(vertical),
        maxVel,
      });
    } else {
      onSave({
        _id: initial?._id, _matchCols: initial?._matchCols, _matchValues: initial?._matchValues, _rowNum: initial?._rowNum,
        seq: initial?.seq, equipmentId, equipmentName, point, type: 'SPM', date,
        hdm: hdm === '' ? null : parseFloat(hdm),
        hdc: hdc === '' ? null : parseFloat(hdc),
        gs: gs === '' ? null : parseFloat(gs),
      });
    }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }} onClick={onCancel}>
      <div style={{ ...S.card, width: 460, maxHeight: '88vh', overflowY: 'auto' }} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 15, fontWeight: 800, color: S.T.textHighlight, marginBottom: 14 }}>
          {isEdit ? 'Edit' : 'Add'} {type === 'RMS' ? 'RMS' : 'SPM'} Reading
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: S.T.accent, marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.5 }}>Equipment</div>
        <div style={{ marginBottom: 10 }}>
          <label style={S.label}>Equipment ID</label>
          <select style={S.input} value={equipmentId} onChange={e => setEquipmentId(e.target.value)} disabled={isEdit}>
            <option value="">Select equipment…</option>
            {equipmentOptions.map(eq => (
              <option key={eq.equipmentId} value={eq.equipmentId}>{eq.equipmentId} — {eq.equipment}</option>
            ))}
          </select>
        </div>
        <div style={{ marginBottom: 10 }}>
          <label style={S.label}>Equipment Name</label>
          <input style={{ ...S.input, opacity: 0.7 }} value={equipmentName} readOnly />
        </div>
        <div style={{ marginBottom: 14 }}>
          <label style={S.label}>Asset ID / Measurement Point</label>
          <select style={S.input} value={point} onChange={e => setPoint(e.target.value)}>
            <option value="">Select point…</option>
            {pointOptions.map(p => <option key={p} value={p}>{p}</option>)}
            {point && !pointOptions.includes(point) && <option value={point}>{point}</option>}
          </select>
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: S.T.accent, marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.5 }}>Reading</div>
        <div style={{ marginBottom: 10 }}>
          <label style={S.label}>Date</label>
          <input type="date" style={S.input} value={date} onChange={e => setDate(e.target.value)} />
        </div>

        {type === 'RMS' ? (
          <>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
              <div><label style={S.label}>Axial (mm/s)</label><input type="number" step="0.01" style={S.input} value={axial} onChange={e => setAxial(e.target.value)} /></div>
              <div><label style={S.label}>Gear (mm/s)</label><input type="number" step="0.01" style={S.input} value={gear} onChange={e => setGear(e.target.value)} /></div>
              <div><label style={S.label}>Horizontal (mm/s)</label><input type="number" step="0.01" style={S.input} value={horizontal} onChange={e => setHorizontal(e.target.value)} /></div>
              <div><label style={S.label}>Vertical (mm/s)</label><input type="number" step="0.01" style={S.input} value={vertical} onChange={e => setVertical(e.target.value)} /></div>
            </div>
            <div style={{ ...S.cardSub, marginBottom: 14 }}>
              <div style={{ fontSize: 12, color: S.T.textSecondary }}>Max Velocity (auto-calculated)</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: S.T.textHighlight }}>
                {maxVel === null ? '—' : maxVel} mm/s
                {maxVel !== null && <span style={{ marginLeft: 10 }}><StatusPill status={rmsStatus(maxVel)} /></span>}
              </div>
            </div>
          </>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 14 }}>
            <div><label style={S.label}>HDm (dBsv)</label><input type="number" step="0.1" style={S.input} value={hdm} onChange={e => setHdm(e.target.value)} /></div>
            <div><label style={S.label}>HDc (dBsv)</label><input type="number" step="0.1" style={S.input} value={hdc} onChange={e => setHdc(e.target.value)} /></div>
            <div><label style={S.label}>Gs</label><input type="number" step="0.1" style={S.input} value={gs} onChange={e => setGs(e.target.value)} /></div>
          </div>
        )}

        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 6, borderTop: `1px solid ${S.T.border}`, paddingTop: 14 }}>
          <button style={S.btnSecondary} onClick={onCancel}>Cancel</button>
          <button style={{ ...S.btn, opacity: valid ? 1 : 0.5 }} disabled={!valid} onClick={handleSave}>Save</button>
        </div>
      </div>
    </div>
  );
}

function RegistryPage({ registryList, rms, spm, registryMap, mutations, pointOptions }) {
  useTheme();
  const [expanded, setExpanded] = useState(null);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null); // {type:'RMS'|'SPM', initial}
  const [confirmDelete, setConfirmDelete] = useState(null); // {type, row}

  const equipmentOptions = registryList;

  const grouped = useMemo(() => {
    const g = {};
    registryList.forEach(eq => {
      if (search.trim()) {
        const q = search.trim().toLowerCase();
        if (!(eq.equipmentId.toLowerCase().includes(q) || eq.equipment.toLowerCase().includes(q) || eq.line.toLowerCase().includes(q))) return;
      }
      (g[eq.line || 'Other'] = g[eq.line || 'Other'] || []).push(eq);
    });
    return g;
  }, [registryList, search]);

  const latest = useMemo(() => computeLatestReadings(rms, spm, registryMap), [rms, spm, registryMap]);
  const statusByEquip = useMemo(() => {
    const m = {};
    latest.forEach(l => {
      const order = { Alert: 3, Caution: 2, Normal: 1 };
      if (!m[l.equipmentId] || (order[l.status]||0) > (order[m[l.equipmentId]]||0)) m[l.equipmentId] = l.status;
    });
    return m;
  }, [latest]);

  return (
    <div style={{ padding: 24 }}>
      <div style={{ marginBottom: 16, position: 'relative', maxWidth: 320 }}>
        <span style={{ position: 'absolute', left: 10, top: 8, color: S.T.textMuted }}><Icon d={ICONS.search} size={14} /></span>
        <input style={{ ...S.input, paddingLeft: 30 }} placeholder="Search equipment / line / ID…" value={search} onChange={e => setSearch(e.target.value)} />
      </div>

      {Object.keys(grouped).sort().map(line => (
        <div key={line} style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: S.T.accent, marginBottom: 10, letterSpacing: 0.5 }}>{line.toUpperCase()} ({grouped[line].length})</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 12 }}>
            {grouped[line].map(eq => {
              const isOpen = expanded === eq.equipmentId;
              const eqRms = rms.filter(r => r.equipmentId === eq.equipmentId).sort((a,b) => b.date > a.date ? 1 : -1);
              const eqSpm = spm.filter(r => r.equipmentId === eq.equipmentId).sort((a,b) => b.date > a.date ? 1 : -1);
              const points = Array.from(new Set([...eqRms.map(r=>r.point), ...eqSpm.map(r=>r.point)]));
              return (
                <div key={eq.equipmentId} style={{ ...S.card, gridColumn: isOpen ? '1 / -1' : 'auto' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer' }}
                    onClick={() => setExpanded(isOpen ? null : eq.equipmentId)}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight }}>{eq.equipmentId}</div>
                      <div style={{ fontSize: 12, color: S.T.textSecondary, marginTop: 2 }} title={eq.equipment}>{eq.equipment}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {statusByEquip[eq.equipmentId] && <StatusPill status={statusByEquip[eq.equipmentId]} />}
                      <span style={{ color: S.T.textMuted, transform: isOpen ? 'rotate(180deg)' : 'none', transition: '0.15s' }}><Icon d={ICONS.chevDown} size={16} /></span>
                    </div>
                  </div>
                  <div style={{ fontSize: 11, color: S.T.textMuted, marginTop: 6 }}>{points.length} measurement point{points.length===1?'':'s'} · {eqRms.length} RMS · {eqSpm.length} SPM readings</div>

                  {isOpen && (
                    <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${S.T.border}` }}>
                      <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                        <button style={{ ...S.btn, display:'flex', alignItems:'center', gap:6 }}
                          onClick={() => setModal({ type: 'RMS', initial: { equipmentId: eq.equipmentId, equipmentName: eq.equipment } })}>
                          <Icon d={ICONS.plus} size={14}/> Add RMS Reading
                        </button>
                        <button style={{ ...S.btnSecondary, display:'flex', alignItems:'center', gap:6 }}
                          onClick={() => setModal({ type: 'SPM', initial: { equipmentId: eq.equipmentId, equipmentName: eq.equipment } })}>
                          <Icon d={ICONS.plus} size={14}/> Add SPM Reading
                        </button>
                      </div>
                      <MiniTable title="RMS Readings" rows={eqRms} emptyText="No RMS readings for this equipment."
                        columns={[
                          { key: 'point', label: 'Point' },
                          { key: 'date', label: 'Date', render: r => fmtDate(r.date) },
                          { key: 'axial', label: 'Axial' },
                          { key: 'horizontal', label: 'Horiz' },
                          { key: 'vertical', label: 'Vert' },
                          { key: 'gear', label: 'Gear' },
                          { key: 'maxVel', label: 'Max', render: r => <span>{r.maxVel} <StatusPill status={rmsStatus(r.maxVel)} /></span> },
                        ]}
                        onEdit={r => setModal({ type: 'RMS', initial: r })}
                        onDelete={r => setConfirmDelete({ type: 'RMS', row: r })}
                      />
                      <MiniTable title="SPM Readings" rows={eqSpm} emptyText="No SPM readings for this equipment."
                        columns={[
                          { key: 'point', label: 'Point' },
                          { key: 'date', label: 'Date', render: r => fmtDate(r.date) },
                          { key: 'hdm', label: 'HDm', render: r => <span>{r.hdm} <StatusPill status={spmStatus(r.hdm)} /></span> },
                          { key: 'hdc', label: 'HDc' },
                          { key: 'gs', label: 'Gs' },
                        ]}
                        onEdit={r => setModal({ type: 'SPM', initial: r })}
                        onDelete={r => setConfirmDelete({ type: 'SPM', row: r })}
                      />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {modal && (
        <ReadingFormModal
          type={modal.type}
          initial={modal.initial}
          equipmentOptions={equipmentOptions}
          pointOptions={pointOptions}
          onCancel={() => setModal(null)}
          onSave={(data) => {
            if (modal.type === 'RMS') {
              data._id ? mutations.updateRMS(data) : mutations.addRMS(data);
            } else {
              data._id ? mutations.updateSPM(data) : mutations.addSPM(data);
            }
            setModal(null);
          }}
        />
      )}
      {confirmDelete && (
        <ConfirmDeleteModal
          label={`${confirmDelete.row.equipmentId} · ${confirmDelete.row.point} · ${fmtDate(confirmDelete.row.date)}`}
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => {
            confirmDelete.type === 'RMS' ? mutations.deleteRMS(confirmDelete.row) : mutations.deleteSPM(confirmDelete.row);
            setConfirmDelete(null);
          }}
        />
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   LIGHTWEIGHT SVG TREND CHART
   ════════════════════════════════════════════════════════════════════════ */
function TrendChart({ title, series, thresholds = [], unit = '', height = 230 }) {
  useTheme();
  const W = 760, H = height, padL = 44, padR = 16, padT = 18, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const allDates = Array.from(new Set(series.flatMap(s => s.data.map(d => d.x)))).sort();
  const allVals = series.flatMap(s => s.data.map(d => d.y)).filter(v => v !== null && v !== undefined);
  const thrVals = thresholds.map(t => t.value);
  let lo = Math.min(0, ...allVals, ...thrVals);
  let hi = Math.max(1, ...allVals, ...thrVals);
  hi = hi * 1.12;
  if (hi === lo) hi = lo + 1;

  const xScale = (d) => allDates.length <= 1 ? padL + plotW / 2 : padL + (allDates.indexOf(d) / (allDates.length - 1)) * plotW;
  const yScale = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  // x-axis labels: show ~6 evenly spaced
  const labelStep = Math.max(1, Math.ceil(allDates.length / 6));
  const xLabels = allDates.filter((_, i) => i % labelStep === 0 || i === allDates.length - 1);

  if (allDates.length === 0) {
    return (
      <div style={S.cardSub}>
        <div style={{ fontSize: 12.5, fontWeight: 700, color: S.T.textPrimary, marginBottom: 6 }}>{title}</div>
        <div style={{ padding: 30, textAlign: 'center', color: S.T.textMuted, fontSize: 12.5 }}>No data for this point.</div>
      </div>
    );
  }

  return (
    <div style={S.cardSub}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4, flexWrap: 'wrap', gap: 8 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, color: S.T.textPrimary }}>{title}</div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          {series.map(s => (
            <span key={s.name} style={{ fontSize: 11, color: S.T.textSecondary, display: 'flex', alignItems: 'center', gap: 4 }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: s.color, display: 'inline-block' }} /> {s.name}
            </span>
          ))}
          {thresholds.map(t => (
            <span key={t.label} style={{ fontSize: 11, color: S.T.textMuted, display: 'flex', alignItems: 'center', gap: 4 }}>
              <span style={{ width: 10, height: 2, background: t.color, display: 'inline-block' }} /> {t.label}
            </span>
          ))}
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ display: 'block' }}>
        {/* y gridlines + labels */}
        {[0, 0.25, 0.5, 0.75, 1].map(f => {
          const v = lo + f * (hi - lo);
          const y = yScale(v);
          return (
            <g key={f}>
              <line x1={padL} x2={W - padR} y1={y} y2={y} stroke={S.T.border2} strokeWidth="1" />
              <text x={padL - 6} y={y + 3} fontSize="10" fill={S.T.textMuted} textAnchor="end">{v.toFixed(1)}</text>
            </g>
          );
        })}
        {/* threshold lines */}
        {thresholds.map(t => (
          <line key={t.label} x1={padL} x2={W - padR} y1={yScale(t.value)} y2={yScale(t.value)} stroke={t.color} strokeWidth="1.5" strokeDasharray="5,4" />
        ))}
        {/* x labels */}
        {xLabels.map(d => (
          <text key={d} x={xScale(d)} y={H - 8} fontSize="10" fill={S.T.textMuted} textAnchor="middle">{fmtDate(d)}</text>
        ))}
        {/* series lines + points */}
        {series.map(s => {
          const pts = s.data.filter(d => d.y !== null && d.y !== undefined);
          const path = pts.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xScale(d.x)} ${yScale(d.y)}`).join(' ');
          return (
            <g key={s.name}>
              <path d={path} fill="none" stroke={s.color} strokeWidth="2" />
              {pts.map((d, i) => (
                <circle key={i} cx={xScale(d.x)} cy={yScale(d.y)} r="2.5" fill={s.color}>
                  <title>{`${fmtDate(d.x)}: ${d.y} ${unit}`}</title>
                </circle>
              ))}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function GraphsPage({ registryList, rms, spm, graphAsset, setGraphAsset }) {

  const [dateTo, setDateTo] = useState('');

  const eqMeta = registryList.find(e => e.equipmentId === equipmentId);

  let eqRms = rms.filter(r => r.equipmentId === equipmentId);
  let eqSpm = spm.filter(r => r.equipmentId === equipmentId);
  if (dateFrom) { eqRms = eqRms.filter(r => r.date >= dateFrom); eqSpm = eqSpm.filter(r => r.date >= dateFrom); }
  if (dateTo) { eqRms = eqRms.filter(r => r.date <= dateTo); eqSpm = eqSpm.filter(r => r.date <= dateTo); }

  const rmsPoints = Array.from(new Set(eqRms.map(r => r.point))).sort();
  const spmPoints = Array.from(new Set(eqSpm.map(r => r.point))).sort();

  const rmsThresholds = [
    { value: THRESHOLDS.rms.caution, color: S.T.warning, label: `Caution ${THRESHOLDS.rms.caution}` },
    { value: THRESHOLDS.rms.alert, color: S.T.danger, label: `Alert ${THRESHOLDS.rms.alert}` },
  ];
  const spmThresholds = [
    { value: THRESHOLDS.spmHdm.caution, color: S.T.warning, label: `Caution ${THRESHOLDS.spmHdm.caution}` },
    { value: THRESHOLDS.spmHdm.alert, color: S.T.danger, label: `Alert ${THRESHOLDS.spmHdm.alert}` },
  ];

  return (
    <div style={{ padding: 24 }}>
      <div style={{ ...S.card, marginBottom: 18, display: 'flex', gap: 16, alignItems: 'flex-end', flexWrap: 'wrap' }}>
        <div style={{ minWidth: 280, flex: 1 }}>
          <label style={S.label}>Equipment ID</label>
          <select style={S.input} value={equipmentId || ''} onChange={e => setGraphAsset(e.target.value)}>
            <option value="">Select equipment…</option>
            {registryList.map(eq => <option key={eq.equipmentId} value={eq.equipmentId}>{eq.equipmentId} — {eq.equipment} ({eq.line})</option>)}

        <div>
          <label style={S.label}>From</label>
          <input type="date" style={S.input} value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
        </div>
        <div>
          <label style={S.label}>To</label>
          <input type="date" style={S.input} value={dateTo} onChange={e => setDateTo(e.target.value)} />
        </div>
        {(dateFrom || dateTo) && <button style={S.btnSecondary} onClick={() => { setDateFrom(''); setDateTo(''); }}>Clear dates</button>}
      </div>

      {!equipmentId && (
        <div style={{ ...S.card, textAlign: 'center', color: S.T.textMuted, padding: 50 }}>

        </div>

      {equipmentId && (
        <>
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: S.T.textHighlight }}>{equipmentId}{eqMeta ? ` — ${eqMeta.equipment}` : ''}</div>
            <div style={{ fontSize: 12, color: S.T.textSecondary }}>{eqMeta?.line} · {rmsPoints.length} RMS point(s), {spmPoints.length} SPM point(s)</div>

          {rmsPoints.length > 0 && (
            <div style={{ marginBottom: 22 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: S.T.accent, marginBottom: 10 }}>RMS — Max Velocity (mm/s)</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))', gap: 14 }}>
                {rmsPoints.map(point => {
                  const data = eqRms.filter(r => r.point === point).sort((a,b) => a.date < b.date ? -1 : 1);
                  return (
                    <TrendChart key={point} title={point} unit="mm/s"
                      series={[{ name: 'Max Velocity', color: S.T.accent, data: data.map(d => ({ x: d.date, y: d.maxVel })) }]}
                      thresholds={rmsThresholds}
                    />
                  );
                })}
              </div>
            </div>
          )}

          {spmPoints.length > 0 && (
            <div style={{ marginBottom: 22 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: S.T.accent, marginBottom: 10 }}>SPM — HDm / HDc (dBsv)</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))', gap: 14 }}>

                  return (
                    <TrendChart key={point} title={point} unit="dBsv"
                      series={[
                        { name: 'HDm', color: S.T.accent, data: data.map(d => ({ x: d.date, y: d.hdm })) },
                        { name: 'HDc', color: S.T.info === S.T.accent ? S.T.success : S.T.info, data: data.map(d => ({ x: d.date, y: d.hdc })) },

                      thresholds={spmThresholds}

                  );

          )}

            <div style={{ ...S.card, textAlign: 'center', color: S.T.textMuted, padding: 50 }}>No readings found for this equipment in the selected date range.</div>

      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   COMPLIANCE TRACKER PAGE (read-only)
   ════════════════════════════════════════════════════════════════════════ */
function compliancePct(months, n) {
  const recent = months.slice(-n);
  if (recent.length === 0) return null;
  const ok = recent.filter(m => complianceTier(m.status) === 'Normal').length;
  return Math.round((ok / recent.length) * 100);
}

function CompliancePage({ compliance }) {
  useTheme();
  const [lineFilter, setLineFilter] = useState('');
  const [statusFilter, setStatusFilter] = useState(null);
  const [search, setSearch] = useState('');
  const [expanded, setExpanded] = useState(null);

  const lines = useMemo(() => Array.from(new Set(compliance.map(c => c.line))).filter(Boolean).sort(), [compliance]);

  const counts = useMemo(() => {
    const c = { Normal: 0, Caution: 0, Alert: 0 };
    compliance.forEach(r => { const t = complianceTier(r.last); if (c[t] !== undefined) c[t]++; });
    return c;
  }, [compliance]);

  let rows = compliance;
  if (lineFilter) rows = rows.filter(r => r.line === lineFilter);
  if (statusFilter) rows = rows.filter(r => complianceTier(r.last) === statusFilter);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    rows = rows.filter(r => r.equipmentId.toLowerCase().includes(q) || r.equipment.toLowerCase().includes(q));
  }

  const cardDefs = [
    { key: 'Normal', label: 'Submitted (Latest)', color: S.T.success },
    { key: 'Caution', label: 'Partial / Under Observation', color: S.T.warning },
    { key: 'Alert', label: 'Missing / Not Submitted', color: S.T.danger },

  return (
    <div style={{ padding: 24 }}>
      <div style={{ ...S.card, marginBottom: 18, fontSize: 12.5, color: S.T.textSecondary, lineHeight: 1.6 }}>
        <b style={{ color: S.T.textHighlight }}>Legend:</b>{' '}
        <StatusPill status="Normal" /> = Submitted (YES) &nbsp;
        <StatusPill status="Caution" /> = Partial / Comment / Under Observation &nbsp;

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 18 }}>
        {cardDefs.map(c => (
          <div key={c.key} onClick={() => setStatusFilter(statusFilter === c.key ? null : c.key)}

            <div style={{ fontSize: 11, fontWeight: 700, color: c.color, marginBottom: 6, letterSpacing: 1 }}>{c.label.toUpperCase()}</div>
            <div style={{ fontSize: 32, fontWeight: 800, color: S.T.textHighlight }}>{counts[c.key]}</div>
            <div style={{ fontSize: 11, color: S.T.textMuted, marginTop: 4 }}>of {compliance.length} equipment</div>

          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: 10, top: 8, color: S.T.textMuted }}><Icon d={ICONS.search} size={14} /></span>
            <input style={{ ...S.input, paddingLeft: 30, width: 200 }} placeholder="Search equipment / ID…" value={search} onChange={e => setSearch(e.target.value)} />

        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12.5 }}>
            <thead>
              <tr style={{ background: S.T.tableHead }}>

                              return (
                                <div key={m.month} title={`${m.month}: ${m.status}`}
                                  style={{ width: 26, height: 26, borderRadius: 4, background: color + '33', border: `1px solid ${color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, color, fontWeight: 700 }}>
                                  {m.month.slice(5)}
                                </div>
                              );
                            })}
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {rows.length === 0 && <tr><td colSpan={6} style={{ padding: 20, textAlign: 'center', color: S.T.textMuted }}>No equipment found.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   EMBEDDED APPS SCRIPT SOURCE (Settings > copy into Apps Script editor)
   ════════════════════════════════════════════════════════════════════════ */
const APPS_SCRIPT_CODE = `/**
 * Arabian Cement — Vibration & Condition Monitoring
 * Apps Script Web App (database backend for the dashboard)
 *
 * Deploy: Extensions > Apps Script > paste this file (replace Code.gs) >
 *         Deploy > New deployment > Web app > Execute as: Me > Who has access: Anyone
 *         Copy the /exec URL into the app's Settings > Apps Script Webhook URL.
 *
 * After ANY change to this script: Deploy > Manage deployments > edit (pencil) >
 *         Version: New version > Deploy. The URL stays the same.
 */

// ─── Sheet tab names ─────────────────────────────────────────────────────────
var SHEET_RMS = '📥 RMS DATA';
var SHEET_SPM = '📥 SPM DATA';
var SHEET_COMPLIANCE = '📋 Compliance Tracker';

// ─── Header row + data start row for each tab (1-based) ───────────────────────
var SHEET_CONFIG = {};
SHEET_CONFIG[SHEET_RMS]        = { headerRow: 3, dataStartRow: 4 };
SHEET_CONFIG[SHEET_SPM]        = { headerRow: 3, dataStartRow: 4 };
SHEET_CONFIG[SHEET_COMPLIANCE] = { headerRow: 3, dataStartRow: 4 };

function dataStartRowFor(sheetName) {
  var cfg = SHEET_CONFIG[sheetName];
  return cfg ? cfg.dataStartRow : 1;
}
function headerRowFor(sheetName) {
  var cfg = SHEET_CONFIG[sheetName];
  return cfg ? cfg.headerRow : 1;
}

// ─── Entry points ───────────────────────────────────────────────────────────
function doGet(e) {
  try {
    var action = (e.parameter.action || 'readAll');
    var result;
    if (action === 'readAll') {
      result = readAll();
    } else if (action === 'test') {
      result = { status: 'ok', time: new Date().toISOString() };
    } else if (action === 'append') {
      result = handleAppend(e.parameter);
    } else if (action === 'updateRow') {
      result = handleUpdateRow(e.parameter);
    } else if (action === 'deleteRow') {
      result = handleDeleteRow(e.parameter);
    } else {
      result = { error: 'Unknown action: ' + action };
    }
    return jsonOut(e, result);
  } catch (err) {
    return jsonOut(e, { error: String(err) });
  }
}

function doPost(e) {
  try {
    var body = {};
    if (e.postData && e.postData.contents) {
      try { body = JSON.parse(e.postData.contents); } catch (err2) { body = e.parameter; }
    } else {
      body = e.parameter;
    }
    var action = body.action || 'readAll';
    var result;
    if (action === 'append') {
      result = handleAppend(body);
    } else if (action === 'updateRow') {
      result = handleUpdateRow(body);
    } else if (action === 'deleteRow') {
      result = handleDeleteRow(body);
    } else if (action === 'readAll') {
      result = readAll();
    } else if (action === 'test') {
      result = { status: 'ok', time: new Date().toISOString() };
    } else {
      result = { error: 'Unknown action: ' + action };
    }
    return jsonOut(e, result);
  } catch (err) {
    return jsonOut(e, { error: String(err) });
  }
}

// JSONP-aware JSON output
function jsonOut(e, obj) {
  var json = JSON.stringify(obj);
  var cb = e && e.parameter && e.parameter.callback;
  if (cb) {
    return ContentService.createTextOutput(cb + '(' + json + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(json)
    .setMimeType(ContentService.MimeType.JSON);
}

// ─── readAll ────────────────────────────────────────────────────────────────
function readAll() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  return {
    rms: readSheet(ss, SHEET_RMS),
    spm: readSheet(ss, SHEET_SPM),
    compliance: readCompliance(ss)
  };
}

// Generic reader: returns array of row objects keyed by header name,
// plus _rowNum (1-based sheet row), _id, _matchCols, _matchValues
function readSheet(ss, sheetName) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var cfg = SHEET_CONFIG[sheetName];
  var headerRow = cfg.headerRow;
  var dataStart = cfg.dataStartRow;
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  if (lastRow < dataStart) return [];

  var headers = sheet.getRange(headerRow, 1, 1, lastCol).getValues()[0];
  var numRows = lastRow - dataStart + 1;
  var data = sheet.getRange(dataStart, 1, numRows, lastCol).getValues();

  var out = [];
  for (var i = 0; i < data.length; i++) {
    var row = data[i];
    // skip fully blank rows
    var hasData = false;
    for (var c = 0; c < row.length; c++) {
      if (row[c] !== '' && row[c] !== null) { hasData = true; break; }
    }
    if (!hasData) continue;

    var obj = {};
    for (var h = 0; h < headers.length; h++) {
      var key = headers[h];
      if (!key) continue;
      var val = row[h];
      if (val instanceof Date) {
        val = Utilities.formatDate(val, Session.getScriptTimeZone() || 'UTC', "yyyy-MM-dd'T'HH:mm:ss");
      }
      obj[key] = val;
    }
    obj._rowNum = dataStart + i;
    obj._rawRow = row;
    out.push(obj);
  }
  return out;
}

// Compliance tracker: wide sheet (LINE, Equipment, Asset ID, Last, then 48 monthly cols)
function readCompliance(ss) {
  var sheetName = SHEET_COMPLIANCE;
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var cfg = SHEET_CONFIG[sheetName];
  var headerRow = cfg.headerRow;
  var dataStart = cfg.dataStartRow;
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  if (lastRow < dataStart) return [];

  var headers = sheet.getRange(headerRow, 1, 1, lastCol).getValues()[0];
  var numRows = lastRow - dataStart + 1;
  var data = sheet.getRange(dataStart, 1, numRows, lastCol).getValues();

  var out = [];
  for (var i = 0; i < data.length; i++) {
    var row = data[i];
    if (!row[2]) continue; // need Asset ID (Equipment ID) in col C
    var obj = { line: row[0], equipment: row[1], equipmentId: row[2], last: row[3], months: [] };
    for (var h = 4; h < headers.length; h++) {
      var label = headers[h];
      if (!label) continue;
      var val = row[h];
      if (val === '' || val === null || val === undefined) continue;
      var monthStr;
      if (label instanceof Date) {
        monthStr = Utilities.formatDate(label, Session.getScriptTimeZone() || 'UTC', 'yyyy-MM');
      } else {
        monthStr = String(label);
      }
      obj.months.push({ month: monthStr, status: String(val) });
    }
    obj._rowNum = dataStart + i;
    out.push(obj);
  }
  return out;
}

// ─── append ─────────────────────────────────────────────────────────────────
// params: { action:'append', sheet, row: JSON-array-string, headers: JSON-array-string (optional) }
function handleAppend(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetName = params.sheet;
  var row = JSON.parse(params.row);
  var headers = params.headers ? JSON.parse(params.headers) : null;

  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
    if (headers) {
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
    }
  }
  sheet.appendRow(row);
  return { status: 'ok', action: 'append', sheet: sheetName, rowNum: sheet.getLastRow() };
}

// ─── updateRow ──────────────────────────────────────────────────────────────
// params: { action:'updateRow', sheet, matchCols: JSON [0,2], matchValues: JSON [...], row: JSON [...] }
function handleUpdateRow(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetName = params.sheet;
  var matchCols = JSON.parse(params.matchCols);
  var matchValues = JSON.parse(params.matchValues);
  var row = JSON.parse(params.row);

  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return { status: 'error', error: 'Sheet not found: ' + sheetName };

  var dataStart = dataStartRowFor(sheetName);
  var rowIndex = findRowIndex(sheet, matchCols, matchValues, dataStart);
  if (rowIndex === -1) return { status: 'error', error: 'Row not found' };

  sheet.getRange(rowIndex, 1, 1, row.length).setValues([row]);
  return { status: 'ok', action: 'updateRow', sheet: sheetName, rowNum: rowIndex };
}

// ─── deleteRow ──────────────────────────────────────────────────────────────
// params: { action:'deleteRow', sheet, matchCols: JSON [0,2], matchValues: JSON [...] }
function handleDeleteRow(params) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetName = params.sheet;
  var matchCols = JSON.parse(params.matchCols);
  var matchValues = JSON.parse(params.matchValues);

  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return { status: 'error', error: 'Sheet not found: ' + sheetName };

  var dataStart = dataStartRowFor(sheetName);
  var rowIndex = findRowIndex(sheet, matchCols, matchValues, dataStart);
  if (rowIndex === -1) return { status: 'error', error: 'Row not found' };

  sheet.deleteRow(rowIndex);
  return { status: 'ok', action: 'deleteRow', sheet: sheetName, rowNum: rowIndex };
}

// ─── generic row matcher ────────────────────────────────────────────────────
// Returns 1-based sheet row index, or -1 if not found.
function findRowIndex(sheet, matchCols, matchValues, dataStartRow) {
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  if (lastRow < dataStartRow) return -1;
  var numRows = lastRow - dataStartRow + 1;
  var data = sheet.getRange(dataStartRow, 1, numRows, lastCol).getValues();

  for (var i = 0; i < data.length; i++) {
    var row = data[i];
    var match = true;
    for (var c = 0; c < matchCols.length; c++) {
      var col = matchCols[c];
      var expected = matchValues[c];
      var actual = row[col];
      if (actual instanceof Date) {
        actual = Utilities.formatDate(actual, Session.getScriptTimeZone() || 'UTC', "yyyy-MM-dd'T'HH:mm:ss");
      }
      if (String(actual) !== String(expected)) { match = false; break; }
    }
    if (match) return dataStartRow + i;
  }
  return -1;
}
`;

/* ════════════════════════════════════════════════════════════════════════
   SETTINGS PAGE
   ════════════════════════════════════════════════════════════════════════ */
function SettingsPage({ sheetUrl, setSheetUrl, webhookUrl, setWebhookUrl, themeName, onSync }) {
  useTheme();
  const [diag, setDiag] = useState(null); // array of {label, ok, detail}
  const [running, setRunning] = useState(false);
  const [copied, setCopied] = useState(false);

  const runDiagnostics = async () => {
    setRunning(true);
    const steps = [];
    if (!webhookUrl) {
      steps.push({ label: 'Webhook URL configured', ok: false, detail: 'No webhook URL set.' });
      setDiag(steps); setRunning(false); return;
    }
    steps.push({ label: 'Webhook URL configured', ok: true, detail: webhookUrl });
    setDiag([...steps]);

    try {
      const t0 = Date.now();
      const testResult = await sheetRead(webhookUrl, 'test');
      const ms = Date.now() - t0;
      const ok = testResult && testResult.status === 'ok';
      steps.push({ label: 'Connection test (action=test)', ok, detail: ok ? `OK — responded in ${ms}ms — server time ${testResult.time}` : `Unexpected response: ${JSON.stringify(testResult)}` });
    } catch (err) {
      steps.push({ label: 'Connection test (action=test)', ok: false, detail: String(err.message || err) });
      setDiag([...steps]); setRunning(false); return;
    }
    setDiag([...steps]);

    try {
      const data = await sheetRead(webhookUrl, 'readAll');
      if (data && data.error) {
        steps.push({ label: 'readAll — JSON validity', ok: false, detail: `Server error: ${data.error}` });
      } else {
        steps.push({ label: 'readAll — JSON validity', ok: true, detail: 'Valid JSON received.' });
        steps.push({ label: '📥 RMS DATA rows', ok: Array.isArray(data.rms) && data.rms.length > 0, detail: `${(data.rms||[]).length} rows` });
        steps.push({ label: '📥 SPM DATA rows', ok: Array.isArray(data.spm) && data.spm.length > 0, detail: `${(data.spm||[]).length} rows` });
        steps.push({ label: '📋 Compliance Tracker rows', ok: Array.isArray(data.compliance) && data.compliance.length > 0, detail: `${(data.compliance||[]).length} equipment` });
      }
    } catch (err) {
      steps.push({ label: 'readAll — JSON validity', ok: false, detail: String(err.message || err) });
    }
    setDiag([...steps]);
    setRunning(false);
  };

  const handleCopy = () => {
    try {
      navigator.clipboard.writeText(APPS_SCRIPT_CODE);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {}
  };

  return (
    <div style={{ padding: 24, maxWidth: 900 }}>
      <div style={{ ...S.card, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight, marginBottom: 14 }}>Connection</div>
        <div style={{ marginBottom: 12 }}>
          <label style={S.label}>Google Sheet URL</label>
          <input style={S.input} placeholder="https://docs.google.com/spreadsheets/d/..." value={sheetUrl} onChange={e => setSheetUrl(e.target.value)} />
        </div>
        <div style={{ marginBottom: 12 }}>
          <label style={S.label}>Apps Script Webhook URL</label>
          <input style={S.input} placeholder="https://script.google.com/macros/s/.../exec" value={webhookUrl} onChange={e => setWebhookUrl(e.target.value)} />
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <button style={S.btn} onClick={runDiagnostics} disabled={running}>{running ? 'Testing…' : 'Test Connection'}</button>
          <button style={S.btnSecondary} onClick={onSync}>Sync Now</button>
        </div>

        {diag && (
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: S.T.textSecondary, marginBottom: 8 }}>Diagnostics</div>
            {diag.map((s, i) => (
              <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', padding: '6px 0', borderBottom: i < diag.length - 1 ? `1px solid ${S.T.border2}` : 'none' }}>
                <span style={{ width: 16, height: 16, borderRadius: '50%', flexShrink: 0, marginTop: 1,
                  background: s.ok ? S.T.successBg : S.T.dangerBg, color: s.ok ? S.T.success : S.T.danger,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 800 }}>
                  {s.ok ? '✓' : '✕'}
                </span>
                <div>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: S.T.textPrimary }}>{s.label}</div>
                  <div style={{ fontSize: 11.5, color: S.T.textMuted, wordBreak: 'break-all' }}>{s.detail}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ ...S.card, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight, marginBottom: 14 }}>Theme</div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          {Object.keys(THEMES).map(name => {
            const t = THEMES[name];
            const active = name === themeName;
            return (
              <div key={name} onClick={() => setGlobalTheme(name)}
                style={{ cursor: 'pointer', border: `2px solid ${active ? t.accent : S.T.border}`, borderRadius: 10, padding: 10, width: 130, background: t.cardBg }}>
                <div style={{ display: 'flex', gap: 4, marginBottom: 8 }}>
                  <span style={{ width: 16, height: 16, borderRadius: 4, background: t.appBg, border: `1px solid ${t.border}` }} />
                  <span style={{ width: 16, height: 16, borderRadius: 4, background: t.accent }} />
                  <span style={{ width: 16, height: 16, borderRadius: 4, background: t.success }} />
                  <span style={{ width: 16, height: 16, borderRadius: 4, background: t.danger }} />
                </div>
                <div style={{ fontSize: 12, fontWeight: 700, color: t.textPrimary }}>{name}</div>
                {active && <div style={{ fontSize: 10, color: t.accent, marginTop: 2 }}>Active</div>}
              </div>
            );
          })}
        </div>
      </div>

      <div style={S.card}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <div style={{ fontSize: 14, fontWeight: 800, color: S.T.textHighlight }}>Apps Script — Database Backend</div>
          <button style={S.btnSecondary} onClick={handleCopy}>{copied ? 'Copied!' : 'Copy code'}</button>
        </div>
        <div style={{ fontSize: 12, color: S.T.textSecondary, marginBottom: 10, lineHeight: 1.6 }}>
          Setup: open your Google Sheet → <b>Extensions → Apps Script</b> → replace the contents of <code>Code.gs</code> with the
          code below → <b>Deploy → New deployment → type: Web app → Execute as: Me → Who has access: Anyone</b> → copy the
          <code> /exec</code> URL into the Webhook URL field above.<br/>
          After any change to this script: <b>Deploy → Manage deployments → edit (pencil) → Version: New version → Deploy</b> (the URL stays the same).
        </div>
        <pre style={{ background: S.T.codeBg, color: S.T.codeText, padding: 14, borderRadius: 8, fontSize: 11.5, lineHeight: 1.5, overflow: 'auto', maxHeight: 420, border: `1px solid ${S.T.border2}` }}>
{APPS_SCRIPT_CODE}
        </pre>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   APP ROOT
   ════════════════════════════════════════════════════════════════════════ */
const PAGE_TITLES = {
  dashboard: 'Dashboard',
  registry: 'Equipment Registry',
  graphs: 'Graphs Dashboard',
  compliance: 'Compliance Tracker',
  settings: 'Settings',
};

function App() {
  const themeName = useTheme();
  const [page, setPage] = useState('dashboard');
  const [graphAsset, setGraphAsset] = useState('');

  const [sheetUrl, setSheetUrl] = useState('');
  const [webhookUrl, setWebhookUrl] = useState('');

  const [rms, setRms] = useState([]);
  const [spm, setSpm] = useState([]);
  const [compliance, setCompliance] = useState([]);
  const [syncState, setSyncState] = useState({ status: 'idle', message: 'Not synced yet' });

  // Load settings from localStorage on mount
  useEffect(() => {
    try {
      const su = localStorage.getItem('vib_sheetUrl'); if (su) setSheetUrl(su);
      const wu = localStorage.getItem('vib_webhookUrl'); if (wu) setWebhookUrl(wu);
      const th = localStorage.getItem('vib_theme'); if (th && THEMES[th]) setGlobalTheme(th);
    } catch (e) {}
  }, []);
  useEffect(() => { try { localStorage.setItem('vib_sheetUrl', sheetUrl); } catch(e){} }, [sheetUrl]);
  useEffect(() => { try { localStorage.setItem('vib_webhookUrl', webhookUrl); } catch(e){} }, [webhookUrl]);

  const doSync = useCallback(async () => {
    if (!webhookUrl) {
      setSyncState({ status: 'error', message: 'No webhook URL — go to Settings' });
      return;
    }
    setSyncState({ status: 'loading', message: 'Syncing…' });
    try {
      const data = await sheetRead(webhookUrl, 'readAll');
      if (data.error) throw new Error(data.error);
      const rmsArr = (data.rms || []).map(rowToRMS);
      const spmArr = (data.spm || []).map(rowToSPM);
      const cmpArr = (data.compliance || []).map(rowToCompliance);
      setRms(rmsArr);
      setSpm(spmArr);
      setCompliance(cmpArr);
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      setSyncState({ status: 'ok', message: `✓ Synced — ${rmsArr.length} RMS · ${spmArr.length} SPM · ${cmpArr.length} equip — ${time}` });
    } catch (err) {
      setSyncState({ status: 'error', message: `✕ Sync failed: ${String(err.message || err)}` });
    }
  }, [webhookUrl]);

  // Auto-sync on load if webhook configured
  useEffect(() => {
    if (webhookUrl) doSync();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [webhookUrl]);

  // ── Registry derived from Compliance Tracker ────────────────────────────
  const registryList = useMemo(() =>
    compliance.map(c => ({ equipmentId: c.equipmentId, equipment: c.equipment, line: c.line }))
      .sort((a,b) => a.line === b.line ? a.equipmentId.localeCompare(b.equipmentId) : a.line.localeCompare(b.line)),
    [compliance]);

  const registryMap = useMemo(() => {
    const m = {};
    registryList.forEach(eq => { m[eq.equipmentId] = eq; });
    return m;
  }, [registryList]);

  const pointOptions = useMemo(() => {
    const set = new Set();
    rms.forEach(r => r.point && set.add(r.point));
    spm.forEach(r => r.point && set.add(r.point));
    return Array.from(set).sort();
  }, [rms, spm]);

  const dashCounts = useMemo(() => {
    const alertEquip = compliance.filter(c => complianceTier(c.last) === 'Alert').length;
    return { alertEquip };
  }, [compliance]);

  // ── Mutations ────────────────────────────────────────────────────────────
  const nextSeq = (arr) => {
    let max = 0;
    arr.forEach(r => { const n = parseInt(r.seq, 10); if (!isNaN(n) && n > max) max = n; });
    return max + 1;
  };

  const mutations = useMemo(() => ({
    addRMS: (data) => {
      const seq = nextSeq(rms);
      const rec = { ...data, seq, _id: `RMS|${data.equipmentId}|${data.point}|${data.date}` };
      setRms(prev => [...prev, rec]);
      writeAppend(webhookUrl, SHEET_RMS, rmsToRow(rec), RMS_HEADERS);
    },
    updateRMS: (data) => {
      const rec = { ...data, _id: `RMS|${data.equipmentId}|${data.point}|${data.date}` };
      setRms(prev => prev.map(r => r._id === data._id ? rec : r));
      writeUpdate(webhookUrl, SHEET_RMS, data._matchCols, data._matchValues, rmsToRow(rec));
    },
    deleteRMS: (row) => {
      setRms(prev => prev.filter(r => r._id !== row._id));
      writeDelete(webhookUrl, SHEET_RMS, row._matchCols, row._matchValues);
    },
    addSPM: (data) => {
      const seq = nextSeq(spm);
      const rec = { ...data, seq, type: 'SPM', _id: `SPM|${data.equipmentId}|${data.point}|${data.date}` };
      setSpm(prev => [...prev, rec]);
      writeAppend(webhookUrl, SHEET_SPM, spmToRow(rec), SPM_HEADERS);
    },
    updateSPM: (data) => {
      const rec = { ...data, _id: `SPM|${data.equipmentId}|${data.point}|${data.date}` };
      setSpm(prev => prev.map(r => r._id === data._id ? rec : r));
      writeUpdate(webhookUrl, SHEET_SPM, data._matchCols, data._matchValues, spmToRow(rec));
    },
    deleteSPM: (row) => {
      setSpm(prev => prev.filter(r => r._id !== row._id));
      writeDelete(webhookUrl, SHEET_SPM, row._matchCols, row._matchValues);
    },
  }), [rms, spm, webhookUrl]);

  let content;
  if (page === 'dashboard') content = <DashboardPage rms={rms} spm={spm} compliance={compliance} registryMap={registryMap} setPage={setPage} setGraphAsset={setGraphAsset} />;
  else if (page === 'registry') content = <RegistryPage registryList={registryList} rms={rms} spm={spm} registryMap={registryMap} mutations={mutations} pointOptions={pointOptions} />;
  else if (page === 'graphs') content = <GraphsPage registryList={registryList} rms={rms} spm={spm} graphAsset={graphAsset} setGraphAsset={setGraphAsset} />;
  else if (page === 'compliance') content = <CompliancePage compliance={compliance} />;
  else if (page === 'settings') content = <SettingsPage sheetUrl={sheetUrl} setSheetUrl={setSheetUrl} webhookUrl={webhookUrl} setWebhookUrl={setWebhookUrl} themeName={themeName} onSync={doSync} />;

  return (
    <div style={S.page}>
      <Sidebar page={page} setPage={setPage} syncState={syncState} onSync={doSync} counts={dashCounts} />
      <div style={{ marginLeft: 230 }}>
        <Topbar title={PAGE_TITLES[page]} sheetUrl={sheetUrl} onSync={doSync} syncState={syncState} />
        {content}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
