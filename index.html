function normalizePoint(p) {
  if (p===null||p===undefined) return '';
  let s=String(p).replace(/\s+/g,' ').trim();
  s=s.replace(/\bouboard\b/gi,'Outboard').replace(/\boutbord\b/gi,'Outboard')
     .replace(/\binboard\b/gi,'Inboard').replace(/\boutboard\b/gi,'Outboard')
     .replace(/\s+/g,' ').trim();
  return s;
}
function fmtDate(val) {
  if(val===null||val===undefined||val==='') return '';
  let d=null;
  if(val instanceof Date){d=val;}
  else if(typeof val==='number'){d=new Date(Math.round((val-25569)*86400*1000));}
  else if(typeof val==='string'){
    const s=val.trim();
    if(/^\d+(\.\d+)?$/.test(s)) d=new Date(Math.round((parseFloat(s)-25569)*86400*1000));
    else d=new Date(s);
  }
  if(!d||isNaN(d.getTime())) return String(val);
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getUTCDate()).padStart(2,'0')} ${mo[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
function isoDate(val) {
  if(val===null||val===undefined||val==='') return '';
  let d=null;
  if(val instanceof Date){d=val;}
  else if(typeof val==='number'){d=new Date(Math.round((val-25569)*86400*1000));}
  else if(typeof val==='string'){
    const s=val.trim();
    if(/^\d+(\.\d+)?$/.test(s)) d=new Date(Math.round((parseFloat(s)-25569)*86400*1000));
    else d=new Date(s);
  }
  if(!d||isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,10);
}
function monthKey(dateStr) {
  // Returns yyyy-MM from an iso date string
  if(!dateStr) return '';
  return String(dateStr).slice(0,7);
}
function num(v) {
  if(v===''||v===null||v===undefined) return null;
  const n=parseFloat(v); return isNaN(n)?null:n;
}
function mergeById(sheetArr,localArr) {
  const map=new Map();
  (sheetArr||[]).forEach(r=>map.set(r._id,r));
  (localArr||[]).forEach(r=>map.set(r._id,r));
  return Array.from(map.values());
}

const DEFAULT_THRESHOLDS = { rms:{good:2.8,acceptable:7.1,alarm:18}, spm:{normal:20,caution:35} };
const STATUS_SEVERITY = {Good:1,Normal:1,Acceptable:2,Caution:2,Alarm:3,Danger:4};
function worstOfTwo(a,b){ return (STATUS_SEVERITY[a]||0)>=(STATUS_SEVERITY[b]||0)?a:b; }

function getThresholds(thresholdsMap,equipmentId,rmsRegMap,spmRegMap){
  const rmsReg=rmsRegMap&&rmsRegMap[equipmentId];
  const spmReg=spmRegMap&&spmRegMap[equipmentId];
  const local=(thresholdsMap&&thresholdsMap[equipmentId])||{};
  return {
    rms:rmsReg?{good:rmsReg.rmsGood,acceptable:rmsReg.rmsAcceptable,alarm:rmsReg.rmsAlarm}:{...DEFAULT_THRESHOLDS.rms,...(local.rms||{})},
    spm:spmReg?{normal:spmReg.spmNormal,caution:spmReg.spmCaution,alarm:spmReg.spmAlarm}:{...DEFAULT_THRESHOLDS.spm,...(local.spm||{})},
  };
}
function rmsStatus(maxVel,th){
  const v=parseFloat(maxVel); if(isNaN(v)) return null;
  const t=(th&&th.rms)||DEFAULT_THRESHOLDS.rms;
  if(v<t.good) return 'Good';
  if(v<t.acceptable) return 'Acceptable';
  if(v<t.alarm) return 'Alarm';
  return 'Danger';
}
function spmStatus(hdm,th){
  const v=parseFloat(hdm); if(isNaN(v)) return null;
  const t=(th&&th.spm)||DEFAULT_THRESHOLDS.spm;
  if(v<t.normal) return 'Normal';
  if(v<t.caution) return 'Caution';
  return 'Danger';
}
function rmsStatusColor(s){ return {Good:'success',Acceptable:'warning',Alarm:'danger',Danger:'purple'}[s]||'info'; }
function spmStatusColor(s){ return {Normal:'success',Caution:'warning',Danger:'danger'}[s]||'info'; }
// SPM unified for dashboard (no purple bucket)
function spmDashTier(s){ return {Normal:'Good',Caution:'Acceptable',Danger:'Alarm'}[s]||s; }
function machineStatusColor(s){ return {Good:'success',Normal:'success',Acceptable:'warning',Caution:'warning',Alarm:'danger',Danger:'purple'}[s]||'info'; }

function complianceTier(status){
  if(!status) return 'Alert';
  const s=String(status).trim().toLowerCase();
  if(s==='yes') return 'Normal';
  if(s==='no'||s==='missing') return 'Alert';
  if(s.includes('comment')||s.includes('caution')||s.includes('observation')||s.includes('under')) return 'Caution';
  return 'Alert';
}
function complianceColor(tier){ return {Normal:'success',Caution:'warning',Alert:'danger'}[tier]||'info'; }

function rowToRMS(r){
  const point=normalizePoint(r['Asset ID']);
  const equipmentId=String(r['Equipment ID']||'').trim();
  const dateIso=isoDate(r['Date']);
  const axial=num(r['AXial (mm/s)']),gear=num(r['Gear\n(mm/s)']),horiz=num(r['Horizontal (mm/s)']),vert=num(r['Vertical (mm/s)']);
  let maxVel=num(r['Max Velocity (mm/s)']);
  if(maxVel===null){const vals=[axial,gear,horiz,vert].filter(v=>v!==null);maxVel=vals.length?Math.max(...vals):null;}
  return {_id:`RMS|${equipmentId}|${point}|${dateIso}`,_matchCols:[2,3,4],_matchValues:[equipmentId,r['Asset ID'],r['Date']],_rowNum:r._rowNum,
    seq:r['#'],equipmentName:r['Equipment Name']||'',equipmentId,point,date:dateIso,axial,gear,horizontal:horiz,vertical:vert,maxVel};
}
function rmsToRow(s){return[s.seq??'',s.equipmentName??'',s.equipmentId??'',s.point??'',s.date??'',s.axial??'',s.gear??'',s.horizontal??'',s.vertical??'',s.maxVel??''];}
function rowToSPM(r){
  const point=normalizePoint(r['Asset ID']);
  const equipmentId=String(r['Equipment ID']||'').trim();
  return {_id:`SPM|${equipmentId}|${point}|${isoDate(r['Date'])}`,_matchCols:[2,3,5],_matchValues:[equipmentId,r['Asset ID'],r['Date']],_rowNum:r._rowNum,

   ════════════════════════════════════════════════════════════════════════ */
let _jsonpCounter=0;
function jsonpRequest(url,params){
  return new Promise((resolve,reject)=>{
    const cbName=`__vibjsonp_${Date.now()}_${_jsonpCounter++}`;
    const qs=new URLSearchParams({...params,callback:cbName}).toString();
    const script=document.createElement('script');
    let done=false;
    const cleanup=()=>{delete window[cbName];if(script.parentNode)script.parentNode.removeChild(script);};
    window[cbName]=(data)=>{if(done)return;done=true;cleanup();resolve(data);};
    script.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error('JSONP failed'));};
    script.src=`${url}?${qs}`;
    document.body.appendChild(script);
    setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('JSONP timed out'));},25000);
  });
}
async function sheetRead(webhookUrl,action='readAll',extra={}){
  if(!webhookUrl) throw new Error('No webhook URL');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),30000);
  try{
    const qs=new URLSearchParams({action,...extra}).toString();
    const resp=await fetch(`${webhookUrl}?${qs}`,{method:'GET',signal:controller.signal});
    clearTimeout(timer);
    if(resp.ok) return await resp.json();
    throw new Error(`HTTP ${resp.status}`);
  }catch(err){
    clearTimeout(timer);
    if(err.name==='AbortError') throw new Error('Sync timed out — check your webhook URL in Settings');
    return await jsonpRequest(webhookUrl,{action,...extra});
  }
}
function sheetWrite(webhookUrl,params){
  if(!webhookUrl) return;
  const qs=new URLSearchParams(params).toString();
  fetch(`${webhookUrl}?${qs}`,{method:'GET',mode:'no-cors'}).catch(()=>{});
}
function writeAppend(wh,sheet,row,headers){sheetWrite(wh,{action:'append',sheet,row:JSON.stringify(row),headers:JSON.stringify(headers)});}
function writeUpdate(wh,sheet,matchCols,matchValues,row){sheetWrite(wh,{action:'updateRow',sheet,matchCols:JSON.stringify(matchCols),matchValues:JSON.stringify(matchValues),row:JSON.stringify(row)});}
function writeDelete(wh,sheet,matchCols,matchValues){sheetWrite(wh,{action:'deleteRow',sheet,matchCols:JSON.stringify(matchCols),matchValues:JSON.stringify(matchValues)});}
function writeUpsertLastRMS(wh,params){const qs=new URLSearchParams({action:'upsertLastRMS',...params}).toString();fetch(`${wh}?${qs}`,{method:'GET',mode:'no-cors'}).catch(()=>{});}
function writeUpsertLastSPM(wh,params){const qs=new URLSearchParams({action:'upsertLastSPM',...params}).toString();fetch(`${wh}?${qs}`,{method:'GET',mode:'no-cors'}).catch(()=>{});}
function writeUpdateCompliance(wh,equipmentId,month){sheetWrite(wh,{action:'updateCompliance',equipmentId,month,value:'YES'});}
function writeUpdateRegisterLimits(wh,params){sheetWrite(wh,{action:'updateRegisterLimits',...params});}
async function triggerBackfill(wh){return await sheetRead(wh,'backfillLastReadings');}
async function writeActionAppend(wh,params){return await sheetRead(wh,'appendAction',params);}

/* ════════════════════════════════════════════════════════════════════════
   EQUIPMENT STATUS ENGINE
   ════════════════════════════════════════════════════════════════════════ */
function computeEquipmentStatus(lastRms,lastSpm,registryMap,rmsRegMap,spmRegMap,thresholdsMap){
  const byEquip=new Map();
  const ensure=(eid)=>{
    if(!byEquip.has(eid)){
      const meta=registryMap[eid]||{};
      byEquip.set(eid,{equipmentId:eid,equipment:meta.equipment||'',line:meta.line||'',eqType:meta.eqType||'',status:null,colorKey:'info',drivenBy:[],rmsPoints:[],spmPoints:[]});
    }
    return byEquip.get(eid);
  };
  lastRms.forEach(r=>{
    const eid=r.equipmentId; if(!eid) return;
    const eq=ensure(eid);
    const th=getThresholds(thresholdsMap,eid,rmsRegMap,spmRegMap);
    const st=rmsStatus(r.maxVel,th); const ck=rmsStatusColor(st);
    eq.rmsPoints.push({type:'RMS',point:r.point,date:r.date,value:r.maxVel,axial:r.axial,gear:r.gear,horizontal:r.horizontal,vertical:r.vertical,status:st,colorKey:ck,unit:'mm/s'});
    if(!eq.status||(STATUS_SEVERITY[st]||0)>(STATUS_SEVERITY[eq.status]||0)){eq.status=st;eq.colorKey=ck;}
  });
  lastSpm.forEach(r=>{
    const eid=r.equipmentId; if(!eid) return;
    const eq=ensure(eid);
    const th=getThresholds(thresholdsMap,eid,rmsRegMap,spmRegMap);
    const st=spmStatus(r.hdm,th); const ck=spmStatusColor(st);
    eq.spmPoints.push({type:'SPM',point:r.point,date:r.date,value:r.hdm,hdm:r.hdm,hdc:r.hdc,gs:r.gs,spmType:r.spmType,status:st,colorKey:ck,unit:'dBsv'});
    // SPM Danger maps to Alarm tier for machine status comparison
    const stTier=spmDashTier(st);
    if(!eq.status||(STATUS_SEVERITY[stTier]||0)>(STATUS_SEVERITY[eq.status]||0)){eq.status=stTier;eq.colorKey=rmsStatusColor(stTier);}
  });
  byEquip.forEach(eq=>{
    if(!eq.status) return;
    const worst=eq.status;
    [...eq.rmsPoints,...eq.spmPoints].forEach(pt=>{
      const ptTier=pt.type==='SPM'?spmDashTier(pt.status):pt.status;
      if(ptTier===worst) eq.drivenBy.push({type:pt.type,point:pt.point,colorKey:pt.colorKey});
    });
  });
  return byEquip;
}

function DonutChart({slices,total,onClick,activeSlice}){
  useTheme();
  const R=68,cx=88,cy=88,stroke=26,circumference=2*Math.PI*R;
  let offset=0;
  const paths=slices.map(s=>{
    const pct=total>0?s.count/total:0,dash=pct*circumference,gap=circumference-dash,path={...s,dash,gap,offset};
    offset+=dash; return path;
  });
  return(
    <svg width={176} height={176} viewBox="0 0 176 176">
      {paths.map((p,i)=>(
        <circle key={i} cx={cx} cy={cy} r={R} fill="none" stroke={p.color} strokeWidth={stroke}
          strokeDasharray={`${p.dash} ${p.gap}`} strokeDashoffset={-p.offset+circumference*0.25}
          style={{cursor:'pointer',opacity:activeSlice===null||activeSlice===p.key?1:0.3,transition:'opacity 0.15s'}}
          onClick={()=>onClick(p.key)}/>
      ))}
      <text x={cx} y={cy-8} textAnchor="middle" fontSize="22" fontWeight="800" fill={S.T.textHighlight}>{total}</text>
      <text x={cx} y={cy+12} textAnchor="middle" fontSize="10" fill={S.T.textSecondary}>Equipment</text>
    </svg>
  );
}

function DashboardPage({lastRms,lastSpm,registryMap,rmsRegMap,spmRegMap,thresholdsMap,setPage,setGraphAsset}){
  useTheme();
  const [statusFilter,setStatusFilter]=useState(null);
  const [lineFilter,setLineFilter]=useState('');
  const [eqTypeFilter,setEqTypeFilter]=useState('');
  const [search,setSearch]=useState('');
  const [expanded,setExpanded]=useState(null);

  const equipMap=useMemo(()=>computeEquipmentStatus(lastRms,lastSpm,registryMap,rmsRegMap,spmRegMap,thresholdsMap),[lastRms,lastSpm,registryMap,rmsRegMap,spmRegMap,thresholdsMap]);
  const equipList=useMemo(()=>Array.from(equipMap.values()).sort((a,b)=>{
    const sa=STATUS_SEVERITY[a.status]||0,sb=STATUS_SEVERITY[b.status]||0;
    return sb!==sa?sb-sa:a.equipmentId.localeCompare(b.equipmentId);
  }),[equipMap]);

  const lines=useMemo(()=>Array.from(new Set(equipList.map(e=>e.line))).filter(Boolean).sort(),[equipList]);
  const eqTypes=useMemo(()=>Array.from(new Set(equipList.map(e=>e.eqType))).filter(Boolean).sort(),[equipList]);

  const statusDefs=[
    {key:'Danger',label:'Danger',colorKey:'purple'},{key:'Alarm',label:'Alarm',colorKey:'danger'},
    {key:'Acceptable',label:'Acceptable',colorKey:'warning'},{key:'Good',label:'Good',colorKey:'success'},
  ];
  const counts=useMemo(()=>{
    const c={Good:0,Acceptable:0,Alarm:0,Danger:0};
    equipList.forEach(e=>{if(c[e.status]!==undefined)c[e.status]++;});
    return c;
  },[equipList]);
  const total=equipList.length;

  const filteredEquip=useMemo(()=>{
    let list=equipList;
    if(statusFilter) list=list.filter(e=>e.status===statusFilter);
    if(lineFilter) list=list.filter(e=>e.line===lineFilter);
    if(eqTypeFilter) list=list.filter(e=>e.eqType===eqTypeFilter);
    if(search.trim()){const q=search.trim().toLowerCase();list=list.filter(e=>e.equipmentId.toLowerCase().includes(q)||e.equipment.toLowerCase().includes(q));}
    return list;
  },[equipList,statusFilter,lineFilter,eqTypeFilter,search]);

  const slices=[
    {key:'Danger',label:'Danger',count:counts.Danger,color:S.T.purple},
    {key:'Alarm',label:'Alarm',count:counts.Alarm,color:S.T.danger},
    {key:'Acceptable',label:'Acceptable',count:counts.Acceptable,color:S.T.warning},
    {key:'Good',label:'Good',count:counts.Good,color:S.T.success},
  ].filter(s=>s.count>0);

  return(
    <div style={{padding:20}}>
      {/* Summary row */}
      <div style={{display:'grid',gridTemplateColumns:'auto 1fr',gap:16,marginBottom:18,alignItems:'start'}}>
        <div style={{...S.card,display:'flex',gap:20,alignItems:'center',flexWrap:'wrap'}}>
          <DonutChart slices={slices} total={total} onClick={k=>setStatusFilter(statusFilter===k?null:k)} activeSlice={statusFilter}/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {statusDefs.map(d=>(
              <div key={d.key} onClick={()=>setStatusFilter(statusFilter===d.key?null:d.key)}
                style={{...S.metric,cursor:'pointer',borderColor:statusFilter===d.key?S.T[d.colorKey]:S.T.border,
                  boxShadow:statusFilter===d.key?`0 0 0 2px ${S.T[d.colorKey]}33`:'none',minWidth:100,textAlign:'center'}}>
                <div style={{fontSize:10,fontWeight:700,color:S.T[d.colorKey],marginBottom:4,letterSpacing:0.5}}>{d.label.toUpperCase()}</div>
                <div style={{fontSize:26,fontWeight:800,color:S.T.textHighlight}}>{counts[d.key]}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{...S.card}}>
          <div style={{fontSize:12,fontWeight:700,color:S.T.textSecondary,marginBottom:10,textTransform:'uppercase',letterSpacing:0.5}}>Quick Filters</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <select style={{...S.input,width:140}} value={lineFilter} onChange={e=>setLineFilter(e.target.value)}>
              <option value="">All Lines</option>
              {lines.map(l=><option key={l} value={l}>{l}</option>)}
            </select>
            <select style={{...S.input,width:140}} value={eqTypeFilter} onChange={e=>setEqTypeFilter(e.target.value)}>
              <option value="">All Eq Types</option>
              {eqTypes.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
            <div style={{position:'relative',flex:1,minWidth:180}}>
              <span style={{position:'absolute',left:9,top:8,color:S.T.textMuted}}><Icon d={ICONS.search} size={14}/></span>
              <input style={{...S.input,paddingLeft:30}} placeholder="Search equipment…" value={search} onChange={e=>setSearch(e.target.value)}/>
            </div>
            {(statusFilter||lineFilter||eqTypeFilter||search)&&(
              <button style={S.btnSecondary} onClick={()=>{setStatusFilter(null);setLineFilter('');setEqTypeFilter('');setSearch('');}}>
                Clear
              </button>
            )}
            <span style={{fontSize:12,color:S.T.textMuted}}>{filteredEquip.length}/{total}</span>
          </div>
        </div>
      </div>

      {/* Chips grid */}
      {equipList.length===0?(
        <div style={{...S.card,textAlign:'center',color:S.T.textMuted,padding:50}}>
          No data yet — sync the app, then run <b>Backfill Last Readings</b> in Settings → System.
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>
          {filteredEquip.map(eq=>(
            <EquipChip key={eq.equipmentId} eq={eq} expanded={expanded===eq.equipmentId}
              onToggle={()=>setExpanded(expanded===eq.equipmentId?null:eq.equipmentId)}
              setPage={setPage} setGraphAsset={setGraphAsset}/>
          ))}
          {filteredEquip.length===0&&<div style={{gridColumn:'1/-1',textAlign:'center',color:S.T.textMuted,padding:40}}>No equipment matches current filters.</div>}
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   NEW READING PAGE
   ════════════════════════════════════════════════════════════════════════ */
function NewReadingPage({registryList,rmsRegMap,spmRegMap,thresholdsMap,mutations,webhookUrl,compliance,setCompliance}){
  useTheme();
  const [equipmentId,setEquipmentId]=useState('');
  const [date,setDate]=useState(new Date().toISOString().slice(0,10));
  const [rmsValues,setRmsValues]=useState({}); // point -> {axial,gear,horizontal,vertical}
  const [spmValues,setSpmValues]=useState({}); // point -> {hdm,hdc,gs}
  const [showWarning,setShowWarning]=useState(false);
  const [savedMsg,setSavedMsg]=useState('');

  const eq=registryList.find(e=>e.equipmentId===equipmentId)||{};
  const rmsReg=rmsRegMap[equipmentId];
  const spmReg=spmRegMap[equipmentId];
  const th=getThresholds(thresholdsMap,equipmentId,rmsRegMap,spmRegMap);

  const rmsPoints=useMemo(()=>rmsReg?rmsReg.points:[],[rmsReg]);
  const spmPoints=useMemo(()=>spmReg?spmReg.points:[],[spmReg]);

  const getMissing=useCallback(()=>{
    const missing=[];
    rmsPoints.forEach(p=>{
      const v=rmsValues[p]||{};
      if(!v.axial&&!v.gear&&!v.horizontal&&!v.vertical) missing.push(`RMS: ${p}`);
    });
    spmPoints.forEach(p=>{
      const v=spmValues[p]||{};
      if(!v.hdm) missing.push(`SPM: ${p}`);
    });
    return missing;
  },[rmsPoints,spmPoints,rmsValues,spmValues]);

  const handleSaveAll=()=>{
    const missing=getMissing();
    if(missing.length>0){setShowWarning(true);return;}
    doSave();
  };

  const doSave=()=>{
    setShowWarning(false);
    let count=0;
    rmsPoints.forEach(p=>{
      const v=rmsValues[p]||{};
      if(!v.axial&&!v.gear&&!v.horizontal&&!v.vertical) return;
      const axial=num(v.axial),gear=num(v.gear),horiz=num(v.horizontal),vert=num(v.vertical);
      const vals=[axial,gear,horiz,vert].filter(x=>x!==null);
      const maxVel=vals.length?Math.max(...vals):null;
      mutations.addRMS({equipmentId,equipmentName:eq.equipment||'',point:p,date,axial,gear,horizontal:horiz,vertical:vert,maxVel});
      count++;
    });
    spmPoints.forEach(p=>{
      const v=spmValues[p]||{};
      if(!v.hdm) return;
      mutations.addSPM({equipmentId,equipmentName:eq.equipment||'',point:p,type:'SPM',date,hdm:num(v.hdm),hdc:num(v.hdc),gs:num(v.gs)});
      count++;
    });
    // Update compliance sheet
    if(count>0&&webhookUrl){
      const mo=monthKey(date);
      writeUpdateCompliance(webhookUrl,equipmentId,mo);
      // Update local compliance state
      setCompliance(prev=>prev.map(c=>{
        if(c.equipmentId!==equipmentId) return c;
        const months=c.months.filter(m=>m.month!==mo);
        months.push({month:mo,status:'YES'});
        months.sort((a,b)=>a.month.localeCompare(b.month));
        return{...c,months,last:'YES'};
      }));
    }
    setRmsValues({});setSpmValues({});
    setSavedMsg(`✓ ${count} reading(s) saved for ${equipmentId} on ${fmtDate(date)}`);
    setTimeout(()=>setSavedMsg(''),4000);
  };

  const hasAnyValue=rmsPoints.some(p=>{const v=rmsValues[p]||{};return v.axial||v.gear||v.horizontal||v.vertical;})||
    spmPoints.some(p=>{const v=spmValues[p]||{};return v.hdm;});

  return(
    <div style={{padding:20,maxWidth:700}}>
      {showWarning&&(
        <Modal title="Missing Values" onClose={()=>setShowWarning(false)} width={460}>
          <div style={{fontSize:13,color:S.T.textPrimary,marginBottom:16,lineHeight:1.7}}>
            The following points have no values entered:
            <ul style={{marginTop:8,paddingLeft:20,color:S.T.warning}}>
              {getMissing().map((m,i)=><li key={i}>{m}</li>)}
            </ul>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button style={S.btnSecondary} onClick={()=>setShowWarning(false)}>Go Back</button>
            <button style={S.btn} onClick={doSave}>Save Anyway</button>
          </div>
        </Modal>
      )}

      <div style={S.card}>
        <div style={{marginBottom:14}}>
          <label style={S.label}>Equipment</label>
          <select style={S.input} value={equipmentId} onChange={e=>{setEquipmentId(e.target.value);setRmsValues({});setSpmValues({});}}>
            <option value="">Select equipment…</option>
            {registryList.map(e=><option key={e.equipmentId} value={e.equipmentId}>{e.equipmentId} — {e.equipment} ({e.line})</option>)}
          </select>
        </div>
        <div style={{marginBottom:16}}>
          <label style={S.label}>Reading Date</label>
          <input type="date" style={{...S.input,maxWidth:200}} value={date} onChange={e=>setDate(e.target.value)}/>
        </div>

        {equipmentId&&rmsPoints.length===0&&spmPoints.length===0&&(
          <div style={{...S.cardSub,color:S.T.textMuted,textAlign:'center',padding:30}}>No measurement points configured for this equipment.</div>
        )}

        {/* RMS Points */}
        {rmsPoints.length>0&&(
          <div style={{marginBottom:18}}>
            <div style={{fontSize:12,fontWeight:800,color:S.T.accent,marginBottom:10,textTransform:'uppercase',letterSpacing:0.5}}>RMS Readings (mm/s)</div>
            {rmsPoints.map(point=>{
              const v=rmsValues[point]||{};
              const vals=[num(v.axial),num(v.gear),num(v.horizontal),num(v.vertical)].filter(x=>x!==null);
              const maxVel=vals.length?Math.max(...vals):null;
              const st=rmsStatus(maxVel,th);
              return(
                <div key={point} style={{...S.cardSub,marginBottom:10}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div style={{fontWeight:700,color:S.T.textHighlight,fontSize:13}}>{point}</div>
                    {maxVel!==null&&<div style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontWeight:700,color:S.T.textHighlight}}>{maxVel.toFixed(2)} mm/s</span>
                      <StatusPill status={st} colorKey={rmsStatusColor(st)}/>
                    </div>}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    {['axial','gear','horizontal','vertical'].map(field=>(
                      <div key={field}>
                        <label style={S.label}>{field.charAt(0).toUpperCase()+field.slice(1)}</label>
                        <input type="number" step="0.01" style={S.input} value={v[field]||''}
                          onChange={e=>setRmsValues(prev=>({...prev,[point]:{...prev[point]||{},[field]:e.target.value}}))}/>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* SPM Points */}
        {spmPoints.length>0&&(
          <div style={{marginBottom:18}}>
            <div style={{fontSize:12,fontWeight:800,color:S.T.accent,marginBottom:10,textTransform:'uppercase',letterSpacing:0.5}}>SPM Readings (dBsv)</div>
            {spmPoints.map(point=>{
              const v=spmValues[point]||{};
              const st=spmStatus(num(v.hdm),th);
              return(
                <div key={point} style={{...S.cardSub,marginBottom:10}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div style={{fontWeight:700,color:S.T.textHighlight,fontSize:13}}>{point}</div>
                    {v.hdm&&<StatusPill status={st} colorKey={spmStatusColor(st)}/>}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
                    {[['hdm','HDm (dBsv)'],['hdc','HDc (dBsv)'],['gs','Gs']].map(([field,label])=>(
                      <div key={field}>
                        <label style={S.label}>{label}</label>
                        <input type="number" step="0.1" style={S.input} value={v[field]||''}
                          onChange={e=>setSpmValues(prev=>({...prev,[point]:{...prev[point]||{},[field]:e.target.value}}))}/>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {equipmentId&&(rmsPoints.length>0||spmPoints.length>0)&&(
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:14,borderTop:`1px solid ${S.T.border}`}}>
            <span style={{fontSize:12,color:S.T.success,fontWeight:700}}>{savedMsg}</span>
            <button style={{...S.btn,opacity:hasAnyValue?1:0.5}} disabled={!hasAnyValue} onClick={handleSaveAll}>
              <span style={{display:'flex',alignItems:'center',gap:6}}><Icon d={ICONS.plus} size={14}/> Save All Readings</span>
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   EQUIPMENT REGISTER PAGE
   ════════════════════════════════════════════════════════════════════════ */
function EquipRegPage({rmsRegister,spmRegister,registryList,webhookUrl,setRmsRegister,setSpmRegister}){
  useTheme();
  const [search,setSearch]=useState('');
  const [lineFilter,setLine]=useState('');
  const [eqTypeFilter,setEqType]=useState('');
  const [editModal,setEditModal]=useState(null); // {row}
  const [saveMsg,setSaveMsg]=useState('');

  const lines=useMemo(()=>Array.from(new Set(registryList.map(e=>e.line))).filter(Boolean).sort(),[registryList]);
  const eqTypes=useMemo(()=>Array.from(new Set(registryList.map(e=>e.eqType))).filter(Boolean).sort(),[registryList]);

  const rows=useMemo(()=>{
    const rmsMap={};rmsRegister.forEach(r=>{rmsMap[r.equipmentId]=r;});
    const spmMap={};spmRegister.forEach(r=>{spmMap[r.equipmentId]=r;});
    const all=new Set([...rmsRegister.map(r=>r.equipmentId),...spmRegister.map(r=>r.equipmentId)]);
    return Array.from(all).map(eid=>{
      const rms=rmsMap[eid],spm=spmMap[eid];
      const base=rms||spm||{};
      return{eid,name:base.equipment||'',namePlate:base.namePlate||'',eqType:base.eqType||'',line:base.line||'',rms,spm};
    }).sort((a,b)=>a.line===b.line?a.eid.localeCompare(b.eid):a.line.localeCompare(b.line));
  },[rmsRegister,spmRegister]);

  const filtered=useMemo(()=>{
    let list=rows;
    if(lineFilter) list=list.filter(r=>r.line===lineFilter);
    if(eqTypeFilter) list=list.filter(r=>r.eqType===eqTypeFilter);
    if(search.trim()){const q=search.trim().toLowerCase();list=list.filter(r=>r.eid.toLowerCase().includes(q)||r.name.toLowerCase().includes(q));}
    return list;
  },[rows,lineFilter,eqTypeFilter,search]);

  const hdr={padding:'8px 10px',color:S.T.textSecondary,fontWeight:700,fontSize:12,borderBottom:`1px solid ${S.T.border}`,background:S.T.tableHead,textAlign:'left'};
  const cell={padding:'7px 10px',borderBottom:`1px solid ${S.T.border2}`,fontSize:12.5};

  const handleSaveEdit=(draft)=>{
    if(!webhookUrl){setSaveMsg('No webhook URL');return;}
    // Update RMS Register
    if(draft.rms){
      writeUpdateRegisterLimits(webhookUrl,{
        type:'RMS',equipmentId:draft.eid,namePlate:draft.namePlate,eqType:draft.eqType,
        line:draft.line,rmsGood:draft.rmsGood,rmsAcceptable:draft.rmsAcceptable,rmsAlarm:draft.rmsAlarm,points:draft.rmsPoints
      });
      setRmsRegister(prev=>prev.map(r=>r.equipmentId===draft.eid?{...r,namePlate:draft.namePlate,eqType:draft.eqType,line:draft.line,
        rmsGood:parseFloat(draft.rmsGood)||r.rmsGood,rmsAcceptable:parseFloat(draft.rmsAcceptable)||r.rmsAcceptable,rmsAlarm:parseFloat(draft.rmsAlarm)||r.rmsAlarm,
        points:draft.rmsPoints.split(',').map(p=>normalizePoint(p)).filter(Boolean)}:r));
    }
    // Update SPM Register
    if(draft.spm){
      writeUpdateRegisterLimits(webhookUrl,{
        type:'SPM',equipmentId:draft.eid,spmNormal:draft.spmNormal,spmCaution:draft.spmCaution,spmAlarm:draft.spmAlarm
      });
      setSpmRegister(prev=>prev.map(r=>r.equipmentId===draft.eid?{...r,
        spmNormal:parseFloat(draft.spmNormal)||r.spmNormal,spmCaution:parseFloat(draft.spmCaution)||r.spmCaution,spmAlarm:parseFloat(draft.spmAlarm)||r.spmAlarm}:r));
    }
    setSaveMsg('✓ Saved'); setTimeout(()=>setSaveMsg(''),2500);
    setEditModal(null);
  };

  return(
    <div style={{padding:20}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10,marginBottom:16}}>
        <div style={S.metric}><div style={{fontSize:10,color:S.T.textSecondary,marginBottom:3}}>Total Equipment</div><div style={{fontSize:24,fontWeight:800,color:S.T.textHighlight}}>{rows.length}</div></div>
        <div style={S.metric}><div style={{fontSize:10,color:S.T.textSecondary,marginBottom:3}}>RMS Registered</div><div style={{fontSize:24,fontWeight:800,color:S.T.accent}}>{rmsRegister.length}</div></div>
        <div style={S.metric}><div style={{fontSize:10,color:S.T.textSecondary,marginBottom:3}}>SPM Registered</div><div style={{fontSize:24,fontWeight:800,color:S.T.info}}>{spmRegister.length}</div></div>
        <div style={S.metric}><div style={{fontSize:10,color:S.T.textSecondary,marginBottom:3}}>Lines</div><div style={{fontSize:24,fontWeight:800,color:S.T.textHighlight}}>{lines.length}</div></div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        <select style={{...S.input,width:140}} value={lineFilter} onChange={e=>setLine(e.target.value)}>
          <option value="">All Lines</option>
          {lines.map(l=><option key={l} value={l}>{l}</option>)}
        </select>
        <select style={{...S.input,width:140}} value={eqTypeFilter} onChange={e=>setEqType(e.target.value)}>
          <option value="">All Eq Types</option>
          {eqTypes.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
        <div style={{position:'relative',flex:1,minWidth:200}}>
          <span style={{position:'absolute',left:9,top:8,color:S.T.textMuted}}><Icon d={ICONS.search} size={14}/></span>
          <input style={{...S.input,paddingLeft:30}} placeholder="Search equipment…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        {saveMsg&&<span style={{fontSize:12,color:S.T.success,fontWeight:700}}>{saveMsg}</span>}
        <span style={{fontSize:12,color:S.T.textMuted}}>{filtered.length}/{rows.length}</span>
      </div>

      <div style={{...S.card,overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead><tr>
            <th style={hdr}>Equipment ID</th><th style={hdr}>Name Plate</th><th style={hdr}>Equipment Name</th>
            <th style={hdr}>Eq Type</th><th style={hdr}>Line</th>
            <th style={hdr}>RMS Limits (G/A/Al)</th><th style={hdr}>RMS Points</th>
            <th style={hdr}>SPM Limits (N/C/Al)</th><th style={hdr}>Actions</th>
          </tr></thead>
          <tbody>
            {filtered.map((r,i)=>(
              <tr key={r.eid} style={{background:i%2?S.T.tableRowAlt:S.T.tableRow}}
                onMouseEnter={e=>e.currentTarget.style.background=S.T.tableHover}
                onMouseLeave={e=>e.currentTarget.style.background=i%2?S.T.tableRowAlt:S.T.tableRow}>
                <td style={{...cell,fontWeight:800,color:S.T.textHighlight}}>{r.eid}</td>
                <td style={{...cell,color:S.T.textPrimary}}>{r.namePlate||'—'}</td>
                <td style={{...cell,color:S.T.textPrimary,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={r.name}>{r.name||'—'}</td>
                <td style={{...cell,color:S.T.textSecondary}}>{r.eqType||'—'}</td>
                <td style={{...cell,color:S.T.textSecondary}}>{r.line||'—'}</td>
                <td style={{...cell,textAlign:'center'}}>
                  {r.rms?<span>
                    <span style={{color:S.T.success,fontWeight:700}}>{r.rms.rmsGood}</span>/
                    <span style={{color:S.T.warning,fontWeight:700}}>{r.rms.rmsAcceptable}</span>/
                    <span style={{color:S.T.danger,fontWeight:700}}>{r.rms.rmsAlarm}</span>
                  </span>:<span style={{color:S.T.textMuted}}>—</span>}
                </td>
                <td style={{...cell,color:S.T.textPrimary,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={r.rms?.points?.join(', ')}>
                  {r.rms?r.rms.points.join(', '):<span style={{color:S.T.textMuted}}>—</span>}
                </td>
                <td style={{...cell,textAlign:'center'}}>
                  {r.spm?<span>
                    <span style={{color:S.T.success,fontWeight:700}}>{r.spm.spmNormal}</span>/
                    <span style={{color:S.T.warning,fontWeight:700}}>{r.spm.spmCaution}</span>/
                    <span style={{color:S.T.danger,fontWeight:700}}>{r.spm.spmAlarm}</span>
                  </span>:<span style={{color:S.T.textMuted}}>—</span>}
                </td>
                <td style={{...cell}}>
                  <button style={{...S.btnSm,fontSize:11}} onClick={()=>setEditModal({row:r})}>
                    <Icon d={ICONS.edit} size={12}/> Edit
                  </button>
                </td>
              </tr>
            ))}
            {filtered.length===0&&<tr><td colSpan={9} style={{padding:30,textAlign:'center',color:S.T.textMuted}}>No equipment found.</td></tr>}
          </tbody>
        </table>
      </div>

      {editModal&&<EquipEditModal row={editModal.row} lines={lines} onClose={()=>setEditModal(null)} onSave={handleSaveEdit}/>}
    </div>
  );
}

function EquipEditModal({row,lines,onClose,onSave}){

          <select style={S.input} value={draft.line} onChange={e=>set('line',e.target.value)}>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:10}}>
          <div><label style={S.label}>Good (mm/s)</label><input type="number" step="0.1" style={S.input} value={draft.rmsGood} onChange={e=>set('rmsGood',e.target.value)}/></div>
          <div><label style={S.label}>Acceptable (mm/s)</label><input type="number" step="0.1" style={S.input} value={draft.rmsAcceptable} onChange={e=>set('rmsAcceptable',e.target.value)}/></div>
          <div><label style={S.label}>Alarm (mm/s)</label><input type="number" step="0.1" style={S.input} value={draft.rmsAlarm} onChange={e=>set('rmsAlarm',e.target.value)}/></div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={S.label}>RMS Points (comma-separated)</label>
          <input style={S.input} value={draft.rmsPoints} onChange={e=>set('rmsPoints',e.target.value)} placeholder="e.g. Motor DE, Motor NDE, Fan DE"/>
          <div style={{fontSize:11,color:S.T.textMuted,marginTop:3}}>Edit points list. Changes update the sheet Points column (col G).</div>
        </div>
      </>}
      {draft.spm&&<>
        <div style={{fontSize:12,fontWeight:800,color:S.T.accent,marginBottom:8,textTransform:'uppercase'}}>SPM Limits</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14}}>
          <div><label style={S.label}>Normal (dBsv)</label><input type="number" step="0.1" style={S.input} value={draft.spmNormal} onChange={e=>set('spmNormal',e.target.value)}/></div>
          <div><label style={S.label}>Caution (dBsv)</label><input type="number" step="0.1" style={S.input} value={draft.spmCaution} onChange={e=>set('spmCaution',e.target.value)}/></div>
          <div><label style={S.label}>Alarm (dBsv)</label><input type="number" step="0.1" style={S.input} value={draft.spmAlarm} onChange={e=>set('spmAlarm',e.target.value)}/></div>

      <div style={{display:'flex',gap:10,justifyContent:'flex-end',paddingTop:12,borderTop:`1px solid ${S.T.border}`}}>

          <thead><tr style={{background:S.T.tableHead,position:'sticky',top:0}}>
            {columns.map(c=><th key={c.key} style={{textAlign:'left',padding:'6px 8px',color:S.T.textSecondary,fontWeight:700,borderBottom:`1px solid ${S.T.border}`}}>{c.label}</th>)}
            <th style={{padding:'6px 8px',borderBottom:`1px solid ${S.T.border}`}}></th>

function ReadingModal({type,initial,rmsRegMap,spmRegMap,thresholdsMap,registryList,onCancel,onSave}){
  useTheme();
  const [draft,setDraft]=useState({...initial});
  const set=(k,v)=>setDraft(d=>({...d,[k]:v}));
  const eq=registryList.find(e=>e.equipmentId===draft.equipmentId)||{};
  const th=getThresholds(thresholdsMap,draft.equipmentId,rmsRegMap,spmRegMap);
  const rmsReg=rmsRegMap[draft.equipmentId];
  const spmReg=spmRegMap[draft.equipmentId];
  const pointOptions=type==='RMS'?(rmsReg?.points||[]):(spmReg?.points||[]);

  const maxVel=useMemo(()=>{
    const vals=[draft.axial,draft.gear,draft.horizontal,draft.vertical].map(v=>parseFloat(v)).filter(v=>!isNaN(v));
    return vals.length?Math.max(...vals):null;
  },[draft.axial,draft.gear,draft.horizontal,draft.vertical]);

  return(
    <Modal title={`${draft._id?'Edit':'Add'} ${type} Reading`} onClose={onCancel} width={480}>
      <div style={{marginBottom:10}}>
        <label style={S.label}>Equipment</label>
        <select style={S.input} value={draft.equipmentId||''} onChange={e=>set('equipmentId',e.target.value)} disabled={!!draft._id}>
          <option value="">Select…</option>
          {registryList.map(e=><option key={e.equipmentId} value={e.equipmentId}>{e.equipmentId} — {e.equipment}</option>)}
        </select>
      </div>
      <div style={{marginBottom:10}}>
        <label style={S.label}>Measurement Point</label>
        <select style={S.input} value={draft.point||''} onChange={e=>set('point',e.target.value)}>
          <option value="">Select…</option>
          {pointOptions.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      <div style={{marginBottom:12}}>
        <label style={S.label}>Date</label>
        <input type="date" style={S.input} value={draft.date||''} onChange={e=>set('date',e.target.value)}/>
      </div>
      {type==='RMS'?(
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
            {[['axial','Axial (mm/s)'],['gear','Gear (mm/s)'],['horizontal','Horizontal (mm/s)'],['vertical','Vertical (mm/s)']].map(([f,l])=>(
              <div key={f}><label style={S.label}>{l}</label><input type="number" step="0.01" style={S.input} value={draft[f]??''} onChange={e=>set(f,e.target.value)}/></div>
            ))}
          </div>
          {maxVel!==null&&<div style={{...S.cardSub,marginBottom:12}}>
            <span style={{fontSize:12,color:S.T.textSecondary}}>Max Velocity: </span>
            <span style={{fontWeight:800,color:S.T.textHighlight}}>{maxVel.toFixed(2)} mm/s</span>
            <span style={{marginLeft:10}}><StatusPill status={rmsStatus(maxVel,th)} colorKey={rmsStatusColor(rmsStatus(maxVel,th))}/></span>
          </div>}
        </>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
          {[['hdm','HDm (dBsv)'],['hdc','HDc (dBsv)'],['gs','Gs']].map(([f,l])=>(
            <div key={f}><label style={S.label}>{l}</label><input type="number" step="0.1" style={S.input} value={draft[f]??''} onChange={e=>set(f,e.target.value)}/></div>
          ))}
        </div>
      )}
      <div style={{display:'flex',gap:10,justifyContent:'flex-end',paddingTop:12,borderTop:`1px solid ${S.T.border}`}}>
        <button style={S.btnSecondary} onClick={onCancel}>Cancel</button>
        <button style={S.btn} onClick={()=>onSave({...draft,equipmentName:eq.equipment||draft.equipmentName||'',maxVel})}>Save</button>
      </div>
    </Modal>
  );
}

function RegistryPage({registryList,rms,spm,rmsRegMap,spmRegMap,thresholdsMap,mutations}){
  useTheme();
  const [expanded,setExpanded]=useState(null);
  const [search,setSearch]=useState('');
  const [lineFilter,setLineFilter]=useState('');
  const [equipFilter,setEquipFilter]=useState('');
  const [modal,setModal]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);

  const lines=useMemo(()=>Array.from(new Set(registryList.map(e=>e.line))).filter(Boolean).sort(),[registryList]);
  const equipOptions=useMemo(()=>lineFilter?registryList.filter(e=>e.line===lineFilter):registryList,[registryList,lineFilter]);

  const grouped=useMemo(()=>{
    const g={};
    registryList.forEach(eq=>{
      if(lineFilter&&eq.line!==lineFilter) return;
      if(equipFilter&&eq.equipmentId!==equipFilter) return;
      if(search.trim()){const q=search.trim().toLowerCase();if(!(eq.equipmentId.toLowerCase().includes(q)||eq.equipment.toLowerCase().includes(q))) return;}
      (g[eq.line||'Other']=g[eq.line||'Other']||[]).push(eq);
    });
    return g;
  },[registryList,search,lineFilter,equipFilter]);

  return(
    <div style={{padding:20}}>
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <select style={{...S.input,width:150}} value={lineFilter} onChange={e=>{setLineFilter(e.target.value);setEquipFilter('');}}>
          <option value="">All Lines</option>{lines.map(l=><option key={l} value={l}>{l}</option>)}
        </select>
        <select style={{...S.input,width:200}} value={equipFilter} onChange={e=>setEquipFilter(e.target.value)}>
          <option value="">All Equipment</option>{equipOptions.map(e=><option key={e.equipmentId} value={e.equipmentId}>{e.equipmentId} — {e.equipment}</option>)}
        </select>
        <div style={{position:'relative',maxWidth:260}}>
          <span style={{position:'absolute',left:9,top:8,color:S.T.textMuted}}><Icon d={ICONS.search} size={14}/></span>
          <input style={{...S.input,paddingLeft:30}} placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
      </div>

      {Object.keys(grouped).sort().map(line=>(
        <div key={line} style={{marginBottom:20}}>
          <div style={{fontSize:12,fontWeight:800,color:S.T.accent,marginBottom:8,letterSpacing:0.5}}>{line.toUpperCase()} ({grouped[line].length})</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>
            {grouped[line].map(eq=>{
              const isOpen=expanded===eq.equipmentId;
              const eqRms=rms.filter(r=>r.equipmentId===eq.equipmentId).sort((a,b)=>b.date>a.date?1:-1);
              const eqSpm=spm.filter(r=>r.equipmentId===eq.equipmentId).sort((a,b)=>b.date>a.date?1:-1);
              return(
                <div key={eq.equipmentId} style={{...S.card,gridColumn:isOpen?'1 / -1':'auto'}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}} onClick={()=>setExpanded(isOpen?null:eq.equipmentId)}>
                    <div>
                      <div style={{fontSize:13,fontWeight:800,color:S.T.textHighlight}}>{eq.equipmentId}</div>
                      <div style={{fontSize:11,color:S.T.textSecondary,marginTop:2}} title={eq.equipment}>{eq.equipment}</div>
                    </div>
                    <span style={{color:S.T.textMuted,transform:isOpen?'rotate(180deg)':'none',transition:'0.15s'}}><Icon d={ICONS.chevDown} size={15}/></span>
                  </div>
                  <div style={{fontSize:11,color:S.T.textMuted,marginTop:5}}>{eqRms.length} RMS · {eqSpm.length} SPM readings</div>
                  {isOpen&&(
                    <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${S.T.border}`}}>
                      <div style={{display:'flex',gap:8,marginBottom:10}}>
                        <button style={{...S.btn,fontSize:12,display:'flex',alignItems:'center',gap:5}} onClick={()=>setModal({type:'RMS',initial:{equipmentId:eq.equipmentId,equipmentName:eq.equipment}})}>
                          <Icon d={ICONS.plus} size={12}/> Add RMS
                        </button>
                        <button style={{...S.btnSecondary,fontSize:12,display:'flex',alignItems:'center',gap:5}} onClick={()=>setModal({type:'SPM',initial:{equipmentId:eq.equipmentId,equipmentName:eq.equipment}})}>
                          <Icon d={ICONS.plus} size={12}/> Add SPM
                        </button>
                      </div>
                      <MiniTable title="RMS" rows={eqRms}
                        columns={[{key:'point',label:'Point'},{key:'date',label:'Date',render:r=>fmtDate(r.date)},{key:'axial',label:'Axial'},{key:'horizontal',label:'Horiz'},{key:'vertical',label:'Vert'},{key:'maxVel',label:'Max',render:r=>{const th=getThresholds(thresholdsMap,r.equipmentId,rmsRegMap,spmRegMap);const st=rmsStatus(r.maxVel,th);return<span>{r.maxVel} <StatusPill status={st} colorKey={rmsStatusColor(st)}/></span>;}}]}
                        onEdit={r=>setModal({type:'RMS',initial:r})} onDelete={r=>setConfirmDel({type:'RMS',row:r})}/>
                      <MiniTable title="SPM" rows={eqSpm}
                        columns={[{key:'point',label:'Point'},{key:'date',label:'Date',render:r=>fmtDate(r.date)},{key:'hdm',label:'HDm',render:r=>{const th=getThresholds(thresholdsMap,r.equipmentId,rmsRegMap,spmRegMap);const st=spmStatus(r.hdm,th);return<span>{r.hdm} <StatusPill status={st} colorKey={spmStatusColor(st)}/></span>;}},{key:'hdc',label:'HDc'},{key:'gs',label:'Gs'}]}
                        onEdit={r=>setModal({type:'SPM',initial:r})} onDelete={r=>setConfirmDel({type:'SPM',row:r})}/>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {modal&&<ReadingModal type={modal.type} initial={modal.initial} rmsRegMap={rmsRegMap} spmRegMap={spmRegMap} thresholdsMap={thresholdsMap} registryList={registryList}
        onCancel={()=>setModal(null)}
        onSave={data=>{if(modal.type==='RMS'){data._id?mutations.updateRMS(data):mutations.addRMS(data);}else{data._id?mutations.updateSPM(data):mutations.addSPM(data);}setModal(null);}}/>}
      {confirmDel&&<ConfirmModal label={`${confirmDel.row.equipmentId}·${confirmDel.row.point}·${fmtDate(confirmDel.row.date)}`} message="Delete this reading permanently?"
        onCancel={()=>setConfirmDel(null)} onConfirm={()=>{confirmDel.type==='RMS'?mutations.deleteRMS(confirmDel.row):mutations.deleteSPM(confirmDel.row);setConfirmDel(null);}}/>}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   TREND CHART
   ════════════════════════════════════════════════════════════════════════ */
function TrendChart({title,series,thresholds=[],unit='',height=340}){
  useTheme();
  const [hover,setHover]=useState(null);
  const W=900,H=height,padL=55,padR=20,padT=28,padB=42;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const allDates=Array.from(new Set(series.flatMap(s=>s.data.map(d=>d.x)))).sort();
  const allVals=series.flatMap(s=>s.data.map(d=>d.y)).filter(v=>v!==null&&v!==undefined);
  const thrVals=thresholds.map(t=>t.value);
  let lo=Math.min(0,...allVals,...thrVals),hi=Math.max(1,...allVals,...thrVals);
  hi=hi*1.12; if(hi===lo)hi=lo+1;
  const xScale=d=>allDates.length<=1?padL+plotW/2:padL+(allDates.indexOf(d)/(allDates.length-1))*plotW;
  const yScale=v=>padT+plotH-((v-lo)/(hi-lo))*plotH;
  const labelStep=Math.max(1,Math.ceil(allDates.length/8));
  const xLabels=allDates.filter((_,i)=>i%labelStep===0||i===allDates.length-1);
  if(allDates.length===0) return<div style={S.cardSub}><div style={{fontSize:13,fontWeight:700,color:S.T.textPrimary,marginBottom:4}}>{title}</div><div style={{padding:24,textAlign:'center',color:S.T.textMuted}}>No data</div></div>;
  return(
    <div style={S.cardSub}>
      <div style={{fontSize:14,fontWeight:800,color:S.T.textPrimary,marginBottom:8}}>{title}</div>
      <div style={{overflowX:'auto'}}>
        <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{display:'block',maxWidth:'100%',cursor:'crosshair'}}>
          {/* Y grid */}
          {[0,0.25,0.5,0.75,1].map(f=>{const y=padT+plotH*f;return<line key={f} x1={padL} y1={y} x2={padL+plotW} y2={y} stroke={S.T.border2} strokeWidth={0.8}/>;}).filter(Boolean)}
          {/* Y labels */}
          {[0,0.25,0.5,0.75,1].map(f=>{const v=lo+(hi-lo)*(1-f);return<text key={f} x={padL-5} y={padT+plotH*f+4} textAnchor="end" fontSize="10" fill={S.T.textMuted}>{v.toFixed(1)}</text>;})}
          {/* Threshold lines */}
          {thresholds.map((t,i)=><line key={i} x1={padL} y1={yScale(t.value)} x2={padL+plotW} y2={yScale(t.value)} stroke={t.color} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.7}/>)}
          {/* Series lines */}
          {series.map(s=>{
            const pts=s.data.filter(d=>d.y!==null&&d.y!==undefined);
            if(pts.length<2) return null;
            const d='M'+pts.map(p=>`${xScale(p.x)},${yScale(p.y)}`).join('L');
            return<path key={s.name} d={d} fill="none" stroke={s.color} strokeWidth={2} strokeLinejoin="round"/>;
          })}
          {/* Dots */}
          {series.map(s=>s.data.filter(d=>d.y!==null&&d.y!==undefined).map((p,i)=>{
            const hk=`${s.name}|${p.x}`;const isHov=hover===hk;
            return<circle key={i} cx={xScale(p.x)} cy={yScale(p.y)} r={isHov?7:4} fill={s.color} stroke={S.T.cardBg} strokeWidth={isHov?2.5:1.5}
              style={{cursor:'pointer',transition:'r 0.1s'}}
              onMouseEnter={()=>setHover(hk)} onMouseLeave={()=>setHover(null)}/>;
          }))}
          {/* Hover tooltip */}
          {hover&&(()=>{
            const [sName,date]=hover.split('|');
            const s=series.find(s=>s.name===sName);
            const pt=s&&s.data.find(d=>d.x===date);
            if(!pt||pt.y===null) return null;
            const cx=xScale(date),cy=yScale(pt.y);
            const tx=cx>W-120?cx-110:cx+8,ty=cy<40?cy+8:cy-32;
            return<>
              <rect x={tx} y={ty} width={105} height={36} rx={4} fill={S.T.cardBg} stroke={S.T.border} strokeWidth={1}/>
              <text x={tx+6} y={ty+14} fontSize="11" fill={S.T.textHighlight} fontWeight="700">{fmtDate(date)}</text>
              <text x={tx+6} y={ty+28} fontSize="11" fill={s.color} fontWeight="700">{sName}: {pt.y?.toFixed(2)} {unit}</text>
            </>;
          })()}
          {/* X labels */}
          {xLabels.map(d=><text key={d} x={xScale(d)} y={H-8} textAnchor="middle" fontSize="10" fill={S.T.textMuted}>{fmtDate(d)}</text>)}
          {/* Axes */}
          <line x1={padL} y1={padT} x2={padL} y2={padT+plotH} stroke={S.T.border} strokeWidth={1}/>
          <line x1={padL} y1={padT+plotH} x2={padL+plotW} y2={padT+plotH} stroke={S.T.border} strokeWidth={1}/>
        </svg>
      </div>
      {(series.length>1||thresholds.length>0)&&(
        <div style={{display:'flex',gap:14,flexWrap:'wrap',marginTop:8}}>
          {series.map(s=><span key={s.name} style={{fontSize:11.5,color:S.T.textSecondary,display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:12,height:3,background:s.color,display:'inline-block',borderRadius:2}}/>{s.name}
          </span>)}
          {thresholds.map((t,i)=><span key={i} style={{fontSize:11.5,color:t.color,display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:12,height:2,background:t.color,display:'inline-block',borderRadius:1,opacity:0.7}}/>{t.label}
          </span>)}
        </div>
      )}
    </div>
  );
}

function GraphsPage({registryList,rms,spm,graphAsset,setGraphAsset,thresholdsMap,rmsRegMap,spmRegMap}){
  useTheme();
  const [equipmentId,setEquipmentId]=useState(graphAsset||'');
  const [range,setRange]=useState('12');
  useEffect(()=>{if(graphAsset)setEquipmentId(graphAsset);},[graphAsset]);
  const eq=registryList.find(e=>e.equipmentId===equipmentId)||{};
  const th=getThresholds(thresholdsMap,equipmentId,rmsRegMap,spmRegMap);
  const cutoff=range==='all'?null:new Date(Date.now()-parseInt(range)*30*24*3600*1000).toISOString().slice(0,10);
  const eqRms=rms.filter(r=>r.equipmentId===equipmentId&&(!cutoff||r.date>=cutoff)).sort((a,b)=>a.date<b.date?-1:1);
  const eqSpm=spm.filter(r=>r.equipmentId===equipmentId&&(!cutoff||r.date>=cutoff)).sort((a,b)=>a.date<b.date?-1:1);
  const rmsPoints=Array.from(new Set(eqRms.map(r=>r.point)));
  const spmPoints=Array.from(new Set(eqSpm.map(r=>r.point)));
  const rmsThresholds=[{value:th.rms.good,color:S.T.success,label:'Good'},{value:th.rms.acceptable,color:S.T.warning,label:'Acceptable'},{value:th.rms.alarm,color:S.T.danger,label:'Alarm'}];
  const spmThresholds=[{value:th.spm.normal,color:S.T.success,label:'Normal'},{value:th.spm.caution,color:S.T.warning,label:'Caution'}];
  return(
    <div style={{padding:20}}>
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <select style={{...S.input,width:300}} value={equipmentId} onChange={e=>{setEquipmentId(e.target.value);setGraphAsset(e.target.value);}}>
          <option value="">Select equipment…</option>
          {registryList.map(e=><option key={e.equipmentId} value={e.equipmentId}>{e.equipmentId} — {e.equipment}</option>)}
        </select>
        <select style={{...S.input,width:160}} value={range} onChange={e=>setRange(e.target.value)}>
          <option value="3">Last 3 months</option><option value="6">Last 6 months</option>
          <option value="12">Last 12 months</option><option value="all">All time</option>
        </select>
      </div>
      {equipmentId&&<div style={{fontSize:13,fontWeight:700,color:S.T.textHighlight,marginBottom:14}}>{eq.equipment} · {eq.line}</div>}
      {rmsPoints.map(point=>{
        const data=eqRms.filter(r=>r.point===point);
        return<div key={point} style={{marginBottom:16}}>
          <TrendChart title={`RMS — ${point}`} unit="mm/s"
            series={[{name:'Axial',color:S.T.accent,data:data.map(d=>({x:d.date,y:d.axial}))},{name:'Horiz',color:S.T.success,data:data.map(d=>({x:d.date,y:d.horizontal}))},{name:'Vert',color:S.T.warning,data:data.map(d=>({x:d.date,y:d.vertical}))},{name:'Max',color:S.T.danger,data:data.map(d=>({x:d.date,y:d.maxVel}))}]}
            thresholds={rmsThresholds}/>
        </div>;
      })}
      {spmPoints.map(point=>{
        const data=eqSpm.filter(r=>r.point===point);
        return<div key={point} style={{marginBottom:16}}>
          <TrendChart title={`SPM — ${point}`} unit="dBsv"
            series={[{name:'HDm',color:S.T.accent,data:data.map(d=>({x:d.date,y:d.hdm}))},{name:'HDc',color:S.T.info,data:data.map(d=>({x:d.date,y:d.hdc}))}]}
            thresholds={spmThresholds}/>
        </div>;
      })}
      {!equipmentId&&<div style={{...S.card,textAlign:'center',color:S.T.textMuted,padding:60}}>Select equipment to view trend charts.</div>}
      {equipmentId&&rmsPoints.length===0&&spmPoints.length===0&&<div style={{...S.card,textAlign:'center',color:S.T.textMuted,padding:60}}>No readings found for this equipment in the selected range.</div>}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   COMPLIANCE TRACKER PAGE
   ════════════════════════════════════════════════════════════════════════ */
function CompliancePage({compliance,lastRms,lastSpm,registryMap}){
  useTheme();
  const [lineFilter,setLineFilter]=useState('');
  const [eqTypeFilter,setEqTypeFilter]=useState('');
  const [statusFilter,setStatusFilter]=useState(null);
  const [search,setSearch]=useState('');
  const [expanded,setExpanded]=useState(null);

  const lines=useMemo(()=>Array.from(new Set(compliance.map(c=>c.line))).filter(Boolean).sort(),[compliance]);
  const eqTypes=useMemo(()=>{
    const types=new Set();
    compliance.forEach(c=>{const m=registryMap[c.equipmentId];if(m?.eqType)types.add(m.eqType);});
    return Array.from(types).sort();
  },[compliance,registryMap]);

  // Build machine status map from last readings
  const machineStatusMap=useMemo(()=>{
    const m={};
    // by equipmentId -> {month -> status}
    [...lastRms,...lastSpm].forEach(r=>{
      if(!r.machineStatus) return;
      const mo=monthKey(r.date);
      if(!m[r.equipmentId]) m[r.equipmentId]={};
      const cur=m[r.equipmentId][mo];
      m[r.equipmentId][mo]=cur?worstOfTwo(cur,r.machineStatus):r.machineStatus;
    });
    return m;
  },[lastRms,lastSpm]);

  const counts=useMemo(()=>{const c={Normal:0,Caution:0,Alert:0};compliance.forEach(r=>{const t=complianceTier(r.last);if(c[t]!==undefined)c[t]++;});return c;},[compliance]);

  let rows=compliance;
  if(lineFilter) rows=rows.filter(r=>r.line===lineFilter);
  if(eqTypeFilter) rows=rows.filter(r=>(registryMap[r.equipmentId]?.eqType||'')===eqTypeFilter);
  if(statusFilter) rows=rows.filter(r=>complianceTier(r.last)===statusFilter);
  if(search.trim()){const q=search.trim().toLowerCase();rows=rows.filter(r=>r.equipmentId.toLowerCase().includes(q)||r.equipment.toLowerCase().includes(q));}

  // Get dot color for a compliance month entry
  const dotColor=(eid,month,status)=>{
    const tier=complianceTier(status);
    if(tier==='Alert') return S.T.textMuted; // grey for missing
    if(tier==='Caution') return S.T.warning;
    // tier==='Normal' (YES)
    const ms=machineStatusMap[eid]&&machineStatusMap[eid][month];
    if(!ms) return S.T.success; // neutral green
    return S.T[machineStatusColor(ms)]||S.T.success;
  };

  const cardDefs=[{key:'Normal',label:'Submitted',color:S.T.success},{key:'Caution',label:'Partial/Observation',color:S.T.warning},{key:'Alert',label:'Missing/No',color:S.T.danger}];

  return(
    <div style={{padding:20}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:12,marginBottom:16}}>
        {cardDefs.map(c=>(
          <div key={c.key} onClick={()=>setStatusFilter(statusFilter===c.key?null:c.key)}
            style={{...S.card,cursor:'pointer',borderColor:statusFilter===c.key?c.color:S.T.border,boxShadow:statusFilter===c.key?`0 0 0 2px ${c.color}33`:'none',textAlign:'center'}}>
            <div style={{fontSize:10,fontWeight:700,color:c.color,marginBottom:4,letterSpacing:0.5}}>{c.label.toUpperCase()}</div>
            <div style={{fontSize:28,fontWeight:800,color:S.T.textHighlight}}>{counts[c.key]}</div>
          </div>
        ))}
      </div>

      <div style={S.card}>
        <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
          <select style={{...S.input,width:140}} value={lineFilter} onChange={e=>setLineFilter(e.target.value)}>
            <option value="">All Lines</option>{lines.map(l=><option key={l} value={l}>{l}</option>)}
          </select>
          <select style={{...S.input,width:140}} value={eqTypeFilter} onChange={e=>setEqTypeFilter(e.target.value)}>
            <option value="">All Eq Types</option>{eqTypes.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <div style={{position:'relative',flex:1,minWidth:180}}>
            <span style={{position:'absolute',left:9,top:8,color:S.T.textMuted}}><Icon d={ICONS.search} size={14}/></span>
            <input style={{...S.input,paddingLeft:30}} placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
        </div>

        {/* Legend */}
        <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:12,fontSize:11,color:S.T.textMuted}}>
          {[['Good',S.T.success],['Acceptable',S.T.warning],['Alarm',S.T.danger],['Danger',S.T.purple],['Missing',S.T.textMuted],['Caution',S.T.warning]].map(([l,c])=>(
            <span key={l} style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,borderRadius:'50%',background:c,display:'inline-block'}}/>{l}</span>
          ))}
        </div>

        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5}}>
            <thead><tr style={{background:S.T.tableHead}}>
              {['Line','Equipment','Asset ID','Last Status','Compliance 12mo',''].map(h=>(
                <th key={h} style={{textAlign:'left',padding:'7px 10px',color:S.T.textSecondary,fontWeight:700,borderBottom:`1px solid ${S.T.border}`}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {rows.map((r,i)=>{
                const isOpen=expanded===r.equipmentId;
                const last24=r.months.slice(-24);
                const pct12=r.months.slice(-12);const okPct=pct12.filter(m=>complianceTier(m.status)==='Normal').length;
                const pct=pct12.length?Math.round(okPct/pct12.length*100):null;
                return(
                  <React.Fragment key={r.equipmentId}>
                    <tr style={{background:i%2?S.T.tableRowAlt:S.T.tableRow,cursor:'pointer'}} onClick={()=>setExpanded(isOpen?null:r.equipmentId)}>
                      <td style={{padding:'7px 10px',color:S.T.textSecondary,borderBottom:`1px solid ${S.T.border2}`}}>{r.line}</td>
                      <td style={{padding:'7px 10px',color:S.T.textPrimary,borderBottom:`1px solid ${S.T.border2}`,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={r.equipment}>{r.equipment}</td>
                      <td style={{padding:'7px 10px',color:S.T.textHighlight,fontWeight:700,borderBottom:`1px solid ${S.T.border2}`}}>{r.equipmentId}</td>
                      <td style={{padding:'7px 10px',borderBottom:`1px solid ${S.T.border2}`}}><StatusPill status={r.last||'Missing'} colorKey={complianceColor(complianceTier(r.last))}/></td>
                      <td style={{padding:'7px 10px',color:S.T.textPrimary,borderBottom:`1px solid ${S.T.border2}`}}>{pct===null?'—':`${pct}%`}</td>
                      <td style={{padding:'7px 10px',color:S.T.textMuted,borderBottom:`1px solid ${S.T.border2}`}}>
                        <span style={{transform:isOpen?'rotate(180deg)':'none',display:'inline-block',transition:'0.15s'}}><Icon d={ICONS.chevDown} size={14}/></span>
                      </td>
                    </tr>
                    {isOpen&&(
                      <tr style={{background:i%2?S.T.tableRowAlt:S.T.tableRow}}>
                        <td colSpan={6} style={{padding:'10px 14px 16px',borderBottom:`1px solid ${S.T.border2}`}}>
                          <div style={{fontSize:11,color:S.T.textMuted,marginBottom:8}}>Last {last24.length} months (oldest → newest)</div>
                          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                            {last24.map(m=>{
                              const dc=dotColor(r.equipmentId,m.month,m.status);
                              const tier=complianceTier(m.status);
                              const isGrey=tier==='Alert';
                              return(
                                <div key={m.month} title={`${m.month}: ${m.status}`}
                                  style={{width:28,height:28,borderRadius:4,background:isGrey?S.T.border:dc+'33',border:`2px solid ${isGrey?S.T.border2:dc}`,
                                    display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:isGrey?S.T.textMuted:dc,fontWeight:700,cursor:'default'}}>
                                  {m.month.slice(5)}
                                </div>
                              );
                            })}
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {rows.length===0&&<tr><td colSpan={6} style={{padding:24,textAlign:'center',color:S.T.textMuted}}>No equipment found.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   LIMITS SETTINGS PAGE
   ════════════════════════════════════════════════════════════════════════ */
function LimitsPage({registryList,thresholdsMap,setThresholds,rmsRegMap,spmRegMap,webhookUrl}){
  useTheme();
  const [equipmentId,setEquipmentId]=useState('');
  const [draft,setDraft]=useState(null);
  const [saved,setSaved]=useState(false);
  const eqMeta=registryList.find(e=>e.equipmentId===equipmentId)||{};

  useEffect(()=>{
    if(!equipmentId){setDraft(null);return;}
    const th=getThresholds(thresholdsMap,equipmentId,rmsRegMap,spmRegMap);
    setDraft({rms:{...th.rms},spm:{...th.spm}});
  },[equipmentId,thresholdsMap,rmsRegMap,spmRegMap]);

  const handleSave=()=>{
    setThresholds(equipmentId,draft);
    if(webhookUrl){
      writeUpdateRegisterLimits(webhookUrl,{type:'RMS',equipmentId,rmsGood:draft.rms.good,rmsAcceptable:draft.rms.acceptable,rmsAlarm:draft.rms.alarm});
      writeUpdateRegisterLimits(webhookUrl,{type:'SPM',equipmentId,spmNormal:draft.spm.normal,spmCaution:draft.spm.caution,spmAlarm:draft.spm.caution});
    }
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  const handleReset=()=>{setThresholds(equipmentId,null);const th=getThresholds({},equipmentId,rmsRegMap,spmRegMap);setDraft({rms:{...th.rms},spm:{...th.spm}});};

  return(
    <div style={{padding:20,maxWidth:700}}>
      <div style={{marginBottom:16}}>
        <label style={S.label}>Equipment</label>
        <select style={{...S.input,maxWidth:360}} value={equipmentId} onChange={e=>setEquipmentId(e.target.value)}>
          <option value="">Select equipment…</option>
          {registryList.map(e=><option key={e.equipmentId} value={e.equipmentId}>{e.equipmentId} — {e.equipment}</option>)}
        </select>
      </div>
      {!equipmentId&&<div style={{...S.card,textAlign:'center',color:S.T.textMuted,padding:50}}>Select equipment to configure alarm limits.</div>}
      {equipmentId&&draft&&(
        <div style={S.card}>
          <div style={{fontSize:14,fontWeight:800,color:S.T.textHighlight,marginBottom:4}}>{equipmentId} — {eqMeta.equipment}</div>
          <div style={{fontSize:12,color:S.T.textSecondary,marginBottom:16}}>{eqMeta.line}</div>
          <div style={{fontSize:12,fontWeight:800,color:S.T.accent,marginBottom:8,textTransform:'uppercase'}}>RMS Thresholds (mm/s)</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:16}}>
            {[['good','Good (Green) below',S.T.success],['acceptable','Acceptable (Amber) below',S.T.warning],['alarm','Alarm (Red) below',S.T.danger]].map(([k,l,c])=>(
              <div key={k}><label style={{...S.label,color:c}}>{l}</label>
                <input type="number" step="0.1" style={S.input} value={draft.rms[k]||''} onChange={e=>setDraft(d=>({...d,rms:{...d.rms,[k]:parseFloat(e.target.value)||0}}))}/>
              </div>
            ))}
          </div>
          <div style={{fontSize:12,fontWeight:800,color:S.T.accent,marginBottom:8,textTransform:'uppercase'}}>SPM Thresholds (dBsv)</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
            {[['normal','Normal (Green) below',S.T.success],['caution','Caution (Amber) below',S.T.warning]].map(([k,l,c])=>(
              <div key={k}><label style={{...S.label,color:c}}>{l}</label>
                <input type="number" step="0.1" style={S.input} value={draft.spm[k]||''} onChange={e=>setDraft(d=>({...d,spm:{...d.spm,[k]:parseFloat(e.target.value)||0}}))}/>
              </div>
            ))}
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:14,borderTop:`1px solid ${S.T.border}`}}>
            <button style={S.btnSecondary} onClick={handleReset}>Reset to Default</button>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              {saved&&<span style={{fontSize:12,color:S.T.success,fontWeight:700}}>✓ Saved</span>}
              <button style={S.btn} onClick={handleSave}>Save Limits</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ActionChip({action,onEdit,onDelete,onEmail}){

  const msColor=S.T[machineStatusColor(action.machineStatus)]||S.T.info;
  const asColor={Open:S.T.danger,'In Progress':S.T.warning,Closed:S.T.success}[action.actionStatus]||S.T.info;

    <div style={{...S.card,marginBottom:8,padding:0,overflow:'hidden'}}>
      {/* Compact header */}
